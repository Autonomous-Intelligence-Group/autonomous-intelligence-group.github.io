</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="45" data-paginate="true" data-footer="KAU · Autonomous Robotic Systems Engineering · Lecture 2" data-theme="kau" lang="en-US" data-marpit-pagination="45" style="--paginate:true;--footer:KAU · Autonomous Robotic Systems Engineering · Lecture 2;--theme:kau;" data-marpit-pagination-total="53">
<h2 id="how-it-writes">How It Writes</h2>
<pre><code class="language-python">pub = node.create_publisher(TwistMsg, <span class="hljs-string">&#x27;cmd_vel&#x27;</span>, <span class="hljs-number">10</span>)      <span class="hljs-comment"># RELATIVE name — no leading slash</span>
…
twist.linear.x  = x * speed                               <span class="hljs-comment"># the table entry, scaled</span>
twist.angular.z = th * turn
pub.publish(twist)
…
<span class="hljs-keyword">finally</span>:
    pub.publish(TwistMsg())                               <span class="hljs-comment"># all zeros, on the way out</span>
</code></pre>
<ul>
<li><code>speed</code> starts at <strong>0.5 m/s</strong> and <code>turn</code> at <strong>1.0 rad/s</strong>; <code>q</code> and <code>z</code> scale them as you go</li>
<li><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a0.svg" data-marp-twemoji=""/> Those are <strong>read-only parameters</strong>: <code>ros2 param set</code> will refuse them. Set them when you start the program</li>
<li>That <code>finally</code> is the difference between letting go of the keyboard and watching your robot leave</li>
</ul>
<p><span class="src"><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3af.svg" data-marp-twemoji=""/> <a href="https://github.com/ros2/teleop_twist_keyboard/blob/jazzy/teleop_twist_keyboard.py">github.com/ros2/teleop_twist_keyboard/blob/jazzy/teleop_twist_keyboard.py</a></span></p>
<footer>KAU · Autonomous Robotic Systems Engineering · Lecture 2</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="46" data-paginate="true" data-footer="KAU · Autonomous Robotic Systems Engineering · Lecture 2" data-theme="kau" lang="en-US" data-marpit-pagination="46" style="--paginate:true;--footer:KAU · Autonomous Robotic Systems Engineering · Lecture 2;--theme:kau;" data-marpit-pagination-total="53">
<h2 id="why-this-drives-anything">Why This Drives Anything</h2>
<div style="text-align:center">
<svg width="990" height="210" viewBox="0 0 990 210" style="max-width:100%">
  <g fill="none" stroke="#111" stroke-width="1.5" font-family="DM Sans, sans-serif" font-size="13">
    <rect x="4" y="46" width="104" height="56" rx="4" />
    <text x="56" y="68" text-anchor="middle" stroke="none" fill="#111" font-weight="bold">a key</text>
    <text x="56" y="86" text-anchor="middle" stroke="none" fill="#666" font-size="11">raw terminal</text>
    <path d="M108 74 L138 74" /><path d="M130 69 L142 74 L130 79" />
    <rect x="142" y="46" width="126" height="56" rx="4" />
    <text x="205" y="68" text-anchor="middle" stroke="none" fill="#111" font-weight="bold">lookup table</text>
    <text x="205" y="86" text-anchor="middle" stroke="none" fill="#666" font-size="11">(x, y, z, th) × speed</text>
    <path d="M268 74 L298 74" /><path d="M290 69 L302 74 L290 79" />
    <rect x="302" y="38" width="238" height="72" rx="4" fill="#f5f5f5" />
    <text x="421" y="62" text-anchor="middle" stroke="none" fill="#111" font-weight="bold" font-size="14">geometry_msgs/msg/Twist</text>
    <text x="421" y="80" text-anchor="middle" stroke="none" fill="#666" font-size="11">published on the topic</text>
    <text x="421" y="98" text-anchor="middle" stroke="none" fill="#111" font-weight="bold" font-size="14">/cmd_vel</text>
    <path d="M540 74 L570 74" /><path d="M562 69 L574 74 L562 79" />
    <rect x="574" y="10" width="186" height="50" rx="4" />
    <text x="667" y="30" text-anchor="middle" stroke="none" fill="#111">Husky</text>
    <text x="667" y="48" text-anchor="middle" stroke="none" fill="#666" font-size="11">DiffDrive reads Twist</text>
    <rect x="574" y="66" width="186" height="50" rx="4" />
    <text x="667" y="86" text-anchor="middle" stroke="none" fill="#111">drone, with its brain</text>
    <text x="667" y="104" text-anchor="middle" stroke="none" fill="#666" font-size="11">velocity control reads Twist</text>
    <rect x="574" y="122" width="186" height="50" rx="4" stroke-dasharray="4 3" />
    <text x="667" y="142" text-anchor="middle" stroke="none" fill="#666">a boat, a rover…</text>
    <text x="667" y="160" text-anchor="middle" stroke="none" fill="#666" font-size="11">anything reading Twist</text>
    <text x="885" y="68" text-anchor="middle" stroke="none" fill="#111" font-size="12" font-weight="bold">the sender never</text>
    <text x="885" y="86" text-anchor="middle" stroke="none" fill="#111" font-size="12" font-weight="bold">learns which</text>
  </g>
</svg>
</div>
<ul>
<li><strong>A standard message</strong> — <code>Twist</code> means the same thing to every mobile robot in ROS 2</li>
<li><strong>A name you can change</strong> — <code>cmd_vel</code> is written with no leading slash, so it can be pointed anywhere without touching the file</li>
<li><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a0.svg" data-marp-twemoji=""/> <strong>The limit:</strong> it will not fly a drone that has only motors. Those read <code>Actuators</code>. Matching <em>types</em> is exactly how far this reaches</li>
</ul>
<footer>KAU · Autonomous Robotic Systems Engineering · Lecture 2</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="47" data-paginate="true" data-footer="KAU · Autonomous Robotic Systems Engineering · Lecture 2" data-theme="kau" lang="en-US" data-marpit-pagination="47" style="--paginate:true;--footer:KAU · Autonomous Robotic Systems Engineering · Lecture 2;--theme:kau;" data-marpit-pagination-total="53">
<h2 id="using-it">Using It</h2>
<pre><code class="language-bash">$ ros2 run teleop_twist_keyboard teleop_twist_keyboard
$ ros2 run teleop_twist_keyboard teleop_twist_keyboard --ros-args --remap cmd_vel:=/my/topic
</code></pre>
<ul>
<li>The same program, unchanged, for the Husky and for a drone that has its brain: after the bridge has renamed things, <strong>both read <code>/cmd_vel</code></strong></li>
<li><code>i</code> drives the Husky forward · <code>t</code> takes the drone up. Same program, same message, different robot</li>
<li>If your robot reads a different topic, <strong>point the program at it</strong> rather than editing it — that is what the remap is for</li>
<li>The simulator and the bridge can be started however you like — a script, a launch file. <strong>This one cannot</strong>: it needs a terminal of its own</li>
</ul>
<footer>KAU · Autonomous Robotic Systems Engineering · Lecture 2</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="48" data-paginate="true" data-footer="KAU · Autonomous Robotic Systems Engineering · Lecture 2" data-class="section" data-theme="kau" lang="en-US" class="section" data-marpit-pagination="48" style="--paginate:true;--footer:KAU · Autonomous Robotic Systems Engineering · Lecture 2;--class:section;--theme:kau;" data-marpit-pagination-total="53">
<h1 id="lab-1">Lab 1</h1>
<p><em>Your first graded work</em></p>
<footer>KAU · Autonomous Robotic Systems Engineering · Lecture 2</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="49" data-paginate="true" data-footer="KAU · Autonomous Robotic Systems Engineering · Lecture 2" data-theme="kau" lang="en-US" data-marpit-pagination="49" style="--paginate:true;--footer:KAU · Autonomous Robotic Systems Engineering · Lecture 2;--theme:kau;" data-marpit-pagination-total="53">
<h2 id="lab-1--what-you-do">Lab 1 — What You Do</h2>
<p><strong>Take a standard robot off the shelf, and drive it from ROS 2.</strong> Any model in the catalogue; wheels or rotors, your choice.</p>
<ol>
<li><strong>Choose and check</strong> — run the checks before you commit to a model</li>
<li><strong>Your own world</strong> — a ground plane and an <code>&lt;include&gt;</code>, plus whatever plugin that model needs to move</li>
<li><strong>Bridge it, both ways</strong> — commands in, odometry out. Only the entries you use</li>
<li><strong>Read the telemetry</strong> — a small node that subscribes to <code>/odom</code> and reports where the robot is</li>
<li><strong>Drive it from the command line</strong> — and check the distance against what you asked for</li>
<li><strong>Then from the keyboard</strong> — <code>teleop_twist_keyboard</code>, with no changes to it</li>
<li><strong>Show the path</strong> — in RViz, <strong>and</strong> as a plot drawn from <code>/odom</code></li>
</ol>
<p>You are given a repository with the skeleton in it. Work in that.</p>
<footer>KAU · Autonomous Robotic Systems Engineering · Lecture 2</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="50" data-paginate="true" data-footer="KAU · Autonomous Robotic Systems Engineering · Lecture 2" data-theme="kau" lang="en-US" data-marpit-pagination="50" style="--paginate:true;--footer:KAU · Autonomous Robotic Systems Engineering · Lecture 2;--theme:kau;" data-marpit-pagination-total="53">
<h2 id="lab-1--what-it-ships">Lab 1 — What It Ships</h2>
<table>
<thead>
<tr>
<th>In the README</th>
<th>What goes in it</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Run</strong></td>
<td>the exact commands, from zero, on a machine that is not yours</td>
</tr>
<tr>
<td><strong>See</strong></td>
<td>the path: a screenshot from RViz <strong>and</strong> a plot drawn from <code>/odom</code></td>
</tr>
<tr>
<td><strong>Numbers</strong></td>
<td>the distance you asked for, the distance you got, and the difference</td>
</tr>
<tr>
<td><strong>Compare</strong></td>
<td>driving from the command line against driving from the keyboard — a paragraph, not an essay</td>
</tr>
<tr>
<td><strong><code>notes.txt</code></strong></td>
<td>what broke, what you tried, what is still unclear. It cannot lower your mark</td>
</tr>
</tbody>
</table>
<ul>
<li>The README <strong>is</strong> the deliverable. In a year it is read by an employer, not by me</li>
<li>Two things that will cost you time, so hear them now: the <strong>first run needs the network</strong>, and a model with problems will often not say so</li>
</ul>
<footer>KAU · Autonomous Robotic Systems Engineering · Lecture 2</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="51" data-paginate="true" data-footer="KAU · Autonomous Robotic Systems Engineering · Lecture 2" data-theme="kau" lang="en-US" data-marpit-pagination="51" style="--paginate:true;--footer:KAU · Autonomous Robotic Systems Engineering · Lecture 2;--theme:kau;" data-marpit-pagination-total="53">
<h2 id="lab-1--seven-files">Lab 1 — Seven Files</h2>
<pre><code>my_fuel_lab/
├── package.xml  setup.py  setup.cfg  resource/…   # the usual Python-package wrapping
├── worlds/&lt;name&gt;.sdf        # ground plane, light, &lt;include&gt;, the movement plugin
├── config/bridge.yaml       # both directions, only the entries you use
├── &lt;pkg&gt;/odom_listener.py   # ~30 lines: subscribe to /odom, print where you are
├── scripts/run.sh           # ONE script: simulator + bridge + listener
├── README.md                # Run · See · Numbers · Compare
└── notes.txt
</code></pre>
<ul>
<li><strong>No launch file.</strong> A three-line <code>run.sh</code> does the same and needs nothing explained first</li>
<li><strong>No saved RViz layout.</strong> Three clicks set it up, and doing them by hand teaches more than a file nobody opens</li>
<li>Both arrive later, the moment there are more processes than three</li>
</ul>
<footer>KAU · Autonomous Robotic Systems Engineering · Lecture 2</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="52" data-paginate="true" data-footer="KAU · Autonomous Robotic Systems Engineering · Lecture 2" data-theme="kau" lang="en-US" data-marpit-pagination="52" style="--paginate:true;--footer:KAU · Autonomous Robotic Systems Engineering · Lecture 2;--theme:kau;" data-marpit-pagination-total="53">
<h2 id="lab-1--if-you-want-more">Lab 1 — If You Want More</h2>
<p>Deliberately <strong>not</strong> in the hand-in — Lab 1 must fit in an evening. Pick one for the top mark:</p>
<table>
<thead>
<tr>
<th>Step up to</th>
<th>What it gets you</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>a mission node</strong></td>
<td>~20 lines that drive a fixed sequence, instead of you typing commands. Your first replacement of a stock tool — and it makes two students' runs comparable</td>
</tr>
<tr>
<td><strong><code>ros2 bag</code></strong></td>
<td>record the drive; replay it into RViz with the simulator switched off</td>
</tr>
<tr>
<td><strong>a launch file</strong></td>
<td>start the simulator, the bridge and your node with one command</td>
</tr>
<tr>
<td><strong>a saved RViz layout</strong></td>
<td>for when three clicks stop being enough</td>
</tr>
<tr>
<td><strong>the drone, steered</strong></td>
<td>add the brain plugin and fly it with the same keyboard program</td>
</tr>
</tbody>
</table>
<p>Nothing here is wasted: every row is a later lab, arriving early</p>
<footer>KAU · Autonomous Robotic Systems Engineering · Lecture 2</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="53" data-paginate="true" data-footer="KAU · Autonomous Robotic Systems Engineering · Lecture 2" data-theme="kau" lang="en-US" data-marpit-pagination="53" style="--paginate:true;--footer:KAU · Autonomous Robotic Systems Engineering · Lecture 2;--theme:kau;" data-marpit-pagination-total="53">
