<h2 id="tuning-noise-in-gazebo-the-noise-block">Tuning Noise in Gazebo: the <code>&lt;noise&gt;</code> Block</h2>
<div class="cols">
<div>
<div class="file">URDF · inside the lidar's <code>&lt;lidar&gt;</code></div>
<pre><code class="language-xml"><span class="hljs-tag">&lt;<span class="hljs-name">noise</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">type</span>&gt;</span>gaussian<span class="hljs-tag">&lt;/<span class="hljs-name">type</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">mean</span>&gt;</span>0.0<span class="hljs-tag">&lt;/<span class="hljs-name">mean</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">stddev</span>&gt;</span>0.01<span class="hljs-tag">&lt;/<span class="hljs-name">stddev</span>&gt;</span>
<span class="hljs-tag">&lt;/<span class="hljs-name">noise</span>&gt;</span>
</code></pre>
<ol>
<li>Pick σ from the datasheet</li>
<li>Write it into <code>&lt;noise&gt;</code></li>
<li>Relaunch: the robot description is read once, at spawn</li>
<li>Measure σ with the robot standing still</li>
<li>Compare with what you wrote; adjust</li>
</ol>
</div>
<div>
<figure>
<img src="img/noise-one-scan.png" alt="The forward wall close up, one scan with stddev 0.01: the points scatter a little in front of and behind the wall's face" style="height:230px" />
<figcaption>RViz, measured in our setup: one scan; Grid 0.1 m in <code>lidar_link</code> — its middle line is the wall's face, 2.0 m away.</figcaption>
</figure>
</div>
</div>
<p><span class="src"><img class="emoji" draggable="false" alt="▶️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/25b6.svg" data-marp-twemoji=""/> <a href="https://docs.nav2.org/jazzy/configuration_and_development/first_time_robot_setup_guide/sensors/setup_sensors_gz/">docs.nav2.org/jazzy/configuration_and_development/first_time_robot_setup_guide/sensors/setup_sensors_gz/</a></span></p>
<footer>KAU · Autonomous Robotic Systems Engineering · Lecture 5</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-paginate="true" data-footer="KAU · Autonomous Robotic Systems Engineering · Lecture 5" data-theme="kau" lang="en-US" data-marpit-pagination="31" style="--paginate:true;--footer:KAU · Autonomous Robotic Systems Engineering · Lecture 5;--theme:kau;" data-marpit-pagination-total="50">
<h2 id="seeing-noise-rviz-decay-time">Seeing Noise: RViz Decay Time</h2>
<ul>
<li>One scan hardly shows noise: every ray gets a new random error, every scan</li>
<li><strong>Decay Time</strong> keeps old scans on the screen: 3 s means 30 scans on top of each other</li>
<li><strong>How it is shown:</strong> RViz looks down at the wall ahead — the middle grid line is the wall's face; a ray's 30 readings scatter along the ray, so each ray draws a streak across the wall</li>
<li>σ = 0: a thin line · σ = 0.01 m: a band ≈ 4 cm, 95 % within ±2σ · σ = 0.05 m: ≈ 20 cm</li>
</ul>
<figure>
<img src="img/noise-band.gif" alt="The RViz window: the Displays panel open on LaserScan with Decay Time 3, and the forward wall close up — with stddev 0 the points sit on one grid line, with 0.01 each ray smears into a short streak, with 0.05 into a long one" style="height:260px" />
<figcaption>RViz, measured in our setup: 30 scans on top of each other; Grid 0.1 m in <code>lidar_link</code> — its middle line is the wall's face.</figcaption>
</figure>
<p><span class="src"><img class="emoji" draggable="false" alt="📖" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4d6.svg" data-marp-twemoji=""/> <a href="https://docs.ros.org/en/jazzy/Tutorials/Intermediate/RViz/RViz-User-Guide/RViz-User-Guide.html">docs.ros.org/en/jazzy/Tutorials/Intermediate/RViz/RViz-User-Guide/RViz-User-Guide.html</a></span></p>
<footer>KAU · Autonomous Robotic Systems Engineering · Lecture 5</footer>
</section>

<div class="lg">
<div>

r"><span class="vlist" style="height:0.7693em;"><span></span></span></span></span></span><span class="mclose nulldelimiter"></span></span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mop op-limits"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:1.8283em;"><span style="top:-1.8723em;margin-left:0em;"><span class="pstrut" style="height:3.05em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mathnormal mtight">i</span><span class="mrel mtight">=</span><span class="mord mtight">1</span></span></span></span><span style="top:-3.05em;"><span class="pstrut" style="height:3.05em;"></span><span><span class="mop op-symbol large-op">∑</span></span></span><span style="top:-4.3em;margin-left:0em;"><span class="pstrut" style="height:3.05em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mathnormal mtight" style="margin-right:0.109em;">N</span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:1.2777em;"><span></span></span></span></span></span><span class="mopen">(</span><span class="mord"><span class="mord mathnormal" style="margin-right:0.044em;">z</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3117em;"><span style="top:-2.55em;margin-left:-0.044em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight">i</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">−</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mord accent"><span class="vlist-t"><span class <p><strong>Legend</strong><br />
<span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>z</mi><mi>i</mi></msub></mrow><annotation encoding="application/x-tex">z_i</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.5806em;vertical-align:-0.15em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.044em;">z</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3117em;"><span style="top:-2.55em;margin-left:-0.044em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight">i</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span></span></span></span> — the i-th reading, m<br />
<span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mover accent="true"><mi>z</mi><mo>ˉ</mo></mover></mrow><annotation encoding="application/x-tex">\bar z</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.5678em;"></span><span class="mord accent"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.5678em;"><span style="top:-3em;"><span class="pstrut" style="height:3em;"></span><span class="mord mathnormal" style="margin-right:0.044em;">z</span></span><span style="top:-3em;"><span class="pstrut" style="height:3em;"></span><span class="accent-body" style="left:-0.1944em;"><span class="mord">ˉ</span></span></span></span></span></span></span></span></span></span> — their mean, <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mo stretchy="false">(</mo><msub><mi>z</mi><mn>1</mn></msub><mo>+</mo><mo>⋯</mo><mo>+</mo><msub><mi>z</mi><mi>N</mi></msub><mo stretchy="false">)</mo><mtext> </mtext><mi mathvariant="normal">/</mi><mtext> </mtext><mi>N</mi></mrow><annotation encoding="application/x-tex">(z_1 + \dots + z_N)\,/\,N</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mopen">(</span><span class="mord"><span class="mord mathnormal" style="margin-right:0.044em;">z</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3011em;"><span style="top:-2.55em;margin-left:-0.044em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight">1</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">+</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:0.6667em;vertical-align:-0.0833em;"></span><span class="minner">⋯</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">+</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.044em;">z</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3283em;"><span style="top:-2.55em;margin-left:-0.044em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight" style="margin-right:0.109em;">N</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mclose">)</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord">/</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord mathnormal" style="margin-right:0.109em;">N</span></span></span></span>, m<br />
<span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>N</mi></mrow><annotation encoding="application/x-tex">N</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.109em;">N</span></span></span></span> — readings<br />
<span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mover accent="true"><mi>σ</mi><mo>^</mo></mover></mrow><annotation encoding="application/x-tex">\hat\sigma</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6944em;"></span><span class="mord accent"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.6944em;"><span style="top:-3em;"><span class="pstrut" style="height:3em;"></span><span class="mord mathnormal" style="margin-right:0.0359em;">σ</span></span><span style="top:-3em;"><span class="pstrut" style="height:3em;"></span><span class="accent-body" style="left:-0.25em;"><span class="mord">^</span></span></span></span></span></span></span></span></span></span> — the measured spread, m<br />
<span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>N</mi><mo>−</mo><mn>1</mn></mrow><annotation encoding="application/x-tex">N - 1</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.7667em;vertical-align:-0.0833em;"></span><span class="mord mathnormal" style="margin-right:0.109em;">N</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">−</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:0.6444em;"></span><span class="mord">1</span></span></span></span>, not <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>N</mi></mrow><annotation encoding="application/x-tex">N</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.109em;">N</span></span></span></span>: <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mover accent="true"><mi>z</mi><mo>ˉ</mo></mover></mrow><annotation encoding="application/x-tex">\bar z</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.5678em;"></span><span class="mord accent"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.5678em;"><span style="top:-3em;"><span class="pstrut" style="height:3em;"></span><span class="mord mathnormal" style="margin-right:0.044em;">z</span></span><span style="top:-3em;"><span class="pstrut" style="height:3em;"></span><span class="accent-body" style="left:-0.1944em;"><span class="mord">ˉ</span></span></span></span></span></span></span></span></span></span> came from the same readings<br />
a histogram — how many readings fall into each small interval</p>
</div>
</div>
<footer>KAU · Autonomous Robotic Systems Engineering · Lecture 5</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="33" data-paginate="true" data-footer="KAU · Autonomous Robotic Systems Engineering · Lecture 5" data-theme="kau" lang="en-US" data-marpit-pagination="33" style="--paginate:true;--footer:KAU · Autonomous Robotic Systems Engineering · Lecture 5;--theme:kau;" data-marpit-pagination-total="50">
<h2 id="how-many-scans-are-enough">How Many Scans Are Enough?</h2>
<ul>
<li>The measured σ wanders for a few scans and settles as N grows — like any average: the more readings, the steadier</li>
<li>The dashed band shows how far it can still be off; it narrows to ±10 % at about 200 scans — 20 s at 10 Hz</li>
<li>±5 % takes about four times as many: the error shrinks only with the square root of N</li>
</ul>
<figure>
<img src="img/sigma-converge.svg" alt="The sigma measured from the first N scans, for 11 rays: a wide spread at small N, settling on 0.01; a dashed band that holds them narrows to plus or minus 10 percent at about 200 scans" style="height:330px" />
<figcaption>Measured in our setup: 11 rays × 500 scans, <code>&lt;stddev&gt;</code> 0.01; dashed — where 95 % of the estimates fall.</figcaption>
</figure>
<footer>KAU · Autonomous Robotic Systems Engineering · Lecture 5</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="34" data-paginate="true" data-footer="KAU · Autonomous Robotic Systems Engineering · Lecture 5" data-class="question" data-theme="kau" lang="en-US" class="question" data-marpit-pagination="34" style="--paginate:true;--footer:KAU · Autonomous Robotic Systems Engineering · Lecture 5;--class:question;--theme:kau;" data-marpit-pagination-total="50">
<h2 id="the-mean-is-20-m-in-the-world-the-walls-face-is-at-21-m-is-the-lidar-biased">The mean is 2.0 m. In the world the wall's face is at 2.1 m. Is the lidar biased?</h2>
<footer>KAU · Autonomous Robotic Systems Engineering · Lecture 5</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="35" data-paginate="true" data-footer="KAU · Autonomous Robotic Systems Engineering · Lecture 5" data-theme="kau" lang="en-US" data-marpit-pagination="35" style="--paginate:true;--footer:KAU · Autonomous Robotic Systems Engineering · Lecture 5;--theme:kau;" data-marpit-pagination-total="50">
<h2 id="answer-measure-from-the-lidar-not-from-the-robot">Answer: Measure From the Lidar, Not From the Robot</h2>
<div class="cols">
<div>
<ul>
<li>In the world file the wall's centre is at x = 2.2 m and it is 0.2 m thick → its face is at 2.1 m</li>
<li>The lidar sits 0.1 m ahead of <code>base_link</code>:</li>
</ul>
<pre><code class="language-bash">$ ros2 run tf2_ros tf2_echo base_link lidar_link
- Translation: [0.100, 0.000, 0.150]
</code></pre>
<ul>
<li>Expected: 2.1 − 0.1 = <strong>2.0 m</strong> — no bias</li>
</ul>
</div>
<div>
<figure>
<img src="img/lidar-offset.svg" alt="From above: the wall centre at 2.2 and its face at 2.1; base_link at 0 and lidar_link 0.10 ahead; 2.1 metres from base_link to the face, 2.0 metres from the lidar" style="height:380px" />
<figcaption>Our drawing, numbers from the world file and the URDF.</figcaption>
</figure>
</div>
</div>
<footer>KAU · Autonomous Robotic Systems Engineering · Lecture 5</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="36" data-paginate="true" data-footer="KAU · Autonomous Robotic Systems Engineering · Lecture 5" data-theme="kau" lang="en-US" data-marpit-pagination="36" style="--paginate:true;--footer:KAU · Autonomous Robotic Systems Engineering · Lecture 5;--theme:kau;" data-marpit-pagination-total="50">
<h2 id="bias-mean-moves-the-wall">Bias: <code>&lt;mean&gt;</code> Moves the Wall</h2>
<ul>
<li><code>&lt;mean&gt;</code> ≠ 0 adds the same error to every reading — the scan leaves the wall</li>
<li>More scans will not remove it: a bias does not average out</li>
<li>Calibration removes it; a filter can only if it estimates the bias too — later, the gyroscope's bias in sensor fusion</li>
</ul>
<figure>
<img src="img/bias-shift.gif" alt="The forward wall close up in RViz: with mean 0 the band sits on the grid line of the wall's face, with 0.05 and 0.10 it moves into the wall, by the mean" style="height:230px" />
<figcaption>RViz, measured in our setup: <code>&lt;stddev&gt;</code> 0.01, Decay Time 1 s; Grid 0.1 m in <code>lidar_link</code> — the face on its middle line, 0.05 m is half a cell.</figcaption>
</figure>
<footer>KAU · Autonomous Robotic Systems Engineering · Lecture 5</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="37" data-marpit-scope-DgbIofrF="" data-paginate="true" data-footer="KAU · Autonomous Robotic Systems Engineering · Lecture 5" data-theme="kau" lang="en-US" data-marpit-pagination="37" style="--paginate:true;--footer:KAU · Autonomous Robotic Systems Engineering · Lecture 5;--theme:kau;" data-marpit-pagination-total="50">
<h2 id="choosing-%CF%83-read-the-datasheet">Choosing σ: Read the Datasheet</h2>

<table>
<thead>
<tr>
<th>lidar</th>
<th>accuracy as printed</th>
<th>how to read it</th>
<th>σ to set</th>
</tr>
</thead>
<tbody>
<tr>
<td>Hokuyo URG-04LX-UG01</td>
<td>±30 mm (0.06–1 m), ±3 % beyond</td>
<td>Gazebo's own example: ±30 mm = 3σ</td>
<td>0.01 m</td>
</tr>
<tr>
<td>LDS-01 (TurtleBot 3)</td>
<td>accuracy ±15 mm, precision ±10 mm (0.12–0.5 m)</td>
<td>precision as 3σ, by the rule below</td>
<td>≈ 0.003 m</td>
</tr>
<tr>
<td>SICK TiM551</td>
<td>systematic ±60 mm, statistical 20 mm</td>
<td>systematic → a bias; statistical → a spread, but σ or 3σ? The sheet does not say</td>
<td>measure it</td>
</tr>
</tbody>
</table>
<ul>
<li>«±30 mm» with no note: read it as 3σ — 99.7 % of readings within ±30 mm, so σ = 0.01 m, as Gazebo's own example does</li>
<li>An error in % of the distance: σ at your working distance — Gazebo has one σ for every distance</li>
</ul>
<figure>
<img src="img/datasheet-error.svg" alt="Plus-minus error in millimetres against distance: Hokuyo 30 mm then 3 percent, LDS-01 15 mm then 5 percent, SICK statistical 20 mm flat, Gazebo plus-minus three sigma 30 mm flat" style="height:230px" />
<figcaption>Our plot of the three datasheets' printed accuracy.</figcaption>
</figure>
<p><span class="src"><img class="emoji" draggable="false" alt="📖" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4d6.svg" data-marp-twemoji=""/> <a href="https://gazebosim.org/docs/harmonic/spawn_urdf">gazebosim.org/docs/harmonic/spawn_urdf</a></span></p>
<footer>KAU · Autonomous Robotic Systems Engineering · Lecture 5</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="38" data-paginate="true" data-footer="KAU · Autonomous Robotic Systems Engineering · Lecture 5" data-theme="kau" lang="en-US" data-marpit-pagination="38" style="--paginate:true;--footer:KAU · Autonomous Robotic Systems Engineering · Lecture 5;--theme:kau;" data-marpit-pagination-total="50">
<h2 id="noise-that-varies-by-place-and-time">Noise That Varies by Place and Time</h2>
<div class="cols">
<div>
<ul>
<li>Gazebo's <code>&lt;noise&gt;</code> has one σ: the same everywhere, all the time</li>
<li>A bad zone or a sudden failure: put a small node between Gazebo and your code — it reads <code>/scan</code>, adds noise by the robot's position or by the time, and publishes the same <code>LaserScan</code></li>
<li>The same message type in and out: your code cannot tell — like the keyboard driving any robot in the first lab</li>
<li>Built into Gazebo: a slippery floor patch (<code>mu</code>) for the wheels; a bias that drifts with time for the IMU</li>
<li>Later: SLAM and localization must survive exactly this</li>
</ul>
</div>
<div>
<figure>
<img src="img/noise-zones.gif" alt="The room from above in RViz, Decay Time 1 s: as the robot crosses the middle grid line into the bad half, the thin lines on the walls widen into fuzzy bands" style="height:300px" />
<figcaption>RViz, measured in our setup: <code>&lt;stddev&gt;</code> 0.01; right of the middle grid line our node adds noise up to σ 0.05; LaserScan Size 0.05.</figcaption>
</figure>
</div>
</div>
<footer>KAU · Autonomous Robotic Systems Engineering · Lecture 5</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="39" data-marpit-scope-L9CX092c="" data-paginate="true" data-footer="KAU · Autonomous Robotic Systems Engineering · Lecture 5" data-theme="kau" lang="en-US" data-marpit-pagination="39" style="--paginate:true;--footer:KAU · Autonomous Robotic Systems Engineering · Lecture 5;--theme:kau;" data-marpit-pagination-total="50">
<h2 id="imu-noise-bias-drift-rounding">IMU Noise: Bias, Drift, Rounding</h2>
<div class="cols">
<div>
<table>
<thead>
<tr>
<th>element</th>
<th>models</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>stddev</code></td>
<td>jitter, new in every reading</td>
</tr>
<tr>
<td><code>bias_mean</code>, <code>bias_stddev</code></td>
<td>an offset, drawn once per run — its sign at random: +0.01 in one run, −0.01 in the next (measured)</td>
</tr>
<tr>
<td><code>dynamic_bias_stddev</code>, <code>dynamic_bias_correlation_time</code></td>
<td>an offset that wanders slowly — a typical time is 3600 s</td>
</tr>
<tr>
<td><code>precision</code>, type <code>gaussian_quantized</code></td>
<td>rounding to steps</td>
</tr>
</tbody>
</table>
</div>
<div>
<div class="file">URDF · inside the IMU's <code>&lt;sensor&gt;</code></div>
<pre><code class="language-xml"><span class="hljs-tag">&lt;<span class="hljs-name">imu</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">angular_velocity</span>&gt;</span>
    <span class="hljs-tag">&lt;<span class="hljs-name">z</span>&gt;</span>
      <span class="hljs-tag">&lt;<span class="hljs-name">noise</span> <span class="hljs-attr">type</span>=<span class="hljs-string">&quot;gaussian&quot;</span>&gt;</span>
        <span class="hljs-tag">&lt;<span class="hljs-name">stddev</span>&gt;</span>…<span class="hljs-tag">&lt;/<span class="hljs-name">stddev</span>&gt;</span>
        <span class="hljs-tag">&lt;<span class="hljs-name">bias_mean</span>&gt;</span>…<span class="hljs-tag">&lt;/<span class="hljs-name">bias_mean</span>&gt;</span>
        …
      <span class="hljs-tag">&lt;/<span class="hljs-name">noise</span>&gt;</span>
    <span class="hljs-tag">&lt;/<span class="hljs-name">z</span>&gt;</span>
  <span class="hljs-tag">&lt;/<span class="hljs-name">angular_velocity</span>&gt;</span>
<span class="hljs-tag">&lt;/<span class="hljs-name">imu</span>&gt;</span>
</code></pre>
</div>
</div>
<figure>
<img src="img/gyro-bias.svg" alt="Histograms of the gyroscope's z at rest, each with a dashed Gaussian bell: with bias_mean 0 the bell sits on 0; with bias_mean 0.01 this run drew minus 0.01 and the same-width bell sits there; sigma 0.0020 in both" style="height:178px" />
<figcaption>Measured in our setup: stddev 0.002 rad/s in both runs; dashed — the Gaussian with each run's mean and σ.</figcaption>
</figure>
<p><span class="src"><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3af.svg" data-marp-twemoji=""/> <a href="https://github.com/gazebosim/ros_gz/blob/jazzy/ros_gz_interfaces/msg/SensorNoise.msg">github.com/gazebosim/ros_gz/blob/jazzy/ros_gz_interfaces/msg/SensorNoise.msg</a></span></p>
<footer>KAU · Autonomous Robotic Systems Engineering · Lecture 5</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="40" data-paginate="true" data-footer="KAU · Autonomous Robotic Systems Engineering · Lecture 5" data-theme="kau" lang="en-US" data-marpit-pagination="40" style="--paginate:true;--footer:KAU · Autonomous Robotic Systems Engineering · Lecture 5;--theme:kau;" data-marpit-pagination-total="50">
<h2 id="a-biased-gyro-yaw-creeps-away">A Biased Gyro: Yaw Creeps Away</h2>
<div class="lg">
<div>
<p><span class="katex-display"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mstyle mathcolor="#d62728"><msub><mi>ψ</mi><mrow><mi>e</mi><mi>r</mi><mi>r</mi></mrow></msub></mstyle><mo stretchy="false">(</mo><mi>t</mi><mo stretchy="false">)</mo><mo>=</mo><mi>b</mi><mtext> </mtext><mi>t</mi></mrow><annotation encoding="application/x-tex">\textcolor{#d62728}{\psi_{err}}(t) = b\,t
</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord" style="color:#d62728;"><span class="mord mathnormal" style="margin-right:0.0359em;color:#d62728;">ψ</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.1514em;"><span style="top:-2.55em;margin-left:-0.0359em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight" style="color:#d62728;"><span class="mord mtight" style="color:#d62728;"><span class="mord mathnormal mtight" style="margin-right:0.0278em;color:#d62728;">er</span><span class="mord mathnormal mtight" style="margin-right:0.0278em;color:#d62728;">r</span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mopen">(</span><span class="mord mathnormal">t</span><span class="mclose">)</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.6944em;"></span><span class="mord mathnormal">b</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord mathnormal">t</span></span></span></span></span></p><p><em>How far the integrated yaw is off after t seconds — why a gyroscope alone drifts</em></p>
<ul>
<li>b = 0.01 rad/s → 0.6 rad ≈ 34° in a minute — our run: 34° after 60 s</li>
<li>An accelerometer integrated twice: the position error grows as t² — seconds, not minutes</li>
<li>Later: sensor fusion — the wheels and the gyroscope check each other</li>
</ul>
<figure>
<img src="img/gyro-drift.svg" alt="The yaw integrated from a gyroscope with a bias of 0.01 rad/s (this run: minus) runs away from the true one; the shaded yaw error grows in a straight line to 34 degrees after one minute" style="height:215px" />
<figcaption>Measured: the same one-minute IMU run, with bias_mean 0.01 rad/s.</figcaption>
</figure>
</div>
<div class="legend">
<p><strong>Legend</strong><br />
<span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mstyle mathcolor="#d62728"><msub><mi>ψ</mi><mrow><mi>e</mi><mi>r</mi><mi>r</mi></mrow></msub></mstyle></mrow><annotation encoding="application/x-tex">\textcolor{#d62728}{\psi_{err}}</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.8889em;vertical-align:-0.1944em;"></span><span class="mord" style="color:#d62728;"><span class="mord mathnormal" style="margin-right:0.0359em;color:#d62728;">ψ</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.1514em;"><span style="top:-2.55em;margin-left:-0.0359em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight" style="color:#d62728;"><span class="mord mtight" style="color:#d62728;"><span class="mord mathnormal mtight" style="margin-right:0.0278em;color:#d62728;">er</span><span class="mord mathnormal mtight" style="margin-right:0.0278em;color:#d62728;">r</span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span></span></span></span> — yaw error: the integrated yaw minus the true one, rad<br />
<span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>b</mi></mrow><annotation encoding="application/x-tex">b</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6944em;"></span><span class="mord mathnormal">b</span></span></span></span> — the gyroscope's bias, rad/s<br />
<span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>t</mi></mrow><annotation encoding="application/x-tex">t</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6151em;"></span><span class="mord mathnormal">t</span></span></span></span> — time since the start, s<br />
<span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>b</mi><mtext> </mtext><mi>t</mi></mrow><annotation encoding="application/x-tex">b\,t</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6944em;"></span><span class="mord mathnormal">b</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord mathnormal">t</span></span></span></span> — a constant integrated once: a straight line<br />

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="41" data-marpit-scope-QLxoOBqo="" data-paginate="true" data-footer="KAU · Autonomous Robotic Systems Engineering · Lecture 5" data-theme="kau" lang="en-US" data-marpit-pagination="41" style="--paginate:true;--footer:KAU · Autonomous Robotic Systems Engineering · Lecture 5;--theme:kau;" data-marpit-pagination-total="50">
<h2 id="uncertainty-beyond-the-sensor">Uncertainty Beyond the Sensor</h2>
<div class="cols">
<div>
<table>
<thead>
<tr>
<th>mechanism</th>
<th>in Gazebo</th>
<th>effect</th>
</tr>
</thead>
<tbody>
<tr>
<td>friction</td>
<td><code>mu</code>, <code>mu2</code> of a surface</td>
<td>the wheel turns, the robot does not</td>
</tr>
<tr>
<td>controlled slip</td>
<td>the <code>WheelSlip</code> system</td>
<td>slip as a parameter</td>
</tr>
<tr>
<td>moving objects</td>
<td><code>&lt;actor&gt;</code></td>
<td>later: ghosts in a map</td>
</tr>
<tr>
<td>wind</td>
<td>the <code>WindEffects</code> system</td>
<td>drones drift</td>
</tr>
<tr>
<td>timing</td>
<td><code>update_rate</code>, RTF below 1</td>
<td>fewer, later messages</td>
</tr>
<tr>
<td>a noisy pose</td>
<td><code>OdometryPublisher</code>, <code>&lt;gaussian_noise&gt;</code></td>
<td>a noisy «ground truth»</td>
</tr>
<tr>
<td>the random seed</td>
<td><code>gz sim --seed 7</code></td>
<td>the same noise in every run (measured)</td>
</tr>
</tbody>
</table>
</div>
<div>
<figure>
<img src="img/wheel-slip.gif" alt="Top, Gazebo: the robot drives into a wall and stops, its wheels keep turning. Bottom, RViz: the robot drawn by odometry drives on, and its scan slides along with it — the wall and the box move with the robot" style="height:350px" />
<figcaption>Measured in our setup: 0.2 m/s for 10 s — <code>/odom</code> 2.0 m, true 1.0 m; RViz draws the robot, and its scan, where <code>/odom</code> says.</figcaption>
</figure>
</div>
</div>
<p><span class="src"><img class="emoji" draggable="false" alt="📖" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4d6.svg" data-marp-twemoji=""/> <a href="https://gazebosim.org/docs/harmonic/actors">gazebosim.org/docs/harmonic/actors</a></span></p>
<footer>KAU · Autonomous Robotic Systems Engineering · Lecture 5</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="42" data-paginate="true" data-footer="KAU · Autonomous Robotic Systems Engineering · Lecture 5" data-class="section" data-theme="kau" lang="en-US" class="section" data-marpit-pagination="42" style="--paginate:true;--footer:KAU · Autonomous Robotic Systems Engineering · Lecture 5;--class:section;--theme:kau;" data-marpit-pagination-total="50">
<h1 id="where-the-lidar-is-blind">Where the Lidar Is Blind</h1>
<footer>KAU · Autonomous Robotic Systems Engineering · Lecture 5</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="43" data-paginate="true" data-footer="KAU · Autonomous Robotic Systems Engineering · Lecture 5" data-class="question" data-theme="kau" lang="en-US" class="question" data-marpit-pagination="43" style="--paginate:true;--footer:KAU · Autonomous Robotic Systems Engineering · Lecture 5;--class:question;--theme:kau;" data-marpit-pagination-total="50">
<h2 id="a-box-stands-in-front-of-the-robot-the-scan-shows-nothing-the-robot-drives-into-it-why">A box stands in front of the robot. The scan shows nothing. The robot drives into it. Why?</h2>
<footer>KAU · Autonomous Robotic Systems Engineering · Lecture 5</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="44" data-marpit-scope-5jrARcao="" data-paginate="true" data-footer="KAU · Autonomous Robotic Systems Engineering · Lecture 5" data-theme="kau" lang="en-US" data-marpit-pagination="44" style="--paginate:true;--footer:KAU · Autonomous Robotic Systems Engineering · Lecture 5;--theme:kau;" data-marpit-pagination-total="50">
<h2 id="answer-a-2d-lidar-sees-one-plane">Answer: a 2D Lidar Sees One Plane</h2>
<ul>
<li>Our scan plane is 0.25 m above the floor — where <code>lidar_joint</code> puts the lidar in the URDF</li>
<li>Anything lower or higher is invisible: a step, a low box, a table top on legs · later: the navigation costmap misses it too</li>
<li>What helps, later: a depth camera or a 3D lidar sees below and above the plane; a bumper stops the robot on contact</li>
</ul>
<div class="cols">
<div>
<figure>
<img src="img/scan-plane-side.svg" alt="From the side: the scan plane at 0.25 metres passes over a 0.15 metre box and hits the wall" style="height:255px" />
<figcaption>Our drawing: the scan plane from the side.</figcaption>
</figure>
</div>
<div>
<figure>
<img src="img/low-box.gif" alt="Top, Gazebo from the side, just above the scan plane: the rays are a blue band that passes over a low brown box as the robot drives into it. Bottom, RViz: the box has no points on it, the forward ray reads the wall behind it" style="height:300px" />
<figcaption>Measured in our setup: a 0.15 m box 1.0 m ahead, 0.2 m/s; the forward ray reads the wall: 2.0 → 1.0 m.</figcaption>
</figure>
</div>
</div>
<footer>KAU · Autonomous Robotic Systems Engineering · Lecture 5</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="45" data-paginate="true" data-footer="KAU · Autonomous Robotic Systems Engineering · Lecture 5" data-theme="kau" lang="en-US" data-marpit-pagination="45" style="--paginate:true;--footer:KAU · Autonomous Robotic Systems Engineering · Lecture 5;--theme:kau;" data-marpit-pagination-total="50">
<h2 id="too-far-a-hall-bigger-than-range-max">Too Far: a Hall Bigger Than <code>range max</code></h2>
<ul>
<li>A ray that hits nothing within 8 m comes back as <code>inf</code> — in an empty world all 360 rays, with noise too</li>
<li>In a 20 × 20 m hall: 226 of 360 rays hit near a corner, none in the middle (measured) · later: SLAM needs walls in range to match one scan to the next</li>
<li>What helps, later: a lidar with a longer range; odometry and the IMU carry the robot across the empty middle</li>
</ul>
<figure>
<img src="img/hall-range.gif" alt="A 20 by 20 metre hall from above. Left, Gazebo's Visualize Lidar: the rays reach 8 m around the robot; near a corner they touch two walls, in the middle none. Right, RViz: the scan's points on the walls get fewer and vanish" style="height:330px" />
<figcaption>Measured in our setup: left Gazebo's Visualize Lidar — rays that hit nothing are drawn to the full 8 m; right RViz, grid cells 2 m, LaserScan Size 0.4.</figcaption>
</figure>
<footer>KAU · Autonomous Robotic Systems Engineering · Lecture 5</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="46" data-paginate="true" data-footer="KAU · Autonomous Robotic Systems Engineering · Lecture 5" data-theme="kau" lang="en-US" data-marpit-pagination="46" style="--paginate:true;--footer:KAU · Autonomous Robotic Systems Engineering · Lecture 5;--theme:kau;" data-marpit-pagination-total="50">
<h2 id="same-scan-different-place-the-corridor">Same Scan, Different Place: the Corridor</h2>
<ul>
<li>A long smooth corridor looks the same every metre: two scans 1 m apart differ by at most 0.12 mm (measured)</li>
<li>Later: SLAM slides along such a corridor; in two rooms that look alike it may close a loop in the wrong place</li>
<li>What helps, later: odometry and the IMU keep counting the metres the scan cannot see; anything that differs along the way — a door, a camera's view</li>
</ul>
<figure>
<img src="img/corridor-same.gif" alt="A corridor from above, twice. Top, Gazebo with a fixed camera: the fan of blue rays between the two walls travels with the robot. Bottom, RViz following the robot: the grid's lines, fixed in the world, slide past; the scan of the two walls stays the same" style="height:290px" />
<figcaption>Measured in our setup: 8 m at 0.5 m/s. Top, Gazebo: a fixed camera · bottom, RViz: the view follows the robot, the grid stays in <code>world</code>, lines 1 m apart; LaserScan Size 0.08.</figcaption>
</figure>
<footer>KAU · Autonomous Robotic Systems Engineering · Lecture 5</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="47" data-marpit-scope-Pmv6rTYv="" data-paginate="true" data-footer="KAU · Autonomous Robotic Systems Engineering · Lecture 5" data-theme="kau" lang="en-US" data-marpit-pagination="47" style="--paginate:true;--footer:KAU · Autonomous Robotic Systems Engineering · Lecture 5;--theme:kau;" data-marpit-pagination-total="50">
<h2 id="other-failures--glass-mirrors-and-the-wiring">Other Failures — Glass, Mirrors, and the Wiring</h2>
<figure>
<img src="img/lidar-failures.svg" alt="Three scenes from above. Glass: the red beam passes a glass pane and stops on the wall behind; the point is on the wall, the glass is not in the scan. A mirror at 45 degrees: the beam, d1 long, turns and runs d2 to a box; the lidar puts a hollow point straight on at d1 + d2, behind the mirror. A black surface: the beam reaches it, only a faint dashed echo comes back; no point, inf" style="height:180px" />
<figcaption>Our drawing, from above: the lidar times the echo and puts the point straight along the ray.</figcaption>
</figure>
<table>
<thead>
<tr>
<th>failure</th>
<th>what the scan shows</th>
<th>in Gazebo</th>
<th>what helps — later</th>
</tr>
</thead>
<tbody>
<tr>
<td>glass</td>
<td>the wall behind it — the glass is missing</td>
<td>stops on it, like on a wall (measured)</td>
<td>a sensor that sees glass — ultrasonic, a camera; glass on the map</td>
</tr>
<tr>
<td>a mirror</td>
<td>a point straight on, at the whole path's length — where nothing is</td>
<td>not modelled</td>
<td>drop the points that break the map; mirrors on the map</td>
</tr>
<tr>
<td>black</td>
<td>nothing: <code>inf</code>, a gap</td>
<td>stops on it (measured)</td>
<td>a camera beside the lidar; a stronger laser</td>
</tr>
</tbody>
</table>
<ul>
<li>Gazebo draws what is solid: these fail only on a real robot — test there, or add the failure yourself, like the noise zone</li>
<li>Not the sensor but the wiring: no <code>use_sim_time</code>, a wrong <code>frame_id</code>, RTF below 1 — a silent topic or «Showing [0] points»; check <code>ros2 topic hz</code>, <code>tf2_echo</code>, <code>view_frames</code></li>
</ul>
<footer>KAU · Autonomous Robotic Systems Engineering · Lecture 5</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="48" data-marpit-scope-xf3CONiN="" data-paginate="true" data-footer="KAU · Autonomous Robotic Systems Engineering · Lecture 5" data-theme="kau" lang="en-US" data-marpit-pagination="48" style="--paginate:true;--footer:KAU · Autonomous Robotic Systems Engineering · Lecture 5;--theme:kau;" data-marpit-pagination-total="50">
<h2 id="lab-your-own-robot--the-task">Lab: Your Own Robot — the Task</h2>
<div class="cols">
<div>
<ol>
<li><strong>Build your own robot</strong> in URDF: a body and 2 to 4 wheels — the first tutorial below, step by step</li>
<li><strong>Give it a lidar and an IMU</strong>, each with <code>&lt;noise&gt;</code>; the lidar's σ from a real datasheet</li>
<li><strong>Turn on ground truth</strong> — the true pose from Gazebo on <code>/odom_gt</code></li>
<li><strong>Play with the noise:</strong> σ = 0, your σ, a gyroscope bias</li>
<li><strong>Check against ground truth</strong> — how: right</li>
</ol>
</div>
<div>
<figure>
<img src="img/gt-check.svg" alt="Two checks against ground truth. Lidar, the robot standing: /odom_gt gives the robot's x; the wall's face minus x minus the lidar's 0.1 m is the true distance d; the forward ray of /scan over about 200 scans gives a mean and a spread; is the mean d, is the spread the stddev within 10 percent? IMU, the robot turning: /imu's turn rate added up gives a yaw; /odom_gt's orientation gives the true yaw; both against time, without a bias they match" style="height:340px" />
<figcaption>Our drawing: what is compared with what.</figcaption>
</figure>
</div>
</div>
<p><span class="src"><img class="emoji" draggable="false" alt="▶️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/25b6.svg" data-marp-twemoji=""/> the robot: <a href="https://github.com/MOGI-ROS/Week-3-4-Gazebo-basics">github.com/MOGI-ROS/Week-3-4-Gazebo-basics</a><br /><img class="emoji" draggable="false" alt="▶️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/25b6.svg" data-marp-twemoji=""/> the lidar and the IMU: <a href="https://github.com/MOGI-ROS/Week-5-6-Gazebo-sensors">github.com/MOGI-ROS/Week-5-6-Gazebo-sensors</a></span></p>
<footer>KAU · Autonomous Robotic Systems Engineering · Lecture 5</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="49" data-marpit-scope-0YnGGJIQ="" data-paginate="true" data-footer="KAU · Autonomous Robotic Systems Engineering · Lecture 5" data-theme="kau" lang="en-US" data-marpit-pagination="49" style="--paginate:true;--footer:KAU · Autonomous Robotic Systems Engineering · Lecture 5;--theme:kau;" data-marpit-pagination-total="50">
<h2 id="lab-requirements-and-bonus">Lab: Requirements and Bonus</h2>
<div class="cols">
<div>
<h3 id="requirements">Requirements</h3>
<ul>
<li><strong>Build the robot</strong> — a URDF: a body, 2–4 wheels, a lidar and an IMU, each with inertia</li>
<li><strong>Add the Gazebo blocks</strong> — DiffDrive (<code>odom</code> → <code>base_link</code>), friction; the lidar and the IMU with <code>&lt;gz_frame_id&gt;</code></li>
<li><strong>Turn on ground truth</strong> — <code>OdometryPublisher</code> on <code>/odom_gt</code></li>
<li><strong>Create a world</strong> — walls, and the <code>Imu</code> system</li>
<li><strong>Bridge and launch</strong> — clock, cmd_vel, odom, tf, scan, imu, odom_gt; one launch file starts everything</li>
<li><strong>Drive it</strong> — from the command line and the keyboard, as in the first lab</li>
<li><strong>Show it in RViz</strong> — the robot, TF, the scan on the walls, the odometry and ground-truth paths</li>
<li><strong>Give the lidar noise</strong> — σ from a real datasheet in <code>&lt;noise&gt;</code>; the wall with Decay Time, σ = 0 and yours</li>
<li><strong>Measure the noise</strong> — the forward ray's mean and σ, the robot standing, enough scans for ±10 %; a histogram</li>
<li><strong>Give the gyroscope a bias</strong> — in <code>&lt;noise&gt;</code>; the integrated yaw against ground truth</li>
<li><strong>Verify</strong> — the mean = the true distance from ground truth; σ within 10 % of <code>&lt;stddev&gt;</code></li>
</ul>
</div>
<div>
<h3 id="bonus">Bonus</h3>
<ul>
<li><strong>Meshes</strong> — the body from a mesh instead of boxes</li>
<li><strong>Field of view</strong> — <code>samples</code> or the angles: show the effect on the scan</li>
<li><strong>σ against distance</strong> — σ measured at a few distances; Gazebo's one σ against your datasheet's %</li>
<li><strong>The gyroscope's bias from rest</strong> — estimate it from the first seconds at rest, subtract it: does the yaw follow ground truth?</li>
<li><strong>A noise zone</strong> — a node that adds noise by position</li>
<li><strong>σ from a bag</strong> — <code>ros2 bag</code>, without the simulator</li>
</ul>
</div>
</div>
<footer>KAU · Autonomous Robotic Systems Engineering · Lecture 5</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="50" data-paginate="true" data-footer="KAU · Autonomous Robotic Systems Engineering · Lecture 5" data-theme="kau" lang="en-US" data-marpit-pagination="50" style="--paginate:true;--footer:KAU · Autonomous Robotic Systems Engineering · Lecture 5;--theme:kau;" data-marpit-pagination-total="50">

<p><strong>Lecture 6 — State Estimation</strong></p>
<p>A noisy sensor and a model of motion · combined into an estimate better than either · the Kalman filter, step by step · the noise you measure in this lab is what it needs</p>
