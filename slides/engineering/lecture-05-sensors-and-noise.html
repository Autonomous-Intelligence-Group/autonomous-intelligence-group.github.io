<h2 id="what-a-sensor-measures-how-noisy-it-is-and-where-the-lidar-is-blind">What a sensor measures, how noisy it is, and where the lidar is blind</h2>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="2" data-paginate="true" data-footer="KAU · Autonomous Robotic Systems Engineering · Lecture 5" data-theme="kau" lang="en-US" data-marpit-pagination="2" style="--paginate:true;--footer:KAU · Autonomous Robotic Systems Engineering · Lecture 5;--theme:kau;" data-marpit-pagination-total="50">
<h2 id="today-sensors-the-lidar-noise-blind-spots">Today: Sensors, the Lidar, Noise, Blind Spots</h2>
<ul>
<li><strong>What does each sensor really measure?</strong> — the wheel encoder, the IMU, the lidar</li>
<li><strong>How does a lidar see?</strong> — one ray, one scan, one message</li>
<li><strong>How noisy is it?</strong> — a noise model, the <code>&lt;noise&gt;</code> block in Gazebo, a measurement</li>
<li><strong>Where is a 2D lidar blind?</strong> — and what that costs later</li>
</ul>
<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:16px;align-items:end">
<figure><img src="img/encoder-ticks.svg" alt="Encoder ticks against the exact wheel angle" style="height:175px" /><figcaption>What a sensor measures</figcaption></figure>
<figure><img src="img/thumb-rays.png" alt="Gazebo drawing the lidar's rays in our room" style="height:175px" /><figcaption>The lidar</figcaption></figure>
<figure><img src="img/thumb-noise.png" alt="The forward wall close up: noisy readings form a band" style="height:175px" /><figcaption>Noise</figcaption></figure>
<figure><img src="img/thumb-lowbox.png" alt="Our robot next to a low box the scan plane passes over" style="height:175px" /><figcaption>Where it is blind</figcaption></figure>
</div>
<footer>KAU · Autonomous Robotic Systems Engineering · Lecture 5</footer>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="3" data-paginate="true" data-footer="KAU · Autonomous Robotic Systems Engineering · Lecture 5" data-class="question" data-theme="kau" lang="en-US" class="question" data-marpit-pagination="3" style="--paginate:true;--footer:KAU · Autonomous Robotic Systems Engineering · Lecture 5;--class:question;--theme:kau;" data-marpit-pagination-total="50">
<h2 id="a-lidar-2-m-from-a-wall-says-exactly-20-m-every-time-is-it-a-good-lidar">A lidar 2 m from a wall says exactly 2.0 m, every time. Is it a good lidar?</h2>
<footer>KAU · Autonomous Robotic Systems Engineering · Lecture 5</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-paginate="true" data-footer="KAU · Autonomous Robotic Systems Engineering · Lecture 5" data-theme="kau" lang="en-US" data-marpit-pagination="4" style="--paginate:true;--footer:KAU · Autonomous Robotic Systems Engineering · Lecture 5;--theme:kau;" data-marpit-pagination-total="50">
<h2 id="answer-too-good--a-simulated-sensor-is-perfect">Answer: Too Good — a Simulated Sensor Is Perfect</h2>
<ul>
<li>Gazebo returns the exact distance until you add noise: 2.0 m in every scan, spread 0</li>
<li>A real lidar's reading jitters by about a centimetre</li>
<li>Code tuned on a perfect sensor breaks on a real robot</li>
<li>Later: a filter turns a jittery ray into a steady estimate</li>
</ul>
<figure>
<img src="img/ray-flat-vs-noisy.svg" alt="The forward ray over 10 seconds: a flat black line at 2.0 metres without noise, a red line jittering around it with sigma 0.01 metres" style="height:275px" />
<figcaption>Measured in our setup: the forward ray, 100 scans in 10 s, without and with <code>&lt;noise&gt;</code>.</figcaption>
</figure>
<footer>KAU · Autonomous Robotic Systems Engineering · Lecture 5</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-paginate="true" data-footer="KAU · Autonomous Robotic Systems Engineering · Lecture 5" data-class="section" data-theme="kau" lang="en-US" class="section" data-marpit-pagination="5" style="--paginate:true;--footer:KAU · Autonomous Robotic Systems Engineering · Lecture 5;--class:section;--theme:kau;" data-marpit-pagination-total="50">
<h1 id="what-sensors-measure">What Sensors Measure</h1>
<footer>KAU · Autonomous Robotic Systems Engineering · Lecture 5</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-marpit-scope-SQ4hocGM="" data-paginate="true" data-footer="KAU · Autonomous Robotic Systems Engineering · Lecture 5" data-theme="kau" lang="en-US" data-marpit-pagination="6" style="--paginate:true;--footer:KAU · Autonomous Robotic Systems Engineering · Lecture 5;--theme:kau;" data-marpit-pagination-total="50">
<h2 id="sensors-what-they-measure-what-we-compute">Sensors: What They Measure, What We Compute</h2>

<table>
<thead>
<tr>
<th>sensor</th>
<th>measures</th>
<th>we want</th>
<th>how we get there</th>
<th>about</th>
</tr>
</thead>
<tbody>
<tr>
<td>wheel encoder</td>
<td>the wheel's angle</td>
<td>where the robot is</td>
<td>integrate the wheel speeds — what DiffDrive does</td>
<td>itself</td>
</tr>
<tr>
<td>2D lidar</td>
<td>the time of flight along each ray</td>
<td>where the walls are</td>
<td>turn each ray into a point</td>
<td>the world</td>
</tr>
<tr>
<td>gyroscope</td>
<td>the turn rate</td>
<td>the yaw: where the robot faces</td>
<td>integrate</td>
<td>itself</td>
</tr>
<tr>
<td>accelerometer</td>
<td>the specific force</td>
<td>speed; roll and pitch</td>
<td>integrate twice; read gravity</td>
<td>itself</td>
</tr>
</tbody>
</table>
<ul>
<li>Every step from <em>measures</em> to <em>we want</em> adds error — like odometry drift</li>
<li><em>About itself</em>: drifts, nothing outside to check against · <em>about the world</em>: fails where the world looks the same</li>
</ul>
<figure>
<img src="img/sensors-measure.svg" alt="Our robot from above: a lidar ray to a wall, the wheel turning, the IMU chip with the turn rate and the specific force" style="height:205px" />
<figcaption>Our drawing: what each sensor on our robot measures.</figcaption>
</figure>
<p><span class="src"><img class="emoji" draggable="false" alt="📖" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4d6.svg" data-marp-twemoji=""/> <a href="https://rpg.ifi.uzh.ch/docs/teaching/2025/Ch4_AMRobots.pdf">rpg.ifi.uzh.ch/docs/teaching/2025/Ch4_AMRobots.pdf</a></span></p>
<footer>KAU · Autonomous Robotic Systems Engineering · Lecture 5</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-footer="KAU · Autonomous Robotic Systems Engineering · Lecture 5" data-theme="kau" lang="en-US" data-marpit-pagination="7" style="--paginate:true;--footer:KAU · Autonomous Robotic Systems Engineering · Lecture 5;--theme:kau;" data-marpit-pagination-total="50">
<h2 id="the-simplest-slam-a-lidar-and-the-wheels">The Simplest SLAM: a Lidar and the Wheels</h2>
<ul>
<li><strong>SLAM</strong> (Simultaneous Localization and Mapping): build a map and find yourself on it, at the same time</li>
<li>It takes two inputs: <code>/scan</code> from the lidar — what the walls look like — and <code>odom → base_link</code> from the wheel encoders — how far the robot moved between two scans</li>
<li>A gyroscope does not go into SLAM: an EKF fuses it with the wheels into a better <code>odom → base_link</code> — later: sensor fusion</li>
<li>Fusion is inside SLAM too: the odometry predicts, scan matching corrects — later: SLAM</li>
</ul>
<figure>
<img src="img/slam-inputs.svg" alt="The 2D lidar gives /scan and the wheel encoders give odom to base_link through DiffDrive; both go into SLAM, where the odometry predicts and scan matching corrects. An optional gyroscope goes through an EKF into a better odom to base_link, not into SLAM" style="height:235px" />
<figcaption>Our drawing: the gyroscope reaches SLAM only through a better odometry.</figcaption>
</figure>
<p><span class="src"><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3af.svg" data-marp-twemoji=""/> <a href="https://github.com/SteveMacenski/slam_toolbox">github.com/SteveMacenski/slam_toolbox</a></span></p>
<footer>KAU · Autonomous Robotic Systems Engineering · Lecture 5</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-footer="KAU · Autonomous Robotic Systems Engineering · Lecture 5" data-theme="kau" lang="en-US" data-marpit-pagination="8" style="--paginate:true;--footer:KAU · Autonomous Robotic Systems Engineering · Lecture 5;--theme:kau;" data-marpit-pagination-total="50">
<h2 id="wheel-encoder-how-it-counts">Wheel Encoder: How It Counts</h2>
<div class="lg">
<div>
<ul>
<li>A slotted disk turns with the wheel; a sensor counts the slots — <strong>ticks</strong></li>
<li>Two sensors a quarter-slot apart (<em>quadrature</em>): which ticks first gives the direction</li>
</ul>
<p><span class="katex-display"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><msub><mi>θ</mi><mrow><mi>w</mi><mi>h</mi><mi>e</mi><mi>e</mi><mi>l</mi></mrow></msub><mo>=</mo><mn>2</mn><mi>π</mi><mtext> </mtext><mfrac><mi>n</mi><mi>N</mi></mfrac></mrow><annotation encoding="application/x-tex">\theta_{wheel} = 2\pi\,\frac{n}{N}
</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.8444em;vertical-align:-0.15em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0278em;">θ</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3361em;"><span style="top:-2.55em;margin-left:-0.0278em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mathnormal mtight" style="margin-right:0.0269em;">w</span><span class="mord mathnormal mtight">h</span><span class="mord mathnormal mtight">ee</span><span class="mord mathnormal mtight" style="margin-right:0.0197em;">l</span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:1.7936em;vertical-align:-0.686em;"></span><span class="mord">2</span><span class="mord mathnormal" style="margin-right:0.0359em;">π</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord"><span class="mopen nulldelimiter"></span><span class="mfrac"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:1.1076em;"><span style="top:-2.314em;"><span class="pstrut" style="height:3em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.109em;">N</span></span></span><span style="top:-3.23em;"><span class="pstrut" style="height:3em;"></span><span class="frac-line" style="border-bottom-width:0.04em;"></span></span><span style="top:-3.677em;"><span class="pstrut" style="height:3em;"></span><span class="mord"><span class="mord mathnormal">n</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.686em;"><span></span></span></span></span></span><span class="mclose nulldelimiter"></span></span></span></span></span></span></p><p><em>The wheel's angle from the ticks counted so far</em></p>
<ul>
<li>The angle moves in steps of one tick — <em>quantized</em>: <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>N</mi><mo>=</mo><mn>1024</mn></mrow><annotation encoding="application/x-tex">N = 1024</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.109em;">N</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.6444em;"></span><span class="mord">1024</span></span></span></span> → 0.35°</li>
</ul>
<figure>
<img src="img/encoder-disk.svg" alt="A disk with 8 slots and two sensors A and B a quarter of a slot apart, and the two square waves, B a quarter period behind A" style="height:198px" />
<figcaption>Our drawing: 8 slots, fewer than a real disk, so both sensors show; and the two signals.</figcaption>
</figure>
</div>
<div class="legend">
<p><strong>Legend</strong><br />
<span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>n</mi></mrow><annotation encoding="application/x-tex">n</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.4306em;"></span><span class="mord mathnormal">n</span></span></span></span> — ticks counted<br />
<span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>N</mi></mrow><annotation encoding="application/x-tex">N</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.109em;">N</span></span></span></span> — ticks per turn<br />

<h2 id="joint_states-what-the-encoder-gives-ros-2"><code>/joint_states</code>: What the Encoder Gives ROS 2</h2>
<div class="cols">
<div>
<pre><code class="language-bash">$ ros2 interface show sensor_msgs/msg/JointState
<span class="hljs-comment"># … 19 lines of comments: rad or m, rad/s or m/s,</span>
<span class="hljs-comment">#   Nm or N; arrays optional, one size …</span>
std_msgs/Header header
	builtin_interfaces/Time stamp
	string frame_id
string[] name
float64[] position
float64[] velocity
float64[] effort
</code></pre>
<figure>
<img src="img/encoder-ticks.svg" alt="Top: the exact wheel angle and the ticks counted, a staircase under it. Bottom: the speed from ticks per 20 ms jumps between 0 and 0.31 rad/s around the exact 0.20" style="height:170px" />
<figcaption>Measured: <code>/joint_states</code> at 0.02 m/s, counted as a 1024-slot encoder every 20 ms.</figcaption>
</figure>
</div>
<div>
<pre><code class="language-bash">$ ros2 topic <span class="hljs-built_in">echo</span> /joint_states --once     <span class="hljs-comment"># shortened</span>
name: [left_wheel_joint, right_wheel_joint]
position: [1.1814, 1.1814]
velocity: [0.2, 0.2]
effort: [0.0, 0.0]
</code></pre>
<ul>
<li>For SLAM: the two driven wheels — DiffDrive turns their angles into <code>odom → base_link</code></li>
<li>One entry per joint, in the order of <code>name</code>; an empty array — «not reported»</li>
<li><code>effort</code>: the joint's torque, N·m (N for a sliding joint) — a real motor gives it from its current · ours 0.0: DiffDrive sets the wheels' speed, not their torque</li>
<li>Left: at low speed, ticks per <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi mathvariant="normal">Δ</mi><mi>t</mi></mrow><annotation encoding="application/x-tex">\Delta t</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mord">Δ</span><span class="mord mathnormal">t</span></span></span></span> jump 0, 1, 0 · Gazebo's angle is exact, a real one also slips</li>
</ul>
</div>
</div>
<p><span class="src"><img class="emoji" draggable="false" alt="📖" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4d6.svg" data-marp-twemoji=""/> <a href="https://github.com/ros2/common_interfaces/blob/jazzy/sensor_msgs/msg/JointState.msg">github.com/ros2/common_interfaces/blob/jazzy/sensor_msgs/msg/JointState.msg</a></span></p>
<footer>KAU · Autonomous Robotic Systems Engineering · Lecture 5</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-footer="KAU · Autonomous Robotic Systems Engineering · Lecture 5" data-theme="kau" lang="en-US" data-marpit-pagination="10" style="--paginate:true;--footer:KAU · Autonomous Robotic Systems Engineering · Lecture 5;--theme:kau;" data-marpit-pagination-total="50">
<h2 id="accelerometer-a-mass-on-springs">Accelerometer: a Mass on Springs</h2>
<ul>
<li><strong>MEMS</strong> (micro-electro-mechanical system): a tiny mass on springs in a chip</li>
<li>The chip speeds up → the mass lags → the springs stretch → the stretch is measured</li>
<li>It measures <strong>specific force</strong>, m/s²: every push on the robot — not gravity's pull</li>
<li>At rest the floor pushes up: <strong>+9.8 m/s² up</strong>, not 0</li>
</ul>
<figure>
<img src="img/accelerometer-mems.svg" alt="Left: the mass hangs on vertical springs and sags under gravity, the reading is +9.8 up. Right: the chip speeds up to the right, the mass lags to the left, the springs stretch" style="height:230px" />
<figcaption>Our drawing: the proof mass at rest and while the chip speeds up.</figcaption>
</figure>
<p><span class="src"><img class="emoji" draggable="false" alt="▶️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/25b6.svg" data-marp-twemoji=""/> <a href="https://howtomechatronics.com/how-it-works/electrical-engineering/mems-accelerometer-gyrocope-magnetometer-arduino/">howtomechatronics.com/how-it-works/electrical-engineering/mems-accelerometer-gyrocope-magnetometer-arduino/</a><br /><img class="emoji" draggable="false" alt="📖" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4d6.svg" data-marp-twemoji=""/> deeper — errors and drift: <a href="https://www.cl.cam.ac.uk/techreports/UCAM-CL-TR-696.pdf">www.cl.cam.ac.uk/techreports/UCAM-CL-TR-696.pdf</a></span></p>
<footer>KAU · Autonomous Robotic Systems Engineering · Lecture 5</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-marpit-scope-TPRpvpYo="" data-paginate="true" data-footer="KAU · Autonomous Robotic Systems Engineering · Lecture 5" data-theme="kau" lang="en-US" data-marpit-pagination="11" style="--paginate:true;--footer:KAU · Autonomous Robotic Systems Engineering · Lecture 5;--theme:kau;" data-marpit-pagination-total="50">
<h2 id="gyroscope-a-vibrating-mass-and-the-coriolis-effect">Gyroscope: a Vibrating Mass and the Coriolis Effect</h2>

<table>
<thead>
<tr>
<th></th>
<th>the classic gyroscope — the name comes from it</th>
<th>the MEMS gyroscope — in our IMU chip</th>
</tr>
</thead>
<tbody>
<tr>
<td>inside</td>
<td>a wheel spinning fast, in rings that turn freely</td>
<td>a tiny mass that vibrates all the time</td>
</tr>
<tr>
<td>when it turns</td>
<td>the wheel keeps its axis — the rings turn around it</td>
<td>the Coriolis effect pushes the mass sideways, harder the faster it turns</td>
</tr>
<tr>
<td>it gives</td>
<td>the angle between the frame and the axis</td>
<td>the push → <strong>angular velocity</strong>, rad/s — <strong>not</strong> the angle</td>
</tr>
</tbody>
</table>
<div class="cols">
<figure>
<img src="img/gyroscope-operation.gif" alt="An animated classic gyroscope: a golden wheel spins on an axle inside three rings; the rings swing in every direction while the wheel's axle stays upright" style="height:215px" />
<figcaption>«Gyroscope operation», Lucas Vieira — public domain, Wikimedia Commons.</figcaption>
</figure>
<figure>
<img src="img/gyroscope-coriolis.svg" alt="A mass vibrates left and right between two plates; the chip turns; the mass is pushed sideways towards a plate" style="height:200px" />
<figcaption>Our drawing: the vibrating mass and the sideways push. The angle is the turn rate added up — two slides on.</figcaption>
</figure>
</div>
<p><span class="src"><img class="emoji" draggable="false" alt="▶️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/25b6.svg" data-marp-twemoji=""/> <a href="https://howtomechatronics.com/how-it-works/electrical-engineering/mems-accelerometer-gyrocope-magnetometer-arduino/">howtomechatronics.com/how-it-works/electrical-engineering/mems-accelerometer-gyrocope-magnetometer-arduino/</a><br /><img class="emoji" draggable="false" alt="📖" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4d6.svg" data-marp-twemoji=""/> deeper — errors and drift: <a href="https://www.cl.cam.ac.uk/techreports/UCAM-CL-TR-696.pdf">www.cl.cam.ac.uk/techreports/UCAM-CL-TR-696.pdf</a></span></p>
<footer>KAU · Autonomous Robotic Systems Engineering · Lecture 5</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-marpit-scope-T6P9Ls3C="" data-paginate="true" data-footer="KAU · Autonomous Robotic Systems Engineering · Lecture 5" data-theme="kau" lang="en-US" data-marpit-pagination="12" style="--paginate:true;--footer:KAU · Autonomous Robotic Systems Engineering · Lecture 5;--theme:kau;" data-marpit-pagination-total="50">
<h2 id="imu-what-the-imu-gives-ros-2"><code>/imu</code>: What the IMU Gives ROS 2</h2>
<div class="cols">
<div>
<ul>
<li><strong>IMU</strong> (Inertial Measurement Unit): an accelerometer and a gyroscope in one chip</li>
</ul>
<pre><code class="language-bash">$ ros2 interface show sensor_msgs/msg/Imu
<span class="hljs-comment"># Accelerations should be in m/s^2 (not in g&#x27;s),</span>
<span class="hljs-comment"># and rotational velocity should be in rad/sec</span>
<span class="hljs-comment"># … covariance: all zeros = unknown;</span>
<span class="hljs-comment">#   element 0 = -1: no estimate, ignore it …</span>
std_msgs/Header header
geometry_msgs/Quaternion orientation
float64[9] orientation_covariance
geometry_msgs/Vector3 angular_velocity
float64[9] angular_velocity_covariance
geometry_msgs/Vector3 linear_acceleration
float64[9] linear_acceleration_covariance
</code></pre>
<ul>
<li>Frame <code>imu_link</code>, named by <code>&lt;gz_frame_id&gt;</code> · <code>/imu</code> only with the world's <code>Imu</code> system (measured)</li>
</ul>
</div>
<div>
<ul>
<li><code>angular_velocity</code> in rad/s, <code>linear_acceleration</code> in m/s² — not in g</li>
<li><code>orientation</code>: a quaternion, as <code>tf2_echo</code> prints it — no jump at ±180°, no gimbal lock at pitch ±90°, turns combine by multiplying · from the IMU's own filter; a bare chip: −1; Gazebo: the true one (measured)</li>
<li>Covariance: −1 «not provided», zeros «unknown» · ours: σ² of each <code>&lt;noise&gt;</code> on the diagonal (measured) — later</li>
</ul>
<figure>
<img src="img/imu-orientation.svg" alt="Our robot from above twice, with the imu_link axes: red x forward, green y left, blue z up out of the screen. At yaw 0 the orientation is x 0, y 0, z 0, w 1; turned 90 degrees about z it is z 0.707, w 0.707. A turn by theta about the axis n: x, y, z = n times sin theta over 2, w = cos theta over 2" style="height:178px" />
<figcaption>Our drawing, numbers from our Gazebo; axes coloured as in RViz.</figcaption>
</figure>
</div>
</div>
<p><span class="src"><img class="emoji" draggable="false" alt="📖" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4d6.svg" data-marp-twemoji=""/> <a href="https://github.com/ros2/common_interfaces/blob/jazzy/sensor_msgs/msg/Imu.msg">github.com/ros2/common_interfaces/blob/jazzy/sensor_msgs/msg/Imu.msg</a></span></p>
<footer>KAU · Autonomous Robotic Systems Engineering · Lecture 5</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-marpit-scope-gE2ooxHi="" data-paginate="true" data-footer="KAU · Autonomous Robotic Systems Engineering · Lecture 5" data-theme="kau" lang="en-US" data-marpit-pagination="13" style="--paginate:true;--footer:KAU · Autonomous Robotic Systems Engineering · Lecture 5;--theme:kau;" data-marpit-pagination-total="50">

<p><span class="katex-display"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><msub><mi>ψ</mi><mi>k</mi></msub><mo>=</mo><msub><mi>ψ</mi><mrow><mi>k</mi><mo>−</mo><mn>1</mn></mrow></msub><mo>+</mo><msub><mi>ω</mi><mi>z</mi></msub><mtext> </mtext><mi mathvariant="normal">Δ</mi><mi>t</mi></mrow><annotation encoding="application/x-tex">\psi_k = \psi_{k-1} + \omega_z\,\Delta t
</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.8889em;vertical-align:-0.1944em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0359em;">ψ</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3361em;"><span style="top:-2.55em;margin-left:-0.0359em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight" style="margin-right:0.0315em;">k</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.9028em;vertical-align:-0.2083em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0359em;">ψ</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3361em;"><span style="top:-2.55em;margin-left:-0.0359em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mathnormal mtight" style="margin-right:0.0315em;">k</span><span class="mbin mtight">−</span><span class="mord mtight">1</span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.2083em;"><span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">+</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:0.8333em;vertical-align:-0.15em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0359em;">ω</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.1514em;"><span style="top:-2.55em;margin-left:-0.0359em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight" style="margin-right:0.044em;">z</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord">Δ</span><span class="mord mathnormal">t</span></span></span></span></span></p><p><em>Yaw — where the robot faces: add up the turn rate, step by step</em></p>
<figure>

<figcaption>Measured in our setup: a 90° turn at 0.5 rad/s; IMU at 100 Hz.</figcaption>
</figure>

</div>
<ul>
<li>Moving, the robot's own acceleration adds to gravity — one IMU cannot tell a slope from speeding up · later: sensor fusion</li>

<h2 id="the-robot-stands-still-the-accelerometer-reads-98-ms%C2%B2-on-z-is-it-accelerating">The robot stands still. The accelerometer reads +9.8 m/s² on z. Is it accelerating?</h2>
<footer>KAU · Autonomous Robotic Systems Engineering · Lecture 5</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-footer="KAU · Autonomous Robotic Systems Engineering · Lecture 5" data-theme="kau" lang="en-US" data-marpit-pagination="15" style="--paginate:true;--footer:KAU · Autonomous Robotic Systems Engineering · Lecture 5;--theme:kau;" data-marpit-pagination-total="50">
<h2 id="answer-it-measures-specific-force-not-acceleration">Answer: It Measures Specific Force, Not Acceleration</h2>
<div class="cols">
<div>
<pre><code class="language-bash">$ ros2 topic <span class="hljs-built_in">echo</span> /imu --field linear_acceleration --once
x: 0.01918240520398151
y: 0.005574458062445393
z: 9.780245543463543
</code></pre>
<ul>
<li>Not exactly 0 and 9.8: we gave our IMU noise</li>
<li>The floor pushes the robot up — the accelerometer feels that push; in free fall it reads 0</li>
<li>Before integrating for speed, subtract gravity — later, sensor fusion</li>
</ul>
</div>
<div>
<figure>
<img src="img/forces-rest.svg" alt="At rest: gravity pulls down, the floor pushes up, the accelerometer reads +9.8 up. In free fall nothing pushes and it reads 0" style="height:220px" />
<figcaption>Our drawing: what the accelerometer feels.</figcaption>
</figure>
</div>
</div>
<footer>KAU · Autonomous Robotic Systems Engineering · Lecture 5</footer>
</section>

<h1 id="the-lidar">The Lidar</h1>
<footer>KAU · Autonomous Robotic Systems Engineering · Lecture 5</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-marpit-scope-mCWlP49b="" data-paginate="true" data-footer="KAU · Autonomous Robotic Systems Engineering · Lecture 5" data-theme="kau" lang="en-US" data-marpit-pagination="17" style="--paginate:true;--footer:KAU · Autonomous Robotic Systems Engineering · Lecture 5;--theme:kau;" data-marpit-pagination-total="50">
<h2 id="lidar-time-of-flight-tof">Lidar: Time of Flight (ToF)</h2>
<div class="lg">
<div>
<ul>
<li><strong>Lidar</strong> (light detection and ranging): send a light pulse, time its echo — the <strong>time of flight</strong></li>
</ul>
<p><span class="katex-display"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mi>d</mi><mo>=</mo><mfrac><mrow><mi>c</mi><mtext> </mtext><mi mathvariant="normal">Δ</mi><mi>t</mi></mrow><mn>2</mn></mfrac></mrow><annotation encoding="application/x-tex">d = \frac{c\,\Delta t}{2}
</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6944em;"></span><span class="mord mathnormal">d</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:2.0463em;vertical-align:-0.686em;"></span><span class="mord"><span class="mopen nulldelimiter"></span><span class="mfrac"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:1.3603em;"><span style="top:-2.314em;"><span class="pstrut" style="height:3em;"></span><span class="mord"><span class="mord">2</span></span></span><span style="top:-3.23em;"><span class="pstrut" style="height:3em;"></span><span class="frac-line" style="border-bottom-width:0.04em;"></span></span><span style="top:-3.677em;"><span class="pstrut" style="height:3em;"></span><span class="mord"><span class="mord mathnormal">c</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord">Δ</span><span class="mord mathnormal">t</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.686em;"><span></span></span></span></span></span><span class="mclose nulldelimiter"></span></span></span></span></span></span></p><p><em>The distance from the echo's delay — there and back, so half</em></p>
<ul>
<li>Our wall 2.0 m away: the echo is back after 13.3 ns; 1 cm farther — 67 ps later</li>
<li>Every timing error is a distance error — the lidar's noise</li>
</ul>
<figure>
<img src="img/tof-echo.svg" alt="Top: a pulse goes from the lidar to a wall 2.0 m away and its echo comes back. Bottom: on a time axis the pulse leaves at 0 and the weaker echo returns at 13.3 ns; 1 cm farther, it comes 67 ps later" style="height:205px" />
<figcaption>Our drawing: our wall in space and in time.</figcaption>
</figure>
</div>
<div class="legend">
<p><strong>Legend</strong><br />
<span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>d</mi></mrow><annotation encoding="application/x-tex">d</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6944em;"></span><span class="mord mathnormal">d</span></span></span></span> — distance, m<br />
<span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>c</mi></mrow><annotation encoding="application/x-tex">c</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.4306em;"></span><span class="mord mathnormal">c</span></span></span></span> — speed of light, 3·10⁸ m/s<br />
<span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi mathvariant="normal">Δ</mi><mi>t</mi></mrow><annotation encoding="application/x-tex">\Delta t</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mord">Δ</span><span class="mord mathnormal">t</span></span></span></span> — echo delay, s<br />
1 ns = 10⁻⁹ s · 1 ps = 10⁻¹² s</p>
</div>
</div>
<p><span class="src"><img class="emoji" draggable="false" alt="▶️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/25b6.svg" data-marp-twemoji=""/> <a href="https://youtu.be/eJZXRncGaGM">youtu.be/eJZXRncGaGM</a></span></p>
<footer>KAU · Autonomous Robotic Systems Engineering · Lecture 5</footer>
</section>

<h2 id="kinds-of-lidar-1d-2d-3d-solid-state">Kinds of Lidar: 1D, 2D, 3D, Solid-State</h2>

<table>
<thead>
<tr>
<th>kind</th>
<th>beams</th>
<th>covers</th>
<th>used for</th>
<th>in Gazebo</th>
</tr>
</thead>
<tbody>
<tr>
<td>1D rangefinder</td>
<td>one</td>
<td>one direction</td>
<td>distance to the ground, a bumper</td>
<td><code>gpu_lidar</code>, one sample at 0 rad (measured)</td>
</tr>
<tr>
<td><strong>2D scanner</strong></td>
<td>one plane of rays</td>
<td>a circle or a sector</td>
<td>indoor SLAM and navigation</td>
<td><strong>ours: 360 rays, one plane</strong></td>
</tr>
<tr>
<td>3D spinning</td>
<td>16–128 planes</td>
<td>all around, a band up and down</td>
<td>cars, outdoor mapping</td>
<td><code>&lt;vertical&gt;</code> samples above 1</td>
</tr>
<tr>
<td>solid-state</td>
<td>a fixed pattern, nothing spins</td>
<td>a window in front</td>
<td>cars, drones</td>
<td>no pattern; a narrow <code>gpu_lidar</code> comes close</td>
</tr>
</tbody>
</table>
<ul>
<li>The specs: <strong>range</strong> · <strong>angular resolution</strong> · <strong>rate</strong> · <strong>field of view (FOV)</strong> — ours: 0.12–8 m · 1° · 10 Hz · 360°</li>
<li>Gazebo has one lidar sensor for all four kinds, <code>gpu_lidar</code>: its samples and angles set the kind · no sonar, no radar</li>
</ul>
<figure>
<img src="img/lidar-kinds.svg" alt="Four kinds of lidar from above and from the side: one ray, one plane all around, many planes all around, a fixed pattern ahead" style="height:188px" />
<figcaption>Our drawing: what each kind covers.</figcaption>
</figure>
<p><span class="src"><img class="emoji" draggable="false" alt="📖" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4d6.svg" data-marp-twemoji=""/> <a href="https://emanual.robotis.com/docs/en/platform/turtlebot3/appendix_lds_01/">emanual.robotis.com/docs/en/platform/turtlebot3/appendix_lds_01/</a></span></p>
<footer>KAU · Autonomous Robotic Systems Engineering · Lecture 5</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-footer="KAU · Autonomous Robotic Systems Engineering · Lecture 5" data-theme="kau" lang="en-US" data-marpit-pagination="19" style="--paginate:true;--footer:KAU · Autonomous Robotic Systems Engineering · Lecture 5;--theme:kau;" data-marpit-pagination-total="50">
<h2 id="one-scan-a-fan-of-rays">One Scan: a Fan of Rays</h2>
<div class="cols">
<div>
<ul>
<li>A spinning mirror sends one ray per angle step — one turn is one scan</li>
<li>Ours: 360 rays, about 10 scans per second (measured)</li>
<li>Gazebo can draw the rays: add the <strong>Visualize Lidar</strong> plugin to its window, press ↻, pick <code>/scan</code> and «Rays»</li>
</ul>
</div>
<div>
<figure>
<img src="img/lidar-rays.gif" alt="Gazebo from above: blue rays from our robot to the walls, the box and the pillar; the fan moves as the robot drives a loop" style="height:330px" />
<figcaption>Measured in our setup: Visualize Lidar, one loop at 0.3 m/s.</figcaption>
</figure>
</div>
</div>
<p><span class="src"><img class="emoji" draggable="false" alt="▶️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/25b6.svg" data-marp-twemoji=""/> <a href="https://gazebosim.org/docs/harmonic/sensors">gazebosim.org/docs/harmonic/sensors</a></span></p>
<footer>KAU · Autonomous Robotic Systems Engineering · Lecture 5</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-marpit-scope-VJYOcZjy="" data-paginate="true" data-footer="KAU · Autonomous Robotic Systems Engineering · Lecture 5" data-theme="kau" lang="en-US" data-marpit-pagination="20" style="--paginate:true;--footer:KAU · Autonomous Robotic Systems Engineering · Lecture 5;--theme:kau;" data-marpit-pagination-total="50">
<h2 id="scan-what-is-stored"><code>/scan</code>: What Is Stored</h2>
<div class="cols">
<div>
<pre><code class="language-bash">$ ros2 topic info /scan
Type: sensor_msgs/msg/LaserScan
Publisher count: 1
$ ros2 interface show sensor_msgs/msg/LaserScan   <span class="hljs-comment"># comments shortened</span>
<span class="hljs-comment"># Single scan from a planar laser range-finder</span>
std_msgs/Header header <span class="hljs-comment"># acquisition time of the first ray</span>
float32 angle_min       <span class="hljs-comment"># start angle of the scan [rad]</span>
float32 angle_max       <span class="hljs-comment"># end angle of the scan [rad]</span>
float32 angle_increment <span class="hljs-comment"># angular distance between measurements [rad]</span>
float32 time_increment  <span class="hljs-comment"># time between measurements [seconds]</span>
float32 scan_time       <span class="hljs-comment"># time between scans [seconds]</span>
float32 range_min       <span class="hljs-comment"># minimum range value [m]</span>
float32 range_max       <span class="hljs-comment"># maximum range value [m]</span>
float32[] ranges        <span class="hljs-comment"># range data [m]</span>
                        <span class="hljs-comment"># (values &lt; range_min or &gt; range_max: discard)</span>
float32[] intensities   <span class="hljs-comment"># intensity data [device-specific units]</span>
</code></pre>
</div>
<div>
<figure>
<img src="img/laserscan-fields.svg" alt="Our room from above with rays every 20 degrees: a blue ray straight back is ranges[0], a light blue ray next to it is ranges[1], a purple arc between them is angle_increment, a green ray to the right wall is ranges[i]; 0 radians points forward, angles grow counter-clockwise" style="height:285px" />
<figcaption>Our drawing: the fields over our room; rays every 20°, really every 1°.</figcaption>
</figure>
<ul>
<li><span style="color:#1f77b4">━━</span> <code>ranges[0]</code>: the first ray, at <code>angle_min</code> = −π — behind</li>
<li><span style="color:#84b4d6">━━</span> <code>ranges[1]</code>: the next ray, one <span style="color:#7b3fa0"><code>angle_increment</code></span> on (drawn wider)</li>
<li><span style="color:#2ca02c">━━</span> <code>ranges[i]</code>: how far ray i went, in metres</li>
<li>Outside <code>range_min</code> … <code>range_max</code>: discard; nothing hit → <code>inf</code> · <code>intensities</code>: 360 zeros in our Gazebo</li>
</ul>
</div>
</div>
<p><span class="src"><img class="emoji" draggable="false" alt="📖" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4d6.svg" data-marp-twemoji=""/> <a href="https://github.com/ros2/common_interfaces/blob/jazzy/sensor_msgs/msg/LaserScan.msg">github.com/ros2/common_interfaces/blob/jazzy/sensor_msgs/msg/LaserScan.msg</a></span></p>
<footer>KAU · Autonomous Robotic Systems Engineering · Lecture 5</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-paginate="true" data-footer="KAU · Autonomous Robotic Systems Engineering · Lecture 5" data-theme="kau" lang="en-US" data-marpit-pagination="21" style="--paginate:true;--footer:KAU · Autonomous Robotic Systems Engineering · Lecture 5;--theme:kau;" data-marpit-pagination-total="50">
<h2 id="ros2-topic-echo-scan-one-real-scan"><code>ros2 topic echo /scan</code>: One Real Scan</h2>
<div class="cols">
<div>
<pre><code class="language-bash">$ ros2 topic <span class="hljs-built_in">echo</span> /scan --once --truncate-length 4
header:
  stamp: {sec: 7, nanosec: 400000000}
  frame_id: lidar_link
angle_min: -3.141590118408203
angle_max: 3.141590118408203
angle_increment: 0.017501894384622574
time_increment: 0.0
scan_time: 0.0
range_min: 0.11999999731779099
range_max: 8.0
ranges: [2.2001, 2.2007, 2.2017, 2.2034, <span class="hljs-string">&#x27;...&#x27;</span>]
intensities: [0.0, 0.0, 0.0, 0.0, <span class="hljs-string">&#x27;...&#x27;</span>]
</code></pre>
</div>
<div>
<ul>
<li><code>time_increment</code> and <code>scan_time</code> are 0: Gazebo does not pass them, so the bridge writes zeros</li>
<li>Shortened: the header and the lists on one line, numbers to 4 decimals</li>
<li><code>ranges</code> starts behind the robot: the back wall, 2.2 m from the lidar, then round to the front</li>
</ul>
<figure>
<img src="img/scan-gz-rviz.png" alt="Our room from above, twice. Left, Gazebo's Visualize Lidar: 360 blue rays from the robot to the walls, the box and the pillar. Right, RViz as it comes: the same scan as red points where the rays stop; the robot, red too, in the middle" style="height:266px" />
<figcaption>Measured in our setup, no noise. Left, Gazebo: the rays · right, RViz: where they stop (LaserScan Size 0.1).</figcaption>
</figure>
</div>
</div>
<p><span class="src"><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3af.svg" data-marp-twemoji=""/> <a href="https://github.com/gazebosim/ros_gz/blob/jazzy/ros_gz_bridge/README.md">github.com/gazebosim/ros_gz/blob/jazzy/ros_gz_bridge/README.md</a></span></p>
<footer>KAU · Autonomous Robotic Systems Engineering · Lecture 5</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-marpit-scope-B8YYXnts="" data-paginate="true" data-footer="KAU · Autonomous Robotic Systems Engineering · Lecture 5" data-theme="kau" lang="en-US" data-marpit-pagination="22" style="--paginate:true;--footer:KAU · Autonomous Robotic Systems Engineering · Lecture 5;--theme:kau;" data-marpit-pagination-total="50">
<h2 id="which-ray-points-forward">Which Ray Points Forward?</h2>
<div class="lg">
<div>
<p><span class="katex-display"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mi>i</mi><mo>=</mo><mfrac><mrow><mi>θ</mi><mo>−</mo><msub><mi>θ</mi><mrow><mi>m</mi><mi>i</mi><mi>n</mi></mrow></msub></mrow><mrow><mi mathvariant="normal">Δ</mi><mi>θ</mi></mrow></mfrac></mrow><annotation encoding="application/x-tex">i = \frac{\theta - \theta_{min}}{\Delta\theta}
</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6595em;"></span><span class="mord mathnormal">i</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:2.0574em;vertical-align:-0.686em;"></span><span class="mord"><span class="mopen nulldelimiter"></span><span class="mfrac"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:1.3714em;"><span style="top:-2.314em;"><span class="pstrut" style="height:3em;"></span><span class="mord"><span class="mord">Δ</span><span class="mord mathnormal" style="margin-right:0.0278em;">θ</span></span></span><span style="top:-3.23em;"><span class="pstrut" style="height:3em;"></span><span class="frac-line" style="border-bottom-width:0.04em;"></span></span><span style="top:-3.677em;"><span class="pstrut" style="height:3em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0278em;">θ</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">−</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0278em;">θ</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3117em;"><span style="top:-2.55em;margin-left:-0.0278em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mathnormal mtight">min</span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.686em;"><span></span></span></span></span></span><span class="mclose nulldelimiter"></span></span></span></span></span></span></p><p><em>Count the steps from the first ray to the angle you want</em></p>
<ul>
<li><strong>What for:</strong> the ray that looks at the wall ahead — later, a filter stops the robot with it</li>
<li>360 rays over ±π: no ray at exactly 0° — rays 179 and 180 sit at −0.50° and +0.50°; round <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>i</mi></mrow><annotation encoding="application/x-tex">i</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6595em;"></span><span class="mord mathnormal">i</span></span></span></span> to the nearest</li>
</ul>
</div>
<div class="legend">
<p><strong>Legend</strong><br />
<span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>i</mi></mrow><annotation encoding="application/x-tex">i</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6595em;"></span><span class="mord mathnormal">i</span></span></span></span> — index in <code>ranges[]</code><br />
<span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>θ</mi></mrow><annotation encoding="application/x-tex">\theta</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6944em;"></span><span class="mord mathnormal" style="margin-right:0.0278em;">θ</span></span></span></span> — the angle you want, rad: 0 forward, counter-clockwise positive<br />
<span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>θ</mi><mrow><mi>m</mi><mi>i</mi><mi>n</mi></mrow></msub></mrow><annotation encoding="application/x-tex">\theta_{min}</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.8444em;vertical-align:-0.15em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0278em;">θ</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3117em;"><span style="top:-2.55em;margin-left:-0.0278em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mathnormal mtight">min</span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span></span></span></span> — <code>angle_min</code>, the angle of <code>ranges[0]</code><br />
<span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi mathvariant="normal">Δ</mi><mi>θ</mi></mrow><annotation encoding="application/x-tex">\Delta\theta</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6944em;"></span><span class="mord">Δ</span><span class="mord mathnormal" style="margin-right:0.0278em;">θ</span></span></span></span> — <code>angle_increment</code>, rad</p>
</div>
</div>
<div class="cols">
<figure>
<img src="img/ray-index.svg" alt="Left: indices around the robot, 0 and 359 behind, about 90 on the right, 180 forward, about 270 on the left. Right: rays 178 to 181 at minus 1.50, minus 0.50, plus 0.50 and plus 1.51 degrees around the forward direction" style="height:205px" />
<figcaption>Our drawing, angles from our <code>/scan</code>.</figcaption>
</figure>
<figure>
<img src="img/pole-ahead.png" alt="Gazebo from above: an orange 3 cm pole 2.54 m straight ahead of the lidar; blue ray 180 at plus 0.50 degrees passes above it, ray 179 at minus 0.50 degrees below; a dashed line at 0 degrees runs to the pole: no ray there; the pole is not in the scan" style="height:205px" />
<figcaption>Gazebo, measured: our 3 cm pole straight ahead, between rays 179 and 180.</figcaption>
</figure>
</div>
<footer>KAU · Autonomous Robotic Systems Engineering · Lecture 5</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-marpit-scope-N3mwRwqX="" data-paginate="true" data-footer="KAU · Autonomous Robotic Systems Engineering · Lecture 5" data-theme="kau" lang="en-US" data-marpit-pagination="23" style="--paginate:true;--footer:KAU · Autonomous Robotic Systems Engineering · Lecture 5;--theme:kau;" data-marpit-pagination-total="50">
<h2 id="gaps-between-rays-r--%CE%B4%CE%B8">Gaps Between Rays: r · Δθ</h2>
<div class="lg">
<div>
<p><span class="katex-display"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mstyle mathcolor="#7b3fa0"><mi>s</mi></mstyle><mo>=</mo><mi>r</mi><mtext> </mtext><mstyle mathcolor="#7b3fa0"><mi mathvariant="normal">Δ</mi><mi>θ</mi></mstyle></mrow><annotation encoding="application/x-tex">\textcolor{#7b3fa0}{s} = r\,\textcolor{#7b3fa0}{\Delta\theta}
</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.4306em;"></span><span class="mord mathnormal" style="color:#7b3fa0;">s</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.6944em;"></span><span class="mord mathnormal" style="margin-right:0.0278em;">r</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord" style="color:#7b3fa0;">Δ</span><span class="mord mathnormal" style="margin-right:0.0278em;color:#7b3fa0;">θ</span></span></span></span></span></p><p><em>How far apart two neighbouring rays land at distance r — an object thinner than s can fall between them</em></p>
<div class="cols">
<div>
<figure>
<img src="img/ray-gap.svg" alt="Top: a lidar and two neighbouring rays; a pole near the lidar sits where the gap between the rays is narrower than the pole, and both rays stop on it. Bottom: the same two rays and the pole far away, where the gap s = r times delta theta is wider than the pole; no ray touches it. r is marked from the lidar to the pole, delta theta at the lidar" style="height:180px" />
<figcaption>Our drawing: the same pole near and far; Δθ drawn as 8°, ours is 1°.</figcaption>
</figure>
<ul>
<li>1° at 3 m → s = 5 cm: a chair leg slips through — later, the costmap misses it too</li>
<li>Our 3 cm pole: in the scan up to 1.91 m, gone from 1.94 m</li>
</ul>
</div>
<div>
<figure>
<img src="img/pole-gap.gif" alt="Gazebo's Visualize Lidar from above, the robot backing away from an orange 3 cm pole. Top: the robot, its lidar and the pole, with only the rays that hit: a blue line from the lidar to the pole while it is in the scan. Bottom: the pole close up with every ray: near, two rays stop on it; past 1.9 m they pass either side. The overlays give r, s = r times delta theta, and whether the pole is in the scan" style="height:340px" />
<figcaption>Gazebo, measured. Top: only the rays that hit · bottom: over the pole, every ray.</figcaption>
</figure>
</div>
</div>
</div>
<div class="legend">
<p><strong>Legend</strong><br />
<span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mstyle mathcolor="#7b3fa0"><mi>s</mi></mstyle></mrow><annotation encoding="application/x-tex">\textcolor{#7b3fa0}{s}</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.4306em;"></span><span class="mord mathnormal" style="color:#7b3fa0;">s</span></span></span></span> — the gap between two neighbouring hits, m<br />
<span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>r</mi></mrow><annotation encoding="application/x-tex">r</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.4306em;"></span><span class="mord mathnormal" style="margin-right:0.0278em;">r</span></span></span></span> — distance from the lidar, m<br />
<span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mstyle mathcolor="#7b3fa0"><mi mathvariant="normal">Δ</mi><mi>θ</mi></mstyle></mrow><annotation encoding="application/x-tex">\textcolor{#7b3fa0}{\Delta\theta}</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6944em;"></span><span class="mord" style="color:#7b3fa0;">Δ</span><span class="mord mathnormal" style="margin-right:0.0278em;color:#7b3fa0;">θ</span></span></span></span> — <code>angle_increment</code>: the angle between two rays, rad<br />
an arc = radius × angle in radians<br />
1° = π/180 ≈ 0.0175 rad</p>
</div>
</div>
<footer>KAU · Autonomous Robotic Systems Engineering · Lecture 5</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-marpit-scope-QnOHmyYA="" data-paginate="true" data-footer="KAU · Autonomous Robotic Systems Engineering · Lecture 5" data-theme="kau" lang="en-US" data-marpit-pagination="24" style="--paginate:true;--footer:KAU · Autonomous Robotic Systems Engineering · Lecture 5;--theme:kau;" data-marpit-pagination-total="50">
<h2 id="the-lidar-in-urdf-the-gpu_lidar-block">The Lidar in URDF: the <code>gpu_lidar</code> Block</h2>
<div class="cols">
<div>
<div class="file">URDF · inside <code>&lt;gazebo reference="lidar_link"&gt;</code></div>
<pre><code class="language-xml"><span class="hljs-tag">&lt;<span class="hljs-name">sensor</span> <span class="hljs-attr">name</span>=<span class="hljs-string">&quot;lidar&quot;</span> <span class="hljs-attr">type</span>=<span class="hljs-string">&quot;gpu_lidar&quot;</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">topic</span>&gt;</span>…<span class="hljs-tag">&lt;/<span class="hljs-name">topic</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">gz_frame_id</span>&gt;</span>lidar_link<span class="hljs-tag">&lt;/<span class="hljs-name">gz_frame_id</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">update_rate</span>&gt;</span>…<span class="hljs-tag">&lt;/<span class="hljs-name">update_rate</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">lidar</span>&gt;</span>
    <span class="hljs-tag">&lt;<span class="hljs-name">scan</span>&gt;</span><span class="hljs-tag">&lt;<span class="hljs-name">horizontal</span>&gt;</span>
      <span class="hljs-tag">&lt;<span class="hljs-name">samples</span>&gt;</span>…<span class="hljs-tag">&lt;/<span class="hljs-name">samples</span>&gt;</span>
      <span class="hljs-tag">&lt;<span class="hljs-name">min_angle</span>&gt;</span>…<span class="hljs-tag">&lt;/<span class="hljs-name">min_angle</span>&gt;</span>
      <span class="hljs-tag">&lt;<span class="hljs-name">max_angle</span>&gt;</span>…<span class="hljs-tag">&lt;/<span class="hljs-name">max_angle</span>&gt;</span>
    <span class="hljs-tag">&lt;/<span class="hljs-name">horizontal</span>&gt;</span><span class="hljs-tag">&lt;/<span class="hljs-name">scan</span>&gt;</span>

<h2 id="why-%C2%ABgpu%C2%BB-a-scan-is-one-row-of-a-depth-image">Why «gpu»: a Scan Is One Row of a Depth Image</h2>
<figure>
<img src="img/gpu-depth.svg" alt="Left, from above: a sensor casts nine rays at a wall with a box in front; rays 4 and 5 stop on the box. Right: the depth image Gazebo draws from the sensor, 9 columns by 5 rows, darker where the box is nearer; the middle row, outlined red, is gpu_lidar's scan plane; the whole image, outlined blue, is what depth_camera keeps" style="height:205px" />
<figcaption>Our drawing: one picture of distances — the lidar keeps a row, the depth camera all of it.</figcaption>
</figure>
<table>
<thead>
<tr>
<th><code>type</code> in URDF</th>
<th>what it does</th>
<th>in ROS 2</th>
<th>our Harmonic (measured)</th>
<th>where it works</th>
</tr>
</thead>
<tbody>
<tr>
<td><span style="color:#d62728"><code>gpu_lidar</code></span> (old name <code>gpu_ray</code>)</td>
<td>keeps one row of the picture — the scan plane</td>
<td><code>LaserScan</code></td>
<td>works — ours</td>
<td>every new Gazebo; Classic as <code>gpu_ray</code></td>
</tr>
<tr>
<td><span style="color:#1f77b4"><code>depth_camera</code></span></td>
<td>keeps the whole picture</td>
<td><code>Image</code></td>
<td>works</td>
<td>every Gazebo</td>
</tr>
<tr>
<td><code>lidar</code>, <code>ray</code></td>
<td>casts rays one by one on the processor</td>
<td>—</td>
<td>«not supported yet»</td>
<td>Classic; new Gazebo only from Jetty</td>
</tr>
<tr>
<td><code>sonar</code></td>
<td>an ultrasonic cone</td>
<td>—</td>
<td>«not supported yet»</td>
<td>Classic only</td>
</tr>
</tbody>
</table>
<ul>
<li><strong>Why «gpu»:</strong> a graphics card draws this picture at once; ours has none — the processor draws it, slower, same numbers</li>
<li><strong>Why not in Harmonic:</strong> the new Gazebo builds every range sensor on this picture; the processor lidar is back in Jetty</li>
</ul>
<p><span class="src"><img class="emoji" draggable="false" alt="📖" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4d6.svg" data-marp-twemoji=""/> <a href="https://gazebosim.org/docs/all/comparison/">gazebosim.org/docs/all/comparison/</a> · <a href="https://gazebosim.org/api/sensors/10/classgz_1_1sensors_1_1CpuLidarSensor.html">gazebosim.org/api/sensors/10/classgz_1_1sensors_1_1CpuLidarSensor.html</a></span></p>
<footer>KAU · Autonomous Robotic Systems Engineering · Lecture 5</footer>
</section>

<h2 id="lidar-parameters-what-each-one-changes">Lidar Parameters: What Each One Changes</h2>

<table>
<thead>
<tr>
<th>parameter</th>
<th>what it changes</th>
<th>what you see</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>samples</code></td>
<td>rays per scan</td>
<td>more rays, denser points on the walls</td>
</tr>
<tr>
<td><code>min_angle</code>, <code>max_angle</code></td>
<td>the field of view</td>
<td>a sector instead of a circle</td>
</tr>
<tr>
<td><code>range</code> <code>min</code>, <code>max</code></td>
<td>too close, too far</td>
<td>past <code>max</code>: <code>inf</code>, no point</td>
</tr>
<tr>
<td><code>update_rate</code></td>
<td>scans per second</td>
<td>more CPU; in a heavy world the real-time factor (RTF) drops below 1</td>
</tr>
</tbody>
</table>
<div class="cols">
<div>
<ul>
<li>16 samples over the full circle: the first and the last ray both point backwards — 15 steps of 24°</li>
<li>Later: SLAM caps its own range at the scan's <code>range_max</code> — 20 m in its settings, 8 m from ours, with a warning</li>
</ul>
</div>
<div>
<figure>
<img src="img/samples-density.gif" alt="The same room from above with 16, 90 and 360 rays: left, Gazebo draws the rays; right, RViz shows their points on the walls, denser and denser" style="height:255px" />
<figcaption>Measured in our setup: <code>samples</code> 16, 90, 360 — left Gazebo's Visualize Lidar, right RViz (Size 0.1).</figcaption>
</figure>
</div>
</div>
<p><span class="src"><img class="emoji" draggable="false" alt="▶️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/25b6.svg" data-marp-twemoji=""/> <a href="https://youtu.be/gEAdcgM7cCk">youtu.be/gEAdcgM7cCk</a></span></p>
<footer>KAU · Autonomous Robotic Systems Engineering · Lecture 5</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-paginate="true" data-footer="KAU · Autonomous Robotic Systems Engineering · Lecture 5" data-class="section" data-theme="kau" lang="en-US" class="section" data-marpit-pagination="27" style="--paginate:true;--footer:KAU · Autonomous Robotic Systems Engineering · Lecture 5;--class:section;--theme:kau;" data-marpit-pagination-total="50">
<h1 id="noise">Noise</h1>
<footer>KAU · Autonomous Robotic Systems Engineering · Lecture 5</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-marpit-scope-Go0njJIN="" data-paginate="true" data-footer="KAU · Autonomous Robotic Systems Engineering · Lecture 5" data-theme="kau" lang="en-US" data-marpit-pagination="28" style="--paginate:true;--footer:KAU · Autonomous Robotic Systems Engineering · Lecture 5;--theme:kau;" data-marpit-pagination-total="50">
<h2 id="accuracy-vs-precision-bias-and-spread">Accuracy vs Precision: Bias and Spread</h2>

<table>
<thead>
<tr>
<th></th>
<th>accuracy</th>
<th>precision</th>
</tr>
</thead>
<tbody>
<tr>
<td>asks</td>
<td>how close is the <em>average</em> to the truth?</td>
<td>how close are the readings to <em>each other</em>?</td>
</tr>
<tr>
<td>spoiled by</td>
<td>a bias: every reading off by the same</td>
<td>noise: every reading off differently</td>
</tr>
<tr>
<td>fixed by</td>
<td>calibration</td>
<td>averaging, filtering (later)</td>
</tr>
<tr>
<td>LDS-01 datasheet, 0.5–3.5 m</td>
<td>±5.0 %</td>
<td>±3.5 %</td>
</tr>
</tbody>
</table>
<ul>
<li>Odometry drift had both: a wrong wheel base — a bias; slip — noise</li>
</ul>
<div class="cols">
<div>
<figure>
<img src="img/accuracy-precision.svg" alt="Four targets with 25 shots each: accurate and precise, accurate not precise, precise not accurate, neither" style="height:140px" />
<figcaption>Our plot, 25 seeded shots per target.</figcaption>
</figure>
</div>
<div>
<figure>
<img src="img/bias-vs-spread.svg" alt="Histograms of the forward ray: grey around the truth 2.0, orange moved to 2.05 by mean 0.05, blue wider with stddev 0.03" style="height:190px" />
<figcaption>Measured in our setup: the forward ray, 500 scans per run.</figcaption>
</figure>
</div>
</div>
<p><span class="src"><img class="emoji" draggable="false" alt="📖" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4d6.svg" data-marp-twemoji=""/> <a href="https://emanual.robotis.com/docs/en/platform/turtlebot3/appendix_lds_01/">emanual.robotis.com/docs/en/platform/turtlebot3/appendix_lds_01/</a></span></p>
<footer>KAU · Autonomous Robotic Systems Engineering · Lecture 5</footer>
</section>

<h2 id="noise-model-the-gaussian">Noise Model: the Gaussian</h2>
<div class="lg">
<div>
<div class="cols">
<div>
<p><span class="katex-display"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mi>z</mi><mo>=</mo><mi>d</mi><mo>+</mo><mi>v</mi><mo separator="true">,</mo><mspace width="2em"/><mi>v</mi><mo>∼</mo><mi mathvariant="script">N</mi><mo stretchy="false">(</mo><mi>μ</mi><mo separator="true">,</mo><mtext> </mtext><msup><mi>σ</mi><mn>2</mn></msup><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">z = d + v, \qquad v \sim \mathcal{N}(\mu,\ \sigma^2)
</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.4306em;"></span><span class="mord mathnormal" style="margin-right:0.044em;">z</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.7778em;vertical-align:-0.0833em;"></span><span class="mord mathnormal">d</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">+</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:0.625em;vertical-align:-0.1944em;"></span><span class="mord mathnormal" style="margin-right:0.0359em;">v</span><span class="mpunct">,</span><span class="mspace" style="margin-right:2em;"></span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord mathnormal" style="margin-right:0.0359em;">v</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">∼</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:1.1141em;vertical-align:-0.25em;"></span><span class="mord mathcal" style="margin-right:0.1474em;">N</span><span class="mopen">(</span><span class="mord mathnormal">μ</span><span class="mpunct">,</span><span class="mspace"> </span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0359em;">σ</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.8641em;"><span style="top:-3.113em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight">2</span></span></span></span></span></span></span></span><span class="mclose">)</span></span></span></span></span></p><p><em>A reading is the truth plus an error — our wall with σ = 0.01: d = 2.0 m, z = 2.002, 1.988, 2.015</em></p>
</div>
<div>
<p><span class="katex-display"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mi>p</mi><mo stretchy="false">(</mo><mi>v</mi><mo stretchy="false">)</mo><mo>=</mo><mfrac><mn>1</mn><mrow><mi>σ</mi><msqrt><mrow><mn>2</mn><mi>π</mi></mrow></msqrt></mrow></mfrac><mtext>  </mtext><msup><mi>e</mi><mrow><mo>−</mo><mfrac><mrow><mo stretchy="false">(</mo><mi>v</mi><mo>−</mo><mi>μ</mi><msup><mo stretchy="false">)</mo><mn>2</mn></msup></mrow><mrow><mn>2</mn><msup><mi>σ</mi><mn>2</mn></msup></mrow></mfrac></mrow></msup></mrow><annotation encoding="application/x-tex">p(v) = \frac{1}{\sigma\sqrt{2\pi}}\; e^{-\frac{(v-\mu)^2}{2\sigma^2}}
</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathnormal">p</span><span class="mopen">(</span><span class="mord mathnormal" style="margin-right:0.0359em;">v</span><span class="mclose">)</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:2.2591em;vertical-align:-0.93em;"></span><span class="mord"><span class="mopen nulldelimiter"></span><span class="mfrac"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:1.3214em;"><span style="top:-2.2028em;"><span class="pstrut" style="height:3em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0359em;">σ</span><span class="mord sqrt"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.9072em;"><span class="svg-align" style="top:-3em;"><span class="pstrut" style="height:3em;"></span><span class="mord" style="padding-left:0.833em;"><span class="mord">2</span><span class="mord mathnormal" style="margin-right:0.0359em;">π</span></span></span><span style="top:-2.8672em;"><span class="pstrut" style="height:3em;"></span><span class="hide-tail" style="min-width:0.853em;height:1.08em;"><svg xmlns="http://www.w3.org/2000/svg" width="400em" height="1.08em" viewBox="0 0 400000 1080" preserveAspectRatio="xMinYMin slice"><path d="M95,702

"></span><span class="frac-line mtight" style="border-bottom-width:0.049em;"></span></span><span style="top:-3.5021em;"><span class="pstrut" style="height:3em;"></span><span class="sizing reset-size3 size1 mtight"><span class="mord mtight"><span class="mopen mtight">(</span><span class="mord mathnormal mtight" style="margin-right:0.0359em;">v</span><span class="mbin mtight">−</span><span class="mord mathnormal mtight">μ</span><span class="mclose mtight"><span class="mclose mtight">)</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:1.0484em;"><span style="top:-3.0484em;margin-right:0.1em;"><span class="pstrut" style="height:2.6444em;"></span><span class="mord mtight">2</span></span></span></span></span></span></span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.4938em;"><span></span></span></span></span></span><span class="mclose nulldelimiter sizing reset-size3 size6"></span></span></span></span></span></span></span></span></span></span></span></span></span></span></p><p><em>How likely each error is — σ is the one number Gazebo asks for, and the one a Kalman filter needs later</em></p>

<figcaption>Measured in our setup: ray 180, 500 scans, <code>&lt;stddev&gt;</code> 0.01.</figcaption>
</figure>
</div>
<div class="legend">
<p><strong>Legend</strong><br />
<span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>z</mi></mrow><annotation encoding="application/x-tex">z</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.4306em;"></span><span class="mord mathnormal" style="margin-right:0.044em;">z</span></span></span></span> — a reading, m<br />
<span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>d</mi></mrow><annotation encoding="application/x-tex">d</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6944em;"></span><span class="mord mathnormal">d</span></span></span></span> — the true distance, m<br />
<span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>v</mi></mrow><annotation encoding="application/x-tex">v</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.4306em;"></span><span class="mord mathnormal" style="margin-right:0.0359em;">v</span></span></span></span> — the error, m<br />
<span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>μ</mi></mrow><annotation encoding="application/x-tex">\mu</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.625em;vertical-align:-0.1944em;"></span><span class="mord mathnormal">μ</span></span></span></span> — its mean: the bias, m<br />
<span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>σ</mi></mrow><annotation encoding="application/x-tex">\sigma</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.4306em;"></span><span class="mord mathnormal" style="margin-right:0.0359em;">σ</span></span></span></span> — its spread, m: the square root of the variance <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msup><mi>σ</mi><mn>2</mn></msup></mrow><annotation encoding="application/x-tex">\sigma^2</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.8141em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0359em;">σ</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.8141em;"><span style="top:-3.063em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight">2</span></span></span></span></span></span></span></span></span></span></span>, the average squared distance from the mean<br />
<span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi mathvariant="script">N</mi><mo stretchy="false">(</mo><mi>μ</mi><mo separator="true">,</mo><msup><mi>σ</mi><mn>2</mn></msup><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">\mathcal{N}(\mu, \sigma^2)</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1.0641em;vertical-align:-0.25em;"></span><span class="mord mathcal" style="margin-right:0.1474em;">N</span><span class="mopen">(</span><span class="mord mathnormal">μ</span><span class="mpunct">,</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0359em;">σ</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.8141em;"><span style="top:-3.063em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight">2</span></span></span></span></span></span></span></span><span class="mclose">)</span></span></span></span> — the Gaussian, or normal, distribution<br />
<span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>p</mi><mo stretchy="false">(</mo><mi>v</mi><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">p(v)</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathnormal">p</span><span class="mopen">(</span><span class="mord mathnormal" style="margin-right:0.0359em;">v</span><span class="mclose">)</span></span></span></span> — the Gaussian's density: how likely an error v is — the bell on the plot<br />
±σ, ±2σ, ±3σ hold 68, 95, 99.7 % of readings</p>
</div>
</div>
