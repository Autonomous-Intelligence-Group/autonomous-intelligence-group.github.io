;"></span><span class="mord mathnormal">L</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord"><span class="mopen nulldelimiter"></span><span class="mfrac"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:1.3714em;"><span style="top:-2.314em;"><span class="pstrut" style="height:3em;"></span><span class="mord"><span class="mord"><span class="mord mathnormal" style="margin-right:0.0278em;">θ</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.2806em;"><span style="top:-2.55em;margin-left:-0.0278em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord text mtight"><span class="mord mtight">true</span></span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span></span></span><span style="top:-3.23em;"><span class="pstrut" style="height:3em;"></span><span class="frac-line" style="border-bottom-width:0.04em;"></span></span><span style="top:-3.677em;"><span class="pstrut" style="height:3em;"></span><span class="mord"><span class="mord"><span class="mord mathnormal" style="margin-right:0.0278em;">θ</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3361em;"><span style="top:-2.55em;margin-left:-0.0278em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord text mtight"><span class="mord mtight">odom</span></span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.836em;"><span></span></span></span></span></span><span class="mclose nulldelimiter"></span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">&gt;</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mord mathnormal">L</span></span></span></span></span></p><ul>
<li>The same wheel motion on top of both. The body turns less — as if the wheels were further apart</li>
<li>Our Husky in Gazebo: <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>L</mi><mtext>eff</mtext></msub><mo>≈</mo><mn>1.2</mn><mtext> </mtext><mi>L</mi></mrow><annotation encoding="application/x-tex">L_{\text{eff}} \approx 1.2\,L</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.8333em;vertical-align:-0.15em;"></span><span class="mord"><span class="mord mathnormal">L</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3361em;"><span style="top:-2.55em;margin-left:0em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord text mtight"><span class="mord mtight">eff</span></span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">≈</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mord">1.2</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord mathnormal">L</span></span></span></span></li>
<li>Clearpath's own ROS 2 configuration for the real Husky multiplies the distance for this reason: <code>wheel_separation_multiplier: 1.875</code></li>
<li>What to do: measure <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>L</mi><mtext>eff</mtext></msub></mrow><annotation encoding="application/x-tex">L_{\text{eff}}</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.8333em;vertical-align:-0.15em;"></span><span class="mord"><span class="mord mathnormal">L</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3361em;"><span style="top:-2.55em;margin-left:0em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord text mtight"><span class="mord mtight">eff</span></span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span></span></span></span> (spins on the spot against a reference) · model the slip (<code>WheelSlip</code>) · or fuse an IMU — later in the course</li>
</ul>

<h2 id="will-it-turn-at-all">Will It Turn at All?</h2>
<div class="lg">
<div>
<p><strong>Friction coefficient</strong> — a property of a <strong>surface</strong>. Each wheel sets it on its <code>&lt;collision&gt;</code> (the tyre); the ground has its own; physics uses the smaller of the two. The largest force a tyre can push with = coefficient × load</p>
<p><span class="katex-display"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><munder><munder><mrow><mtext>coefficient along</mtext><mo>×</mo><mstyle scriptlevel="0" displaystyle="false"><mfrac><mtext>track</mtext><mn>2</mn></mfrac></mstyle></mrow><mo stretchy="true">⏟</mo></munder><mtext>turns the robot</mtext></munder><mtext>  </mtext><mo>&gt;</mo><mtext>  </mtext><munder><munder><mrow><mtext>coefficient across</mtext><mo>×</mo><mstyle scriptlevel="0" displaystyle="false"><mfrac><mtext>wheelbase</mtext><mn>2</mn></mfrac></mstyle></mrow><mo stretchy="true">⏟</mo></munder><mtext>holds it still</mtext></munder></mrow><annotation encoding="application/x-tex">\underbrace{\text{coefficient along} \times \tfrac{\text{track}}{2}}_{\text{turns the robot}} \;&gt;\; \underbrace{\text{coefficient across} \times \tfrac{\text{wheelbase}}{2}}_{\text{holds it still}}
</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:2.5592em;vertical-align:-1.6791em;"></span><span class="minner munder"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.8801em;"><span style="top:-1.3209em;"><span class="pstrut" style="height:3em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord text mtight"><span class="mord mtight">turns the robot</span></span></span></span></span><span style="top:-3em;"><span class="pstrut" style="height:3em;"></span><span class="minner munder"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.8801em;"><span class="svg-align" style="top:-2.007em;"><span class="pstrut" style="height:3em;"></span><span class="stretchy" style="height:0.548em;min-width:1.6em;"><span class="brace-left" style="height:0.548em;"><svg xmlns="http://www.w3.org/2000/svg" width="400em" height="0.548em" viewBox="0 0 400000 548" preserveAspectRatio="xMinYMin slice"><path d="M0 6l6-6h17c12.688 0 19.313.3 20 1 4 4 7.313 8.3 10 13

ight:2.5592em;vertical-align:-1.6791em;"></span><span class="minner munder"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.8801em;"><span style="top:-1.3209em;"><span class="pstrut" style="height:3em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord text mtight"><span class="mord mtight">holds it still</span></span></span></span></span><span style="top:-3em;"><span class="pstrut" style="height:3em;"></span><span class="minner munder"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.8801em;"><span class="svg-align" style="top:-2.007em;"><span class="pstrut" style="height:3em;"></span><span class="stretchy" style="height:0.548em;min-width:1.6em;"><span class="brace-left" style="height:0.548em;"><svg xmlns="http://www.w3.org/2000/svg" width="400em" height="0.548em" viewBox="0 0 400000 548" preserveAspectRatio="xMinYMin slice"><path d="M0 6l6-6h17c12.688 0 19.313.3 20 1 4 4 7.313 8.3 10 13

-174 2.7-5 6-9 10-13 .7-1 7.3-1 20-1h17z"/></svg></span></span></span><span style="top:-3em;"><span class="pstrut" style="height:3em;"></span><span class="mord"><span class="mord text"><span class="mord">coefficient across</span></span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">×</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mord"><span class="mopen nulldelimiter"></span><span class="mfrac"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.8801em;"><span style="top:-2.655em;"><span class="pstrut" style="height:3em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mtight">2</span></span></span></span><span style="top:-3.23em;"><span class="pstrut" style="height:3em;"></span><span class="frac-line" style="border-bottom-width:0.04em;"></span></span><span style="top:-3.394em;"><span class="pstrut" style="height:3em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord text mtight"><span class="mord mtight">wheelbase</span></span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.345em;"><span></span></span></span></span></span><span class="mclose nulldelimiter"></span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.993em;"><span></span></span></span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:1.6791em;"><span></span></span></span></span></span></span></span></span></span></p><ul>
<li>Wheels push forward and back → that torque <strong>turns</strong> it. Tyres resist sliding sideways → that torque <strong>holds</strong> it</li>
</ul>
<pre><code class="language-xml"><span class="hljs-tag">&lt;<span class="hljs-name">friction</span>&gt;</span><span class="hljs-tag">&lt;<span class="hljs-name">ode</span>&gt;</span>               <span class="hljs-comment">&lt;!-- in each wheel&#x27;s &lt;collision&gt;; Gazebo&#x27;s skid example --&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">fdir1</span>&gt;</span>0 0 1<span class="hljs-tag">&lt;/<span class="hljs-name">fdir1</span>&gt;</span>        <span class="hljs-comment">&lt;!-- direction 1 = the wheel&#x27;s own z = its axle = SIDEWAYS --&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">mu</span>&gt;</span>1<span class="hljs-tag">&lt;/<span class="hljs-name">mu</span>&gt;</span>                  <span class="hljs-comment">&lt;!-- friction coefficient in direction 1: across the tyre --&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">mu2</span>&gt;</span>1<span class="hljs-tag">&lt;/<span class="hljs-name">mu2</span>&gt;</span>                <span class="hljs-comment">&lt;!-- friction coefficient in direction 2: along the tyre --&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">slip1</span>&gt;</span>0.035<span class="hljs-tag">&lt;/<span class="hljs-name">slip1</span>&gt;</span>        <span class="hljs-comment">&lt;!-- sideways softness; 0 = hard --&gt;</span>
<span class="hljs-tag">&lt;/<span class="hljs-name">ode</span>&gt;</span><span class="hljs-tag">&lt;/<span class="hljs-name">friction</span>&gt;</span>
</code></pre>
<ul>
<li><strong>With <code>slip1</code> = 0 it does not turn:</strong> the coefficient is 1 both ways, and the track (1.25 m) is shorter than the wheelbase (1.51 m). Holding wins: the wheels spin, the body stays</li>
<li>With <code>slip1</code> = 0.035 the tyres give sideways, and it turns. The Husky: <code>mu</code> = 0.5 sideways, a track wider than its wheelbase — it turns, sliding</li>
</ul>
</div>
<div class="legend">
<p><strong>Legend</strong><br />
track — distance between left and right wheels, m<br />
wheelbase — distance between front and rear axles, m<br />
coefficient along / across — friction of the tyre along it / across it<br />
load — the weight on the wheel; the same on both sides, so it cancels</p>
</div>
</div>

<h1 id="a-robot-of-your-own">A Robot of Your Own</h1>
<p><em>One wheel, our plugin</em></p>
<footer>KAU · Autonomous Robotic Systems Engineering · Lecture 3</footer>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-paginate="true" data-footer="KAU · Autonomous Robotic Systems Engineering · Lecture 3" data-theme="kau" lang="en-US" data-marpit-pagination="31" style="--paginate:true;--footer:KAU · Autonomous Robotic Systems Engineering · Lecture 3;--theme:kau;" data-marpit-pagination-total="45">
<h2 id="one-wheel--the-simplest-robot-that-stands">One Wheel — the Simplest Robot That Stands</h2>
<div class="cols">
<div>
<figure>
<img src="img/one-wheel-in-gazebo.png" alt="A blue plate with one black wheel at the front and a small ball underneath at the back, seen from the front right" style="width:100%" />
<figcaption>one_wheel, from the front right.</figcaption>
</figure>
</div>
<div>
<figure>
<img src="img/one-wheel-side.png" alt="Side view of the one-wheel robot: a blue plate, a large black wheel at the front, a small black ball under the back" style="width:100%" />
<figcaption>The same robot, side on.</figcaption>
</figure>
</div>
</div>
<ul>
<li>A wheelbarrow: a plate, <strong>one wheel</strong> in front, a <strong>ball</strong> behind</li>
<li>The ball is the <strong>second support point</strong>. One wheel alone falls over. With wheel and ball, the centre of mass sits between them</li>
<li>The ball has no friction, so it slides and needs no joint. No Fuel, no mesh: one world file</li>
</ul>
<p><span class="src"><img class="emoji" draggable="false" alt="▶️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/25b6.svg" data-marp-twemoji=""/> <a href="https://gazebosim.org/docs/harmonic/building_robot/">gazebosim.org/docs/harmonic/building_robot</a></span></p>
<footer>KAU · Autonomous Robotic Systems Engineering · Lecture 3</footer>

<h2 id="the-whole-robot-in-minimal-sdf">The Whole Robot, in Minimal SDF</h2>
<pre><code class="language-xml"><span class="hljs-tag">&lt;<span class="hljs-name">link</span> <span class="hljs-attr">name</span>=<span class="hljs-string">&quot;body&quot;</span>&gt;</span>                                         <span class="hljs-comment">&lt;!-- the plate --&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">pose</span>&gt;</span>0 0 0.1 0 0 0<span class="hljs-tag">&lt;/<span class="hljs-name">pose</span>&gt;</span>                               <span class="hljs-comment">&lt;!-- 0.1 m above the ground --&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">inertial</span> <span class="hljs-attr">auto</span>=<span class="hljs-string">&quot;true&quot;</span>/&gt;</span>                                  <span class="hljs-comment">&lt;!-- mass and inertia: from the shapes --&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">collision</span> <span class="hljs-attr">name</span>=<span class="hljs-string">&quot;plate&quot;</span>&gt;</span><span class="hljs-tag">&lt;<span class="hljs-name">geometry</span>&gt;</span><span class="hljs-tag">&lt;<span class="hljs-name">box</span>&gt;</span><span class="hljs-tag">&lt;<span class="hljs-name">size</span>&gt;</span>0.4 0.2 0.05<span class="hljs-tag">&lt;/<span class="hljs-name">size</span>&gt;</span><span class="hljs-tag">&lt;/<span class="hljs-name">box</span>&gt;</span><span class="hljs-tag">&lt;/<span class="hljs-name">geometry</span>&gt;</span><span class="hljs-tag">&lt;/<span class="hljs-name">collision</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">collision</span> <span class="hljs-attr">name</span>=<span class="hljs-string">&quot;ball&quot;</span>&gt;</span>                                  <span class="hljs-comment">&lt;!-- the 2nd support: without it, it tips --&gt;</span>
    <span class="hljs-tag">&lt;<span class="hljs-name">pose</span>&gt;</span>-0.15 0 -0.05 0 0 0<span class="hljs-tag">&lt;/<span class="hljs-name">pose</span>&gt;</span>                       <span class="hljs-comment">&lt;!-- behind, under the plate --&gt;</span>
    <span class="hljs-tag">&lt;<span class="hljs-name">geometry</span>&gt;</span><span class="hljs-tag">&lt;<span class="hljs-name">sphere</span>&gt;</span><span class="hljs-tag">&lt;<span class="hljs-name">radius</span>&gt;</span>0.05<span class="hljs-tag">&lt;/<span class="hljs-name">radius</span>&gt;</span><span class="hljs-tag">&lt;/<span class="hljs-name">sphere</span>&gt;</span><span class="hljs-tag">&lt;/<span class="hljs-name">geometry</span>&gt;</span>
    <span class="hljs-tag">&lt;<span class="hljs-name">surface</span>&gt;</span><span class="hljs-tag">&lt;<span class="hljs-name">friction</span>&gt;</span><span class="hljs-tag">&lt;<span class="hljs-name">ode</span>&gt;</span><span class="hljs-tag">&lt;<span class="hljs-name">mu</span>&gt;</span>0<span class="hljs-tag">&lt;/<span class="hljs-name">mu</span>&gt;</span><span class="hljs-tag">&lt;<span class="hljs-name">mu2</span>&gt;</span>0<span class="hljs-tag">&lt;/<span class="hljs-name">mu2</span>&gt;</span><span class="hljs-tag">&lt;/<span class="hljs-name">ode</span>&gt;</span><span class="hljs-tag">&lt;/<span class="hljs-name">friction</span>&gt;</span><span class="hljs-tag">&lt;/<span class="hljs-name">surface</span>&gt;</span>   <span class="hljs-comment">&lt;!-- no friction: slides --&gt;</span>
  <span class="hljs-tag">&lt;/<span class="hljs-name">collision</span>&gt;</span>
<span class="hljs-tag">&lt;/<span class="hljs-name">link</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">link</span> <span class="hljs-attr">name</span>=<span class="hljs-string">&quot;wheel&quot;</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">pose</span>&gt;</span>0.15 0 0.1 -1.5708 0 0<span class="hljs-tag">&lt;/<span class="hljs-name">pose</span>&gt;</span>                      <span class="hljs-comment">&lt;!-- in front; a cylinder stands on end: roll it −90° --&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">inertial</span> <span class="hljs-attr">auto</span>=<span class="hljs-string">&quot;true&quot;</span>/&gt;</span>                                  <span class="hljs-comment">&lt;!-- the same: from the shape --&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">collision</span> <span class="hljs-attr">name</span>=<span class="hljs-string">&quot;tire&quot;</span>&gt;</span><span class="hljs-tag">&lt;<span class="hljs-name">geometry</span>&gt;</span><span class="hljs-tag">&lt;<span class="hljs-name">cylinder</span>&gt;</span><span class="hljs-tag">&lt;<span class="hljs-name">radius</span>&gt;</span>0.1<span class="hljs-tag">&lt;/<span class="hljs-name">radius</span>&gt;</span><span class="hljs-tag">&lt;<span class="hljs-name">length</span>&gt;</span>0.1<span class="hljs-tag">&lt;/<span class="hljs-name">length</span>&gt;</span><span class="hljs-tag">&lt;/<span class="hljs-name">cylinder</span>&gt;</span><span class="hljs-tag">&lt;/<span class="hljs-name">geometry</span>&gt;</span><span class="hljs-tag">&lt;/<span class="hljs-name">collision</span>&gt;</span>
<span class="hljs-tag">&lt;/<span class="hljs-name">link</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">joint</span> <span class="hljs-attr">name</span>=<span class="hljs-string">&quot;wheel_joint&quot;</span> <span class="hljs-attr">type</span>=<span class="hljs-string">&quot;revolute&quot;</span>&gt;</span>                 <span class="hljs-comment">&lt;!-- a hinge: one rotation --&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">parent</span>&gt;</span>body<span class="hljs-tag">&lt;/<span class="hljs-name">parent</span>&gt;</span> <span class="hljs-tag">&lt;<span class="hljs-name">child</span>&gt;</span>wheel<span class="hljs-tag">&lt;/<span class="hljs-name">child</span>&gt;</span>               <span class="hljs-comment">&lt;!-- the wheel turns on the body --&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">axis</span>&gt;</span><span class="hljs-tag">&lt;<span class="hljs-name">xyz</span> <span class="hljs-attr">expressed_in</span>=<span class="hljs-string">&quot;__model__&quot;</span>&gt;</span>0 1 0<span class="hljs-tag">&lt;/<span class="hljs-name">xyz</span>&gt;</span><span class="hljs-tag">&lt;/<span class="hljs-name">axis</span>&gt;</span>   <span class="hljs-comment">&lt;!-- the AXLE: the model&#x27;s y --&gt;</span>
<span class="hljs-tag">&lt;/<span class="hljs-name">joint</span>&gt;</span>
</code></pre>
<ul>
<li><strong>Axle</strong> — the line a wheel turns about: here the model's <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>y</mi></mrow><annotation encoding="application/x-tex">y</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.625em;vertical-align:-0.1944em;"></span><span class="mord mathnormal" style="margin-right:0.0359em;">y</span></span></span></span>, to the left. <code>expressed_in=&quot;__model__&quot;</code> says so, so nobody has to turn the cylinder in their head</li>
<li><strong><code>auto=&quot;true&quot;</code></strong> (SDF 1.11) — Gazebo computes mass and inertia from the collision shapes</li>
<li>Left out here: one <code>&lt;visual&gt;</code> per link — the same shapes, with a colour. That is what you see</li>
</ul>
<p><span class="src"><img class="emoji" draggable="false" alt="📖" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4d6.svg" data-marp-twemoji=""/> <a href="http://sdformat.org/spec?ver=1.11&amp;elem=link">sdformat.org/spec?ver=1.11&amp;elem=link</a> · <img class="emoji" draggable="false" alt="📖" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4d6.svg" data-marp-twemoji=""/> <a href="http://sdformat.org/spec?ver=1.11&amp;elem=joint">sdformat.org/spec?ver=1.11&amp;elem=joint</a></span></p>
<footer>KAU · Autonomous Robotic Systems Engineering · Lecture 3</footer>
</section>

<h2 id="our-plugin-on-it">Our Plugin On It</h2>
<div class="cols" style="grid-template-columns: 1fr 1.5fr; gap: 1.5em">
<div>
<figure>
<img src="img/one-wheel-turn-left.png" alt="RViz from above: a red Gazebo path and blue odometry arrows on one straight line going forward" style="width:100%" />
<figcaption>"Turn left", (0, +1), for 8 s. Red: Gazebo. Blue: our odometry.</figcaption>
</figure>
</div>
<div>
<pre><code class="language-xml"><span class="hljs-comment">&lt;!-- the same Python loader and module as before --&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">plugin</span> <span class="hljs-attr">filename</span>=<span class="hljs-string">&quot;gz-sim-python-system-loader-system&quot;</span> <span class="hljs-attr">name</span>=<span class="hljs-string">&quot;gz::sim::systems::PythonSystemLoader&quot;</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">module_name</span>&gt;</span>simple_diff_drive<span class="hljs-tag">&lt;/<span class="hljs-name">module_name</span>&gt;</span>   <span class="hljs-comment">&lt;!-- our SimpleDiffDrive --&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">left_joint</span>&gt;</span>wheel_joint<span class="hljs-tag">&lt;/<span class="hljs-name">left_joint</span>&gt;</span>           <span class="hljs-comment">&lt;!-- the one wheel… --&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">right_joint</span>&gt;</span>wheel_joint<span class="hljs-tag">&lt;/<span class="hljs-name">right_joint</span>&gt;</span>         <span class="hljs-comment">&lt;!-- …named on both sides --&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">wheel_separation</span>&gt;</span>0.3<span class="hljs-tag">&lt;/<span class="hljs-name">wheel_separation</span>&gt;</span>       <span class="hljs-comment">&lt;!-- L: no 2nd wheel, the formula wants one --&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">wheel_radius</span>&gt;</span>0.1<span class="hljs-tag">&lt;/<span class="hljs-name">wheel_radius</span>&gt;</span>               <span class="hljs-comment">&lt;!-- r --&gt;</span>
<span class="hljs-tag">&lt;/<span class="hljs-name">plugin</span>&gt;</span>
</code></pre>
<ul>
<li><strong><code>teleop_twist_keyboard</code> drives it as it is.</strong> The bridge carries <code>/cmd_vel</code> to the model's topic</li>
<li>&quot;Turn left&quot; drives it <strong>forward</strong>, straight — and the odometry agrees</li>
<li>The stock DiffDrive does exactly the same on this robot</li>
</ul>
</div>
</div>
<p><span class="src"><img class="emoji" draggable="false" alt="📖" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4d6.svg" data-marp-twemoji=""/> <a href="https://gazebosim.org/api/sim/8/python_interfaces.html">gazebosim.org/api/sim/8/python_interfaces.html</a></span></p>
<footer>KAU · Autonomous Robotic Systems Engineering · Lecture 3</footer>
</section>

<h2 id="one-wheel-and-turn-left-drives-it-forward-why">One wheel, and &quot;turn left&quot; drives it forward. Why?</h2>
<footer>KAU · Autonomous Robotic Systems Engineering · Lecture 3</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="35" data-paginate="true" data-footer="KAU · Autonomous Robotic Systems Engineering · Lecture 3" data-theme="kau" lang="en-US" data-marpit-pagination="35" style="--paginate:true;--footer:KAU · Autonomous Robotic Systems Engineering · Lecture 3;--theme:kau;" data-marpit-pagination-total="45">
<h2 id="the-last-write-wins">The Last Write Wins</h2>
<div class="lg">
<div>
<ul>
<li><code>pre_update</code> writes the left speed into the joint, then the right speed — <strong>into the same joint</strong>, <code>wheel_joint</code>. Physics sees only the second:</li>
</ul>
<p><span class="katex-display"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mtext>joint speed</mtext><mo>=</mo><mfrac><mrow><mi>v</mi><mo>+</mo><mi>ω</mi><mi>L</mi><mi mathvariant="normal">/</mi><mn>2</mn></mrow><mi>r</mi></mfrac></mrow><annotation encoding="application/x-tex">\text{joint speed} = \frac{v + \omega L/2}{r}
</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.8889em;vertical-align:-0.1944em;"></span><span class="mord text"><span class="mord">joint speed</span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:2.113em;vertical-align:-0.686em;"></span><span class="mord"><span class="mopen nulldelimiter"></span><span class="mfrac"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:1.427em;"><span style="top:-2.314em;"><span class="pstrut" style="height:3em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0278em;">r</span></span></span><span style="top:-3.23em;"><span class="pstrut" style="height:3em;"></span><span class="frac-line" style="border-bottom-width:0.04em;"></span></span><span style="top:-3.677em;"><span class="pstrut" style="height:3em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0359em;">v</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">+</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mord mathnormal" style="margin-right:0.0359em;">ω</span><span class="mord mathnormal">L</span><span class="mord">/2</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.686em;"><span></span></span></span></span></span><span class="mclose nulldelimiter"></span></span></span></span></span></span></p><ul>
<li>For example <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>v</mi><mo>=</mo><mn>0</mn></mrow><annotation encoding="application/x-tex">v = 0</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.4306em;"></span><span class="mord mathnormal" style="margin-right:0.0359em;">v</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.6444em;"></span><span class="mord">0</span></span></span></span>, <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>ω</mi><mo>=</mo><mn>1</mn></mrow><annotation encoding="application/x-tex">\omega = 1</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.4306em;"></span><span class="mord mathnormal" style="margin-right:0.0359em;">ω</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.6444em;"></span><span class="mord">1</span></span></span></span>, <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>L</mi><mi mathvariant="normal">/</mi><mn>2</mn><mo>=</mo><mn>0.15</mn></mrow><annotation encoding="application/x-tex">L/2 = 0.15</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathnormal">L</span><span class="mord">/2</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.6444em;"></span><span class="mord">0.15</span></span></span></span>: the wheel turns forward, the robot goes 0.15 m/s ahead. The code is right; the robot is wrong</li>
<li>Odometry reads that joint twice: <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi mathvariant="normal">Δ</mi><msub><mi>s</mi><mi>R</mi></msub><mo>=</mo><mi mathvariant="normal">Δ</mi><msub><mi>s</mi><mi>L</mi></msub></mrow><annotation encoding="application/x-tex">\Delta s_R = \Delta s_L</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.8333em;vertical-align:-0.15em;"></span><span class="mord">Δ</span><span class="mord"><span class="mord mathnormal">s</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3283em;"><span style="top:-2.55em;margin-left:0em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight" style="margin-right:0.0077em;">R</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.8333em;vertical-align:-0.15em;"></span><span class="mord">Δ</span><span class="mord"><span class="mord mathnormal">s</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3283em;"><span style="top:-2.55em;margin-left:0em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight">L</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span></span></span></span>, so <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi mathvariant="normal">Δ</mi><mi>θ</mi><mo>=</mo><mn>0</mn></mrow><annotation encoding="application/x-tex">\Delta\theta = 0</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6944em;"></span><span class="mord">Δ</span><span class="mord mathnormal" style="margin-right:0.0278em;">θ</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.6444em;"></span><span class="mord">0</span></span></span></span> — &quot;straight&quot;. And it is right</li>
<li>One wheel on the centre line pushes only along it. The ball gives no side force. To turn you need <strong>two</strong> wheels — or one <strong>steered</strong> wheel: <code>AckermannSteering</code></li>
<li>With no <code>right_joint</code>: nothing moves, no odometry, no warning</li>
</ul>
</div>
<div class="legend">
<p><strong>Legend</strong><br />
joint speed — how fast <code>wheel_joint</code>, the wheel's hinge, turns, rad/s<br />
<span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>v</mi><mo separator="true">,</mo><mi>ω</mi></mrow><annotation encoding="application/x-tex">v, \omega</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.625em;vertical-align:-0.1944em;"></span><span class="mord mathnormal" style="margin-right:0.0359em;">v</span><span class="mpunct">,</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord mathnormal" style="margin-right:0.0359em;">ω</span></span></span></span> — from the <code>Twist</code><br />
<span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>L</mi></mrow><annotation encoding="application/x-tex">L</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mord mathnormal">L</span></span></span></span> — <code>wheel_separation</code>, 0.3 m: there is no second wheel, but the formula needs it<br />
<span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>r</mi></mrow><annotation encoding="application/x-tex">r</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.4306em;"></span><span class="mord mathnormal" style="margin-right:0.0278em;">r</span></span></span></span> — wheel radius, 0.1 m</p>
</div>
</div>
<p><span class="src"><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3af.svg" data-marp-twemoji=""/> <a href="https://github.com/gazebosim/gz-sim/blob/gz-sim8/src/systems/diff_drive/DiffDrive.cc">github.com/gazebosim/gz-sim/blob/gz-sim8/src/systems/diff_drive/DiffDrive.cc</a></span></p>
<footer>KAU · Autonomous Robotic Systems Engineering · Lecture 3</footer>

<h1 id="from-simulation-to-hardware">From Simulation to Hardware</h1>
<p><em>The plugin stays behind</em></p>
<footer>KAU · Autonomous Robotic Systems Engineering · Lecture 3</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="37" data-paginate="true" data-footer="KAU · Autonomous Robotic Systems Engineering · Lecture 3" data-theme="kau" lang="en-US" data-marpit-pagination="37" style="--paginate:true;--footer:KAU · Autonomous Robotic Systems Engineering · Lecture 3;--theme:kau;" data-marpit-pagination-total="45">
<h2 id="one-cmd_vel-five-paths-to-a-wheel">One <code>cmd_vel</code>, Five Paths to a Wheel</h2>
<p style="font-size:13px; margin:-10px 0 4px">🟩 shared by all or several robots · 🟥 specific to one robot — exactly what changes when you move · 🟦 simulation only · ⬜ hardware</p>
<img src="img/diffdrive-to-hardware.svg" alt="Flowchart: /cmd_vel splits into five paths — Gazebo's DiffDrive plugin, TurtleBot 3 firmware and Dynamixel servos, the Pioneer driver and ARCOS firmware, and diff_drive_controller feeding the Husky's hardware interface or your own" style="width:100%" />
<p><span class="src"><img class="emoji" draggable="false" alt="📖" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4d6.svg" data-marp-twemoji=""/> <a href="https://control.ros.org/jazzy/doc/ros2_controllers/diff_drive_controller/doc/userdoc.html">control.ros.org/jazzy/doc/ros2_controllers/diff_drive_controller/doc/userdoc.html</a> · <img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3af.svg" data-marp-twemoji=""/> <a href="https://github.com/ROBOTIS-GIT/turtlebot3">github.com/ROBOTIS-GIT/turtlebot3</a></span></p>
<footer>KAU · Autonomous Robotic Systems Engineering · Lecture 3</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="38" data-paginate="true" data-footer="KAU · Autonomous Robotic Systems Engineering · Lecture 3" data-theme="kau" lang="en-US" data-marpit-pagination="38" style="--paginate:true;--footer:KAU · Autonomous Robotic Systems Engineering · Lecture 3;--theme:kau;" data-marpit-pagination-total="45">
<h2 id="our-robots-simulated-and-real">Our Robots, Simulated and Real</h2>
<table>
<thead>
<tr>
<th></th>
<th>① Gazebo</th>
<th>② TurtleBot 3</th>
<th>③ Pioneer</th>
<th>④ Husky · ⑤ home-made</th>
</tr>
</thead>
<tbody>
<tr>
<td>the message you send</td>
<td><code>Twist</code></td>
<td><code>Twist</code></td>
<td><code>TwistStamped</code></td>
<td><code>TwistStamped</code></td>
</tr>
<tr>
<td>who turns <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mo stretchy="false">(</mo><mi>v</mi><mo separator="true">,</mo><mi>ω</mi><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">(v, \omega)</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mopen">(</span><span class="mord mathnormal" style="margin-right:0.0359em;">v</span><span class="mpunct">,</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord mathnormal" style="margin-right:0.0359em;">ω</span><span class="mclose">)</span></span></span></span> into wheel speeds</td>
<td>the plugin</td>
<td>OpenCR firmware</td>
<td>ARCOS firmware</td>
<td><code>diff_drive_controller</code></td>
</tr>
<tr>
<td>what replaces <code>set_velocity</code></td>
<td>— physics holds the joint</td>
<td>a speed command to each Dynamixel servo</td>
<td>ARCOS drives the motors</td>
<td>the Husky's MCU · your firmware</td>
</tr>
<tr>
<td>commands stop coming</td>
<td>drives on</td>
<td>drives on — until its node dies</td>
<td>stops</td>
<td>stops after 0.5 s</td>
</tr>
</tbody>
</table>
<ul>
<li><strong>Shared by all five: the meaning.</strong> <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>v</mi></mrow><annotation encoding="application/x-tex">v</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.4306em;"></span><span class="mord mathnormal" style="margin-right:0.0359em;">v</span></span></span></span> = <code>linear.x</code>, <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>ω</mi></mrow><annotation encoding="application/x-tex">\omega</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.4306em;"></span><span class="mord mathnormal" style="margin-right:0.0359em;">ω</span></span></span></span> = <code>angular.z</code>, in m/s and rad/s, in the robot's own axes</li>
<li><strong>The formulas are everywhere too:</strong> left <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mo stretchy="false">(</mo><mi>v</mi><mo>−</mo><mi>ω</mi><mi>L</mi><mi mathvariant="normal">/</mi><mn>2</mn><mo stretchy="false">)</mo><mi mathvariant="normal">/</mi><mi>r</mi></mrow><annotation encoding="application/x-tex">(v - \omega L/2)/r</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mopen">(</span><span class="mord mathnormal" style="margin-right:0.0359em;">v</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">−</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathnormal" style="margin-right:0.0359em;">ω</span><span class="mord mathnormal">L</span><span class="mord">/2</span><span class="mclose">)</span><span class="mord">/</span><span class="mord mathnormal" style="margin-right:0.0278em;">r</span></span></span></span>, right <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mo stretchy="false">(</mo><mi>v</mi><mo>+</mo><mi>ω</mi><mi>L</mi><mi mathvariant="normal">/</mi><mn>2</mn><mo stretchy="false">)</mo><mi mathvariant="normal">/</mi><mi>r</mi></mrow><annotation encoding="application/x-tex">(v + \omega L/2)/r</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mopen">(</span><span class="mord mathnormal" style="margin-right:0.0359em;">v</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">+</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathnormal" style="margin-right:0.0359em;">ω</span><span class="mord mathnormal">L</span><span class="mord">/2</span><span class="mclose">)</span><span class="mord">/</span><span class="mord mathnormal" style="margin-right:0.0278em;">r</span></span></span></span> — in a plugin, in two firmwares and in a controller. Only their address changes</li>
<li><strong>Per robot: what replaces <code>set_velocity</code></strong> — the driver, the firmware and the wire between them. That is the red, and that is what you replace when you move</li>
</ul>
<p><span class="src"><img class="emoji" draggable="false" alt="▶️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/25b6.svg" data-marp-twemoji=""/> <a href="https://emanual.robotis.com/docs/en/platform/turtlebot3/overview/">emanual.robotis.com/docs/en/platform/turtlebot3/overview</a> · <img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3af.svg" data-marp-twemoji=""/> <a href="https://github.com/grupo-avispa/pioneer_ros2">github.com/grupo-avispa/pioneer_ros2</a> · <img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3af.svg" data-marp-twemoji=""/> <a href="https://github.com/clearpathrobotics/clearpath_common">github.com/clearpathrobotics/clearpath_common</a></span></p>
<footer>KAU · Autonomous Robotic Systems Engineering · Lecture 3</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="39" data-marpit-scope-Sn8patwr="" data-paginate="true" data-footer="KAU · Autonomous Robotic Systems Engineering · Lecture 3" data-theme="kau" lang="en-US" data-marpit-pagination="39" style="--paginate:true;--footer:KAU · Autonomous Robotic Systems Engineering · Lecture 3;--theme:kau;" data-marpit-pagination-total="45">
<h2 id="a-perfect-motor--and-a-real-one">A Perfect Motor — and a Real One</h2>

<ul>
<li><code>set_velocity</code> is <strong>not a force</strong>. It tells physics &quot;this joint turns at this speed&quot;, and physics applies whatever torque that takes. So a wheel reaches its speed in one step, and stops in one</li>
<li>A force wins: if anything else sets a force on that joint, the speed command is ignored</li>
</ul>
<table>
<thead>
<tr>
<th></th>
<th>Gazebo, <code>set_velocity</code></th>
<th>A real robot</th>
</tr>
</thead>
<tbody>
<tr>
<td>who holds the speed</td>
<td>the physics engine — exactly, every step</td>
<td>firmware in a microcontroller, or inside the servo</td>
</tr>
<tr>
<td>feedback</td>
<td>the joint's exact speed, no noise</td>
<td>an encoder: ticks — rough and noisy</td>
</tr>
<tr>
<td>what turns the wheel</td>
<td>a torque, applied straight to the joint</td>
<td>PWM → H-bridge → current → motor → gearbox</td>
</tr>
<tr>
<td>limits</td>
<td>none, unless the model sets them</td>
<td>battery voltage, driver current, motor torque</td>
</tr>
<tr>
<td>what odometry sees</td>
<td>the ideal wheel angle</td>
<td>ticks — with slip and backlash</td>
</tr>
</tbody>
</table>
<ul>
<li>On a real robot the speed loop lives <strong>in firmware</strong>, not in ROS 2. It must also stop the motors <strong>by itself</strong> when the computer hangs</li>
</ul>
<p><span class="src"><img class="emoji" draggable="false" alt="📖" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4d6.svg" data-marp-twemoji=""/> <a href="https://gazebosim.org/api/sim/8/classgz_1_1sim_1_1Joint.html">gazebosim.org/api/sim/8/classgz_1_1sim_1_1Joint.html</a> · <img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3af.svg" data-marp-twemoji=""/> <a href="https://github.com/joshnewans/ros_arduino_bridge">github.com/joshnewans/ros_arduino_bridge</a> · <img class="emoji" draggable="false" alt="▶️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/25b6.svg" data-marp-twemoji=""/> <a href="https://articulatedrobotics.xyz/tutorials/mobile-robot/applications/ros2_control-concepts/">articulatedrobotics.xyz/tutorials/mobile-robot/applications/ros2_control-concepts</a></span></p>
<footer>KAU · Autonomous Robotic Systems Engineering · Lecture 3</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="40" data-paginate="true" data-footer="KAU · Autonomous Robotic Systems Engineering · Lecture 3" data-theme="kau" lang="en-US" data-marpit-pagination="40" style="--paginate:true;--footer:KAU · Autonomous Robotic Systems Engineering · Lecture 3;--theme:kau;" data-marpit-pagination-total="45">
<h2 id="does-your-node-change">Does Your Node Change?</h2>
<table>
<thead>
<tr>
<th>What</th>
<th>Does it change?</th>
<th>So that your code does not</th>
</tr>
</thead>
<tbody>
<tr>
<td>the algorithm — which <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>v</mi></mrow><annotation encoding="application/x-tex">v</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.4306em;"></span><span class="mord mathnormal" style="margin-right:0.0359em;">v</span></span></span></span> and <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>ω</mi></mrow><annotation encoding="application/x-tex">\omega</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.4306em;"></span><span class="mord mathnormal" style="margin-right:0.0359em;">ω</span></span></span></span> to send</td>
<td>no</td>
<td>—</td>
</tr>
<tr>
<td>the message type</td>
<td><code>Twist</code> in simulation and on a TurtleBot 3, <code>TwistStamped</code> elsewhere</td>
<td>take the type from a parameter, like teleop's <code>stamped</code></td>
</tr>
<tr>
<td>the topic name</td>
<td>sometimes — <code>&lt;ns&gt;/cmd_vel</code> on a Husky</td>
<td>a relative <code>cmd_vel</code>, and a remap in the launch file</td>
</tr>
<tr>
<td>how often you send</td>
<td>yes, if you send once: a timeout stops the robot</td>
<td>publish on a timer</td>
</tr>
<tr>
<td>whether it is obeyed literally</td>
<td>no — the robot's limits clip it</td>
<td>close the loop on <code>odom</code>, not on what you sent</td>
</tr>
<tr>
<td>the clock</td>
<td><code>use_sim_time: false</code></td>
<td>a parameter, not code</td>
</tr>
</tbody>
</table>
<ul>
<li>Publish on a timer, take the type from a parameter and the topic from a remap — and on the robot <strong>only the launch file changes</strong></li>
</ul>
<p><span class="src"><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3af.svg" data-marp-twemoji=""/> <a href="https://github.com/ros2/teleop_twist_keyboard/blob/jazzy/teleop_twist_keyboard.py">github.com/ros2/teleop_twist_keyboard/blob/jazzy/teleop_twist_keyboard.py</a></span></p>
<footer>KAU · Autonomous Robotic Systems Engineering · Lecture 3</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="41" data-paginate="true" data-footer="KAU · Autonomous Robotic Systems Engineering · Lecture 3" data-theme="kau" lang="en-US" data-marpit-pagination="41" style="--paginate:true;--footer:KAU · Autonomous Robotic Systems Engineering · Lecture 3;--theme:kau;" data-marpit-pagination-total="45">
<h2 id="exercise-optional--your-own-drive">Exercise (optional) — Your Own Drive</h2>
<div class="cols" style="grid-template-columns: 1fr 1.6fr; gap: 1.5em">
<div>
<figure>
<img src="img/custom-plugin-bot.png" alt="The exercise robot: a blue box body, two black wheels, a ball caster" style="width:100%" />
<figcaption>custom_plugin_bot: two wheels, a caster, a Python plugin.</figcaption>
</figure>
</div>
<div>
<p><strong>Not graded</strong> — for those who want to write a Gazebo plugin.</p>
<ol>
<li><strong>Build the drive</strong> — the loader block, <code>configure</code>, <code>pre_update</code>: slides 11, 13, 14</li>
<li><strong>Make it report</strong> — <code>post_update</code> and a <code>gz.msgs.Odometry</code>: <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi mathvariant="normal">Δ</mi><mi>s</mi></mrow><annotation encoding="application/x-tex">\Delta s</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mord">Δ</span><span class="mord mathnormal">s</span></span></span></span>, <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi mathvariant="normal">Δ</mi><mi>θ</mi></mrow><annotation encoding="application/x-tex">\Delta\theta</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6944em;"></span><span class="mord">Δ</span><span class="mord mathnormal" style="margin-right:0.0278em;">θ</span></span></span></span>, the pose, <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>v</mi></mrow><annotation encoding="application/x-tex">v</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.4306em;"></span><span class="mord mathnormal" style="margin-right:0.0359em;">v</span></span></span></span>, <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>ω</mi></mrow><annotation encoding="application/x-tex">\omega</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.4306em;"></span><span class="mord mathnormal" style="margin-right:0.0359em;">ω</span></span></span></span>, <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>q</mi></mrow><annotation encoding="application/x-tex">q</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.625em;vertical-align:-0.1944em;"></span><span class="mord mathnormal" style="margin-right:0.0359em;">q</span></span></span></span> — slides 22, 23, 24</li>
<li><strong>Check it</strong> — on a circle command your odometry must equal the ideal <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mo fence="false" stretchy="true" minsize="1.2em" maxsize="1.2em">(</mo><mi>R</mi><mi>sin</mi><mo>⁡</mo><mi>ω</mi><mi>t</mi><mo separator="true">,</mo><mtext> </mtext><mi>R</mi><mo stretchy="false">(</mo><mn>1</mn><mo>−</mo><mi>cos</mi><mo>⁡</mo><mi>ω</mi><mi>t</mi><mo stretchy="false">)</mo><mo separator="true">,</mo><mtext> </mtext><mi>ω</mi><mi>t</mi><mo fence="false" stretchy="true" minsize="1.2em" maxsize="1.2em">)</mo></mrow><annotation encoding="application/x-tex">\big(R\sin\omega t,\ R(1-\cos\omega t),\ \omega t\big)</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1.2em;vertical-align:-0.35em;"></span><span class="mord"><span class="delimsizing size1">(</span></span><span class="mord mathnormal" style="margin-right:0.0077em;">R</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mop">sin</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord mathnormal" style="margin-right:0.0359em;">ω</span><span class="mord mathnormal">t</span><span class="mpunct">,</span><span class="mspace"> </span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord mathnormal" style="margin-right:0.0077em;">R</span><span class="mopen">(</span><span class="mord">1</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">−</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:1.2em;vertical-align:-0.35em;"></span><span class="mop">cos</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord mathnormal" style="margin-right:0.0359em;">ω</span><span class="mord mathnormal">t</span><span class="mclose">)</span><span class="mpunct">,</span><span class="mspace"> </span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord mathnormal" style="margin-right:0.0359em;">ω</span><span class="mord mathnormal">t</span><span class="mord"><span class="delimsizing size1">)</span></span></span></span></span>. Gazebo's pose will not — say why</li>
<li><strong>Try it on robots that already exist:</strong>
<ul>
<li><code>one_wheel</code> — does &quot;turn left&quot; do what slide 35 says?</li>
<li>Pioneer 2DX, Fuel — two wheels, the closest to ideal</li>
<li>Husky, Fuel — make it drive all four joints, then watch it lie</li>
<li>TurtleBot 3, Fuel — fix its wheel radius first</li>
</ul>
</li>
</ol>
</div>
</div>
<p><span class="src"><img class="emoji" draggable="false" alt="📖" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4d6.svg" data-marp-twemoji=""/> <a href="https://gazebosim.org/api/sim/8/python_interfaces.html">gazebosim.org/api/sim/8/python_interfaces.html</a></span></p>
<footer>KAU · Autonomous Robotic Systems Engineering · Lecture 3</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="42" data-paginate="true" data-footer="KAU · Autonomous Robotic Systems Engineering · Lecture 3" data-class="section" data-theme="kau" lang="en-US" class="section" data-marpit-pagination="42" style="--paginate:true;--footer:KAU · Autonomous Robotic Systems Engineering · Lecture 3;--class:section;--theme:kau;" data-marpit-pagination-total="45">
<h1 id="rotors">Rotors</h1>
<p><em>How a drone's plugins differ from DiffDrive</em></p>
<footer>KAU · Autonomous Robotic Systems Engineering · Lecture 3</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="43" data-paginate="true" data-footer="KAU · Autonomous Robotic Systems Engineering · Lecture 3" data-theme="kau" lang="en-US" data-marpit-pagination="43" style="--paginate:true;--footer:KAU · Autonomous Robotic Systems Engineering · Lecture 3;--theme:kau;" data-marpit-pagination-total="45">
<h2 id="two-plugins-again">Two Plugins, Again</h2>
<div style="text-align:center">
<svg width="1000" height="124" viewBox="0 0 1000 124" style="max-width:100%">
  <defs><marker id="l3e" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 1 L9 5 L0 9 z" fill="#111" /></marker></defs>
  <g fill="none" stroke="#111" stroke-width="1.5" font-family="DM Sans, sans-serif" font-size="13">
    <rect x="10" y="24" width="140" height="76" rx="4" />
    <text x="80" y="56" text-anchor="middle" stroke="none" fill="#111" font-weight="bold">Twist</text>
    <text x="80" y="76" text-anchor="middle" stroke="none" fill="#666" font-size="12">linear.z, m/s</text>
    <path d="M150 62 L196 62" marker-end="url(#l3e)" />
    <rect x="200" y="24" width="300" height="76" rx="4" fill="#f5f5f5" />
    <text x="350" y="50" text-anchor="middle" stroke="none" fill="#111" font-weight="bold">MulticopterVelocityControl</text>
    <text x="350" y="70" text-anchor="middle" stroke="none" fill="#666" font-size="12">one per drone · speed error → thrust</text>
    <text x="350" y="88" text-anchor="middle" stroke="none" fill="#666" font-size="12">→ one speed for every rotor</text>
    <path d="M500 62 L586 62" marker-end="url(#l3e)" />
    <text x="543" y="54" text-anchor="middle" stroke="none" fill="#666" font-size="12">Actuators</text>
    <rect x="590" y="24" width="250" height="76" rx="4" />
    <text x="715" y="50" text-anchor="middle" stroke="none" fill="#111" font-weight="bold">MulticopterMotorModel × 4</text>
    <text x="715" y="70" text-anchor="middle" stroke="none" fill="#666" font-size="12">one per rotor</text>
    <text x="715" y="88" text-anchor="middle" stroke="none" fill="#666" font-size="12">thrust = k · Ω²</text>
    <path d="M840 62 L876 62" marker-end="url(#l3e)" />
    <rect x="880" y="24" width="110" height="76" rx="4" fill="#f5f5f5" />
    <text x="935" y="66" text-anchor="middle" stroke="none" fill="#111" font-weight="bold">physics</text>

</div>
<ul>
<li>The <strong>motor</strong> knows one rotor and nothing about the aircraft — the drone's version of the Husky's wheel joint</li>
<li>The <strong>controller</strong> is the brain: it reads the drone's real velocity from Gazebo and decides how hard to push</li>
<li>To go straight up, all four spin <strong>equally</strong>: the thrust stays vertical, and the twisting torques cancel — two rotors turn clockwise, two anticlockwise</li>
<li>Up and down only. How the controller works, and writing a motor of our own — a later lecture</li>
</ul>

<h2 id="a-motor-is-not-a-drive">A Motor Is Not a Drive</h2>
<div class="lg">
<div>
<table>
<thead>
<tr>
<th></th>
<th><code>DiffDrive</code></th>
<th><code>MulticopterMotorModel</code> + <code>MulticopterVelocityControl</code></th>
</tr>
</thead>
<tbody>
<tr>
<td>plugins per robot</td>
<td>one</td>
<td>one <strong>per rotor</strong>, and one controller</td>
</tr>
<tr>
<td>input</td>
<td><code>Twist</code> — an intention</td>
<td>one speed per rotor, from the controller</td>
</tr>
<tr>
<td>what it sets every step</td>
<td>each wheel joint's <strong>speed</strong> — physics holds it exactly</td>
<td>the rotor's speed, and a <strong>force</strong> along the rotor axis with a twist on the body</td>
</tr>
<tr>
<td>formula</td>
<td>left <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mo stretchy="false">(</mo><mi>v</mi><mo>−</mo><mi>ω</mi><mi>L</mi><mi mathvariant="normal">/</mi><mn>2</mn><mo stretchy="false">)</mo><mi mathvariant="normal">/</mi><mi>r</mi></mrow><annotation encoding="application/x-tex">(v - \omega L/2)/r</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mopen">(</span><span class="mord mathnormal" style="margin-right:0.0359em;">v</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">−</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathnormal" style="margin-right:0.0359em;">ω</span><span class="mord mathnormal">L</span><span class="mord">/2</span><span class="mclose">)</span><span class="mord">/</span><span class="mord mathnormal" style="margin-right:0.0278em;">r</span></span></span></span>, right <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mo stretchy="false">(</mo><mi>v</mi><mo>+</mo><mi>ω</mi><mi>L</mi><mi mathvariant="normal">/</mi><mn>2</mn><mo stretchy="false">)</mo><mi mathvariant="normal">/</mi><mi>r</mi></mrow><annotation encoding="application/x-tex">(v + \omega L/2)/r</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mopen">(</span><span class="mord mathnormal" style="margin-right:0.0359em;">v</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">+</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathnormal" style="margin-right:0.0359em;">ω</span><span class="mord mathnormal">L</span><span class="mord">/2</span><span class="mclose">)</span><span class="mord">/</span><span class="mord mathnormal" style="margin-right:0.0278em;">r</span></span></span></span> — exact kinematics</td>
<td><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>T</mi><mo>=</mo><mi>k</mi><mtext> </mtext><msup><mi mathvariant="normal">Ω</mi><mn>2</mn></msup></mrow><annotation encoding="application/x-tex">T = k\,\Omega^2</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.1389em;">T</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.8141em;"></span><span class="mord mathnormal" style="margin-right:0.0315em;">k</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord"><span class="mord">Ω</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.8141em;"><span style="top:-3.063em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight">2</span></span></span></span></span></span></span></span></span></span></span> — then physics integrates it</td>
</tr>
<tr>
<td>who closes the loop</td>
<td>nobody needs to: the ground holds the robot level</td>
<td>the controller, watching the real velocity</td>
</tr>
<tr>
<td>odometry</td>
<td>yes, from the wheel angles</td>
<td>none — a separate plugin</td>
</tr>
<tr>
<td>on a real robot</td>
<td>firmware holds each wheel's speed: OpenCR, ARCOS, the Husky's MCU</td>
<td>an autopilot — PX4, ArduPilot — and an ESC per motor</td>
</tr>
</tbody>
</table>
<ul>
<li>The wheel formula is exact: set the speeds, and the robot goes there. The rotor formula only says how hard to push — something must watch the result</li>
</ul>
</div>
<div class="legend">
<p><strong>Legend</strong><br />
<span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>v</mi><mo separator="true">,</mo><mi>ω</mi></mrow><annotation encoding="application/x-tex">v, \omega</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.625em;vertical-align:-0.1944em;"></span><span class="mord mathnormal" style="margin-right:0.0359em;">v</span><span class="mpunct">,</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord mathnormal" style="margin-right:0.0359em;">ω</span></span></span></span> — from the <code>Twist</code><br />
<span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>L</mi></mrow><annotation encoding="application/x-tex">L</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mord mathnormal">L</span></span></span></span> — distance between the wheels, m<br />
<span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>r</mi></mrow><annotation encoding="application/x-tex">r</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.4306em;"></span><span class="mord mathnormal" style="margin-right:0.0278em;">r</span></span></span></span> — wheel radius, m<br />
<span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>T</mi></mrow><annotation encoding="application/x-tex">T</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.1389em;">T</span></span></span></span> — thrust of one rotor, N<br />
<span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>k</mi></mrow><annotation encoding="application/x-tex">k</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6944em;"></span><span class="mord mathnormal" style="margin-right:0.0315em;">k</span></span></span></span> — <code>motorConstant</code><br />
<span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi mathvariant="normal">Ω</mi></mrow><annotation encoding="application/x-tex">\Omega</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mord">Ω</span></span></span></span> — the rotor's spin speed, rad/s</p>
</div>
</div>
