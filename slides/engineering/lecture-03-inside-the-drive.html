<h2 id="why-differential">Why &quot;Differential&quot;</h2>
<div class="cols">
<div>
<svg width="460" height="320" viewBox="0 0 460 320" style="max-width:100%">
  <defs><marker id="l3a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1 L9 5 L0 9 z" fill="#111" /></marker><marker id="l3a2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1 L9 5 L0 9 z" fill="#888" /></marker></defs>

<div>
<p><span class="katex-display"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mi>ω</mi><mo>=</mo><mfrac><mrow><msub><mi>v</mi><mi>R</mi></msub><mo>−</mo><msub><mi>v</mi><mi>L</mi></msub></mrow><mi>L</mi></mfrac></mrow><annotation encoding="application/x-tex">\omega = \frac{v_R - v_L}{L}
</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.4306em;"></span><span class="mord mathnormal" style="margin-right:0.0359em;">ω</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:1.9463em;vertical-align:-0.686em;"></span><span class="mord"><span class="mopen nulldelimiter"></span><span class="mfrac"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:1.2603em;"><span style="top:-2.314em;"><span class="pstrut" style="height:3em;"></span><span class="mord"><span class="mord mathnormal">L</span></span></span><span style="top:-3.23em;"><span class="pstrut" style="height:3em;"></span><span class="frac-line" style="border-bottom-width:0.04em;"></span></span><span style="top:-3.677em;"><span class="pstrut" style="height:3em;"></span><span class="mord"><span class="mord"><span class="mord mathnormal" style="margin-right:0.0359em;">v</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3283em;"><span style="top:-2.55em;margin-left:-0.0359em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight" style="margin-right:0.0077em;">R</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">−</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0359em;">v</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3283em;"><span style="top:-2.55em;margin-left:-0.0359em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight">L</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.686em;"><span></span></span></span></span></span><span class="mclose nulldelimiter"></span></span></span></span></span></span></p><ul>
<li>The <strong>difference</strong> between the two wheels <em>is</em> the turn</li>
<li>Equal → straight · unequal → an arc · opposite → a spin on the spot</li>
<li>No steering wheel: each wheel has <strong>its own motor</strong>. The arrow tips point at the turn centre</li>
</ul>
<div class="legend">
<p><strong>Legend</strong><br />
<span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>v</mi><mi>L</mi></msub><mo separator="true">,</mo><msub><mi>v</mi><mi>R</mi></msub></mrow><annotation encoding="application/x-tex">v_L, v_R</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.625em;vertical-align:-0.1944em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0359em;">v</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3283em;"><span style="top:-2.55em;margin-left:-0.0359em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight">L</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mpunct">,</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0359em;">v</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3283em;"><span style="top:-2.55em;margin-left:-0.0359em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight" style="margin-right:0.0077em;">R</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span></span></span></span> — speed of the left / right tyre over the floor, m/s<br />
<span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>L</mi></mrow><annotation encoding="application/x-tex">L</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mord mathnormal">L</span></span></span></span> — distance between the two wheels, m<br />
<span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>ω</mi></mrow><annotation encoding="application/x-tex">\omega</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.4306em;"></span><span class="mord mathnormal" style="margin-right:0.0359em;">ω</span></span></span></span> — how fast the robot turns, rad/s<br />
<span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>v</mi></mrow><annotation encoding="application/x-tex">v</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.4306em;"></span><span class="mord mathnormal" style="margin-right:0.0359em;">v</span></span></span></span> — speed of the robot's centre, m/s<br />
<span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>R</mi></mrow><annotation encoding="application/x-tex">R</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.0077em;">R</span></span></span></span> — distance to the turn centre, m</p>

<h2 id="the-unicycle-model">The Unicycle Model</h2>
<div class="lg">
<div>
<p><strong>Uni-cycle — a one-wheeled cycle.</strong> The model treats the whole robot as <strong>one imaginary wheel</strong>. It rolls where it faces and can turn on the spot. It never slides sideways</p>
<p><span class="katex-display"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mover accent="true"><mi>x</mi><mo>˙</mo></mover><mo>=</mo><mi>v</mi><mi>cos</mi><mo>⁡</mo><mi>θ</mi><mo separator="true">,</mo><mspace width="2em"/><mover accent="true"><mi>y</mi><mo>˙</mo></mover><mo>=</mo><mi>v</mi><mi>sin</mi><mo>⁡</mo><mi>θ</mi><mo separator="true">,</mo><mspace width="2em"/><mover accent="true"><mi>θ</mi><mo>˙</mo></mover><mo>=</mo><mi>ω</mi></mrow><annotation encoding="application/x-tex">\dot x = v\cos\theta, \qquad \dot y = v\sin\theta, \qquad \dot\theta = \omega
</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6679em;"></span><span class="mord accent"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.6679em;"><span style="top:-3em;"><span class="pstrut" style="height:3em;"></span><span class="mord mathnormal">x</span></span><span style="top:-3em;"><span class="pstrut" style="height:3em;"></span><span class="accent-body" style="left:-0.1111em;"><span class="mord">˙</span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.8889em;vertical-align:-0.1944em;"></span><span class="mord mathnormal" style="margin-right:0.0359em;">v</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mop">cos</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord mathnormal" style="margin-right:0.0278em;">θ</span><span class="mpunct">,</span><span class="mspace" style="margin-right:2em;"></span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord accent"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.6679em;"><span style="top:-3em;"><span class="pstrut" style="height:3em;"></span><span class="mord mathnormal" style="margin-right:0.0359em;">y</span></span><span style="top:-3em;"><span class="pstrut" style="height:3em;"></span><span class="accent-body" style="left:-0.0833em;"><span class="mord">˙</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.1944em;"><span></span></span></span></span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:1.1257em;vertical-align:-0.1944em;"></span><span class="mord mathnormal" style="margin-right:0.0359em;">v</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mop">sin</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord mathnormal" style="margin-right:0.0278em;">θ</span><span class="mpunct">,</span><span class="mspace" style="margin-right:2em;"></span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord accent"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.9313em;"><span style="top:-3em;"><span class="pstrut" style="height:3em;"></span><span class="mord mathnormal" style="margin-right:0.0278em;">θ</span></span><span style="top:-3.2634em;"><span class="pstrut" style="height:3em;"></span><span class="accent-body" style="left:-0.0556em;"><span class="mord">˙</span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.4306em;"></span><span class="mord mathnormal" style="margin-right:0.0359em;">ω</span></span></span></span></span></p><ul>
<li><strong>Two</strong> commands move <strong>three</strong> coordinates. Sideways is not a command</li>
</ul>
<p><span class="katex-display"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mi>v</mi><mo>=</mo><mfrac><mrow><msub><mi>v</mi><mi>R</mi></msub><mo>+</mo><msub><mi>v</mi><mi>L</mi></msub></mrow><mn>2</mn></mfrac><mo separator="true">,</mo><mspace width="2em"/><mi>ω</mi><mo>=</mo><mfrac><mrow><msub><mi>v</mi><mi>R</mi></msub><mo>−</mo><msub><mi>v</mi><mi>L</mi></msub></mrow><mi>L</mi></mfrac></mrow><annotation encoding="application/x-tex">v = \frac{v_R + v_L}{2}, \qquad \omega = \frac{v_R - v_L}{L}
</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.4306em;"></span><span class="mord mathnormal" style="margin-right:0.0359em;">v</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:1.9463em;vertical-align:-0.686em;"></span><span class="mord"><span class="mopen nulldelimiter"></span><span class="mfrac"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:1.2603em;"><span style="top:-2.314em;"><span class="pstrut" style="height:3em;"></span><span class="mord"><span class="mord">2</span></span></span><span style="top:-3.23em;"><span class="pstrut" style="height:3em;"></span><span class="frac-line" style="border-bottom-width:0.04em;"></span></span><span style="top:-3.677em;"><span class="pstrut" style="height:3em;"></span><span class="mord"><span class="mord"><span class="mord mathnormal" style="margin-right:0.0359em;">v</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3283em;"><span style="top:-2.55em;margin-left:-0.0359em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight" style="margin-right:0.0077em;">R</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">+</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0359em;">v</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3283em;"><span style="top:-2.55em;margin-left:-0.0359em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight">L</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.686em;"><span></span></span></span></span></span><span class="mclose nulldelimiter"></span></span><span class="mpunct">,</span><span class="mspace" style="margin-right:2em;"></span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord mathnormal" style="margin-right:0.0359em;">ω</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:1.9463em;vertical-align:-0.686em;"></span><span class="mord"><span class="mopen nulldelimiter"></span><span class="mfrac"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:1.2603em;"><span style="top:-2.314em;"><span class="pstrut" style="height:3em;"></span><span class="mord"><span class="mord mathnormal">L</span></span></span><span style="top:-3.23em;"><span class="pstrut" style="height:3em;"></span><span class="frac-line" style="border-bottom-width:0.04em;"></span></span><span style="top:-3.677em;"><span class="pstrut" style="height:3em;"></span><span class="mord"><span class="mord"><span class="mord mathnormal" style="margin-right:0.0359em;">v</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3283em;"><span style="top:-2.55em;margin-left:-0.0359em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight" style="margin-right:0.0077em;">R</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">−</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0359em;">v</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3283em;"><span style="top:-2.55em;margin-left:-0.0359em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight">L</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.686em;"><span></span></span></span></span></span><span class="mclose nulldelimiter"></span></span></span></span></span></span></p><ul>
<li>Two real wheels make that one imaginary wheel: the average is <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>v</mi></mrow><annotation encoding="application/x-tex">v</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.4306em;"></span><span class="mord mathnormal" style="margin-right:0.0359em;">v</span></span></span></span>, the difference is <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>ω</mi></mrow><annotation encoding="application/x-tex">\omega</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.4306em;"></span><span class="mord mathnormal" style="margin-right:0.0359em;">ω</span></span></span></span></li>
<li><strong>Two wheels, four wheels, tracks — all are unicycles.</strong> Each side moves as one, and nothing steers. So the robot has only <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>v</mi></mrow><annotation encoding="application/x-tex">v</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.4306em;"></span><span class="mord mathnormal" style="margin-right:0.0359em;">v</span></span></span></span> and <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>ω</mi></mrow><annotation encoding="application/x-tex">\omega</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.4306em;"></span><span class="mord mathnormal" style="margin-right:0.0359em;">ω</span></span></span></span>. Four wheels obey it only approximately: they slide (later)</li>
<li>A <code>Twist</code> uses two of its six numbers: <code>linear.x</code> = <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>v</mi></mrow><annotation encoding="application/x-tex">v</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.4306em;"></span><span class="mord mathnormal" style="margin-right:0.0359em;">v</span></span></span></span>, <code>angular.z</code> = <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>ω</mi></mrow><annotation encoding="application/x-tex">\omega</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.4306em;"></span><span class="mord mathnormal" style="margin-right:0.0359em;">ω</span></span></span></span></li>
</ul>
</div>
<div class="legend">
<p><strong>Legend</strong><br />
<span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>x</mi><mo separator="true">,</mo><mi>y</mi></mrow><annotation encoding="application/x-tex">x, y</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.625em;vertical-align:-0.1944em;"></span><span class="mord mathnormal">x</span><span class="mpunct">,</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord mathnormal" style="margin-right:0.0359em;">y</span></span></span></span> — where the robot is, m<br />
<span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>θ</mi></mrow><annotation encoding="application/x-tex">\theta</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6944em;"></span><span class="mord mathnormal" style="margin-right:0.0278em;">θ</span></span></span></span> — where it faces, rad<br />
<span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mover accent="true"><mi>x</mi><mo>˙</mo></mover></mrow><annotation encoding="application/x-tex">\dot x</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6679em;"></span><span class="mord accent"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.6679em;"><span style="top:-3em;"><span class="pstrut" style="height:3em;"></span><span class="mord mathnormal">x</span></span><span style="top:-3em;"><span class="pstrut" style="height:3em;"></span><span class="accent-body" style="left:-0.1111em;"><span class="mord">˙</span></span></span></span></span></span></span></span></span></span> — &quot;<span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>x</mi></mrow><annotation encoding="application/x-tex">x</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.4306em;"></span><span class="mord mathnormal">x</span></span></span></span> per second&quot;: a dot is a rate<br />
<span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>v</mi></mrow><annotation encoding="application/x-tex">v</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.4306em;"></span><span class="mord mathnormal" style="margin-right:0.0359em;">v</span></span></span></span> — forward speed, m/s<br />
<span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>ω</mi></mrow><annotation encoding="application/x-tex">\omega</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.4306em;"></span><span class="mord mathnormal" style="margin-right:0.0359em;">ω</span></span></span></span> — turn rate, rad/s<br />
<span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>v</mi><mi>L</mi></msub><mo separator="true">,</mo><msub><mi>v</mi><mi>R</mi></msub></mrow><annotation encoding="application/x-tex">v_L, v_R</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.625em;vertical-align:-0.1944em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0359em;">v</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3283em;"><span style="top:-2.55em;margin-left:-0.0359em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight">L</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mpunct">,</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0359em;">v</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3283em;"><span style="top:-2.55em;margin-left:-0.0359em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight" style="margin-right:0.0077em;">R</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span></span></span></span> — speed of each tyre, m/s<br />
<span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>L</mi></mrow><annotation encoding="application/x-tex">L</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mord mathnormal">L</span></span></span></span> — distance between the wheels, m</p>
</div>
</div>
<p><span class="src"><img class="emoji" draggable="false" alt="📖" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4d6.svg" data-marp-twemoji=""/> <a href="https://hades.mech.northwestern.edu/index.php/Modern_Robotics">hades.mech.northwestern.edu/index.php/Modern_Robotics</a> — ch. 13.3, nonholonomic wheeled mobile robots</span></p>
<footer>KAU · Autonomous Robotic Systems Engineering · Lecture 3</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-footer="KAU · Autonomous Robotic Systems Engineering · Lecture 3" data-class="section" data-theme="kau" lang="en-US" class="section" data-marpit-pagination="6" style="--paginate:true;--footer:KAU · Autonomous Robotic Systems Engineering · Lecture 3;--class:section;--theme:kau;" data-marpit-pagination-total="45">
<h1 id="one-plugin-any-number-of-wheels">One Plugin, Any Number of Wheels</h1>
<p><em>Four and two — the same code; one comes later</em></p>
<footer>KAU · Autonomous Robotic Systems Engineering · Lecture 3</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-footer="KAU · Autonomous Robotic Systems Engineering · Lecture 3" data-theme="kau" lang="en-US" data-marpit-pagination="7" style="--paginate:true;--footer:KAU · Autonomous Robotic Systems Engineering · Lecture 3;--theme:kau;" data-marpit-pagination-total="45">
<h2 id="the-plugin-block">The Plugin Block</h2>
<pre><code class="language-xml"><span class="hljs-comment">&lt;!-- Gazebo&#x27;s stock DiffDrive: the library file and the class inside it --&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">plugin</span> <span class="hljs-attr">filename</span>=<span class="hljs-string">&quot;gz-sim-diff-drive-system&quot;</span> <span class="hljs-attr">name</span>=<span class="hljs-string">&quot;gz::sim::systems::DiffDrive&quot;</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">left_joint</span>&gt;</span>left_wheel_joint<span class="hljs-tag">&lt;/<span class="hljs-name">left_joint</span>&gt;</span>       <span class="hljs-comment">&lt;!-- a left wheel joint; repeat for more --&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">right_joint</span>&gt;</span>right_wheel_joint<span class="hljs-tag">&lt;/<span class="hljs-name">right_joint</span>&gt;</span>    <span class="hljs-comment">&lt;!-- a right wheel joint --&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">wheel_separation</span>&gt;</span>0.35<span class="hljs-tag">&lt;/<span class="hljs-name">wheel_separation</span>&gt;</span>       <span class="hljs-comment">&lt;!-- L, m.  Default 1.0 --&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">wheel_radius</span>&gt;</span>0.1<span class="hljs-tag">&lt;/<span class="hljs-name">wheel_radius</span>&gt;</span>                <span class="hljs-comment">&lt;!-- r, m.  Default 0.2 --&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">topic</span>&gt;</span>/model/bot/cmd_vel<span class="hljs-tag">&lt;/<span class="hljs-name">topic</span>&gt;</span>               <span class="hljs-comment">&lt;!-- IN:  gz.msgs.Twist --&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">odom_topic</span>&gt;</span>/model/bot/odometry<span class="hljs-tag">&lt;/<span class="hljs-name">odom_topic</span>&gt;</span>    <span class="hljs-comment">&lt;!-- OUT: gz.msgs.Odometry --&gt;</span>
<span class="hljs-tag">&lt;/<span class="hljs-name">plugin</span>&gt;</span>
</code></pre>
<ul>
<li>Only the joints are required. The defaults of <code>wheel_separation</code> and <code>wheel_radius</code> are <strong>wrong for every real robot</strong>. It still drives — and its odometry lies</li>
<li><strong>In:</strong> <code>gz.msgs.Twist</code> — it reads only <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>v</mi></mrow><annotation encoding="application/x-tex">v</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.4306em;"></span><span class="mord mathnormal" style="margin-right:0.0359em;">v</span></span></span></span> and <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>ω</mi></mrow><annotation encoding="application/x-tex">\omega</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.4306em;"></span><span class="mord mathnormal" style="margin-right:0.0359em;">ω</span></span></span></span>. <strong>Out:</strong> <code>gz.msgs.Odometry</code> — position, heading, the two speeds. The bridge turns it into <code>nav_msgs/msg/Odometry</code></li>
<li>Optional tags: publish rate, frame names, limits</li>
</ul>
<p><span class="src"><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3af.svg" data-marp-twemoji=""/> <a href="https://github.com/gazebosim/gz-sim/blob/gz-sim8/src/systems/diff_drive/DiffDrive.hh">github.com/gazebosim/gz-sim/blob/gz-sim8/src/systems/diff_drive/DiffDrive.hh</a></span></p>
<footer>KAU · Autonomous Robotic Systems Engineering · Lecture 3</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-footer="KAU · Autonomous Robotic Systems Engineering · Lecture 3" data-theme="kau" lang="en-US" data-marpit-pagination="8" style="--paginate:true;--footer:KAU · Autonomous Robotic Systems Engineering · Lecture 3;--theme:kau;" data-marpit-pagination-total="45">
<h2 id="four-wheels--the-husky">Four Wheels — the Husky</h2>
<div class="cols">
<div>
<figure>
<img src="img/husky-in-gazebo.png" alt="The Clearpath Husky in our Gazebo world" style="width:100%" />
<figcaption>The Husky from Fuel, in our own world.</figcaption>
</figure>
</div>
<div>
<pre><code class="language-xml"><span class="hljs-tag">&lt;<span class="hljs-name">left_joint</span>&gt;</span>front_left_wheel_joint<span class="hljs-tag">&lt;/<span class="hljs-name">left_joint</span>&gt;</span>     <span class="hljs-comment">&lt;!-- two joints on the left… --&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">left_joint</span>&gt;</span>rear_left_wheel_joint<span class="hljs-tag">&lt;/<span class="hljs-name">left_joint</span>&gt;</span>      <span class="hljs-comment">&lt;!-- …both get one speed --&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">right_joint</span>&gt;</span>front_right_wheel_joint<span class="hljs-tag">&lt;/<span class="hljs-name">right_joint</span>&gt;</span>  <span class="hljs-comment">&lt;!-- two on the right… --&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">right_joint</span>&gt;</span>rear_right_wheel_joint<span class="hljs-tag">&lt;/<span class="hljs-name">right_joint</span>&gt;</span>   <span class="hljs-comment">&lt;!-- …likewise --&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">wheel_separation</span>&gt;</span>0.5708<span class="hljs-tag">&lt;/<span class="hljs-name">wheel_separation</span>&gt;</span>         <span class="hljs-comment">&lt;!-- L: left to right, m --&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">wheel_radius</span>&gt;</span>0.1651<span class="hljs-tag">&lt;/<span class="hljs-name">wheel_radius</span>&gt;</span>                 <span class="hljs-comment">&lt;!-- r, m --&gt;</span>
</code></pre>
</div>
</div>
<ul>
<li>All left joints get one speed, all right joints another: a skid-steer, driven like a tank</li>
<li>Odometry reads only the <strong>first</strong> joint of each side — here <code>front_left</code> and <code>front_right</code></li>
<li>There is no wheelbase tag. Every turn scrapes the tyres sideways (later)</li>
</ul>
<p><span class="src"><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3af.svg" data-marp-twemoji=""/> <a href="https://github.com/gazebosim/gz-sim/blob/gz-sim8/examples/worlds/diff_drive_skid.sdf">github.com/gazebosim/gz-sim/blob/gz-sim8/examples/worlds/diff_drive_skid.sdf</a></span></p>
<footer>KAU · Autonomous Robotic Systems Engineering · Lecture 3</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-footer="KAU · Autonomous Robotic Systems Engineering · Lecture 3" data-theme="kau" lang="en-US" data-marpit-pagination="9" style="--paginate:true;--footer:KAU · Autonomous Robotic Systems Engineering · Lecture 3;--theme:kau;" data-marpit-pagination-total="45">
<h2 id="two-wheels--the-pioneer-2dx">Two Wheels — the Pioneer 2DX</h2>
<div class="cols">
<div>
<figure>
<img src="img/pioneer-in-gazebo.png" alt="The Pioneer 2DX in our Gazebo world: a red body, two large black wheels" style="width:100%" />
<figcaption>The Pioneer 2DX from Fuel, in our own world.</figcaption>
</figure>
</div>
<div>
<pre><code class="language-xml"><span class="hljs-tag">&lt;<span class="hljs-name">left_joint</span>&gt;</span>left_wheel_hinge<span class="hljs-tag">&lt;/<span class="hljs-name">left_joint</span>&gt;</span>      <span class="hljs-comment">&lt;!-- one driven wheel a side --&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">right_joint</span>&gt;</span>right_wheel_hinge<span class="hljs-tag">&lt;/<span class="hljs-name">right_joint</span>&gt;</span>   <span class="hljs-comment">&lt;!-- and the other --&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">wheel_separation</span>&gt;</span>0.34<span class="hljs-tag">&lt;/<span class="hljs-name">wheel_separation</span>&gt;</span>      <span class="hljs-comment">&lt;!-- L, m --&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">wheel_radius</span>&gt;</span>0.11<span class="hljs-tag">&lt;/<span class="hljs-name">wheel_radius</span>&gt;</span>              <span class="hljs-comment">&lt;!-- r, m --&gt;</span>
</code></pre>
<ul>
<li>The textbook case: two driven wheels on one axle</li>
<li>Behind them, a <strong>ball</strong> that only carries weight. It has no friction and no joint: it just slides</li>
</ul>
</div>
</div>
<p><span class="src"><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3af.svg" data-marp-twemoji=""/> <a href="https://github.com/gazebosim/gz-sim/blob/gz-sim8/examples/worlds/diff_drive.sdf">github.com/gazebosim/gz-sim/blob/gz-sim8/examples/worlds/diff_drive.sdf</a></span></p>
<footer>KAU · Autonomous Robotic Systems Engineering · Lecture 3</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-footer="KAU · Autonomous Robotic Systems Engineering · Lecture 3" data-class="section" data-theme="kau" lang="en-US" class="section" data-marpit-pagination="10" style="--paginate:true;--footer:KAU · Autonomous Robotic Systems Engineering · Lecture 3;--class:section;--theme:kau;" data-marpit-pagination-total="45">
<h1 id="inside-the-plugin">Inside the Plugin</h1>
<p><em>Twist in, wheel speeds out, odometry back</em></p>
<footer>KAU · Autonomous Robotic Systems Engineering · Lecture 3</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-marpit-scope-6xxx2f2R="" data-paginate="true" data-footer="KAU · Autonomous Robotic Systems Engineering · Lecture 3" data-theme="kau" lang="en-US" data-marpit-pagination="11" style="--paginate:true;--footer:KAU · Autonomous Robotic Systems Engineering · Lecture 3;--theme:kau;" data-marpit-pagination-total="45">
<h2 id="a-plugin-in-python">A Plugin in Python</h2>
<pre><code class="language-xml"><span class="hljs-comment">&lt;!-- the loader: a system that comes with Gazebo and runs a Python module --&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">plugin</span> <span class="hljs-attr">filename</span>=<span class="hljs-string">&quot;gz-sim-python-system-loader-system&quot;</span> <span class="hljs-attr">name</span>=<span class="hljs-string">&quot;gz::sim::systems::PythonSystemLoader&quot;</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">module_name</span>&gt;</span>simple_diff_drive<span class="hljs-tag">&lt;/<span class="hljs-name">module_name</span>&gt;</span>     <span class="hljs-comment">&lt;!-- our file: simple_diff_drive.py --&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">left_joint</span>&gt;</span>left_wheel_joint<span class="hljs-tag">&lt;/<span class="hljs-name">left_joint</span>&gt;</span>        <span class="hljs-comment">&lt;!-- from here on: our own tags… --&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">right_joint</span>&gt;</span>right_wheel_joint<span class="hljs-tag">&lt;/<span class="hljs-name">right_joint</span>&gt;</span>     <span class="hljs-comment">&lt;!-- …named like the stock ones --&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">wheel_separation</span>&gt;</span>0.35<span class="hljs-tag">&lt;/<span class="hljs-name">wheel_separation</span>&gt;</span>        <span class="hljs-comment">&lt;!-- L --&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">wheel_radius</span>&gt;</span>0.1<span class="hljs-tag">&lt;/<span class="hljs-name">wheel_radius</span>&gt;</span>                 <span class="hljs-comment">&lt;!-- r --&gt;</span>
<span class="hljs-tag">&lt;/<span class="hljs-name">plugin</span>&gt;</span>
</code></pre>
<pre><code class="language-python"><span class="hljs-keyword">class</span> <span class="hljs-title class_">SimpleDiffDrive</span>:                                     <span class="hljs-comment"># the plugin: one object per &lt;plugin&gt; block</span>
    <span class="hljs-keyword">def</span> <span class="hljs-title function_">configure</span>(<span class="hljs-params">self, entity, sdf, ecm, event_mgr</span>): ...  <span class="hljs-comment"># once, when the world loads</span>
    <span class="hljs-keyword">def</span> <span class="hljs-title function_">pre_update</span>(<span class="hljs-params">self, info, ecm</span>): ...                   <span class="hljs-comment"># every step, BEFORE physics</span>
    <span class="hljs-keyword">def</span> <span class="hljs-title function_">post_update</span>(<span class="hljs-params">self, info, ecm</span>): ...                  <span class="hljs-comment"># every step, AFTER physics</span>

<span class="hljs-keyword">def</span> <span class="hljs-title function_">get_system</span>():                                          <span class="hljs-comment"># the loader calls this once…</span>
    <span class="hljs-keyword">return</span> SimpleDiffDrive()                               <span class="hljs-comment"># …and gets the object back</span>
</code></pre>
<ul>
<li>The loader imports the module and calls <code>get_system()</code>. Then it calls the object's methods at each moment — only the ones it has. <code>configure</code> reads our tags by name</li>
</ul>
<p><span class="src"><img class="emoji" draggable="false" alt="📖" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4d6.svg" data-marp-twemoji=""/> <a href="https://gazebosim.org/api/sim/8/python_interfaces.html">gazebosim.org/api/sim/8/python_interfaces.html</a> · <img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3af.svg" data-marp-twemoji=""/> <a href="https://github.com/gazebosim/gz-sim/blob/gz-sim8/examples/worlds/python_system_loader.sdf">github.com/gazebosim/gz-sim/blob/gz-sim8/examples/worlds/python_system_loader.sdf</a></span></p>
<footer>KAU · Autonomous Robotic Systems Engineering · Lecture 3</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-footer="KAU · Autonomous Robotic Systems Engineering · Lecture 3" data-theme="kau" lang="en-US" data-marpit-pagination="12" style="--paginate:true;--footer:KAU · Autonomous Robotic Systems Engineering · Lecture 3;--theme:kau;" data-marpit-pagination-total="45">
<h2 id="one-step-four-moments">One Step, Four Moments</h2>
<div style="text-align:center">
<svg width="1000" height="236" viewBox="0 0 1000 236" style="max-width:100%">
  <defs><marker id="l3b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 1 L9 5 L0 9 z" fill="#111" /></marker></defs>
  <g fill="none" stroke="#111" stroke-width="1.5" font-family="DM Sans, sans-serif" font-size="13">
    <rect x="20" y="6" width="280" height="58" rx="4" stroke-dasharray="5 3" />
    <text x="160" y="30" text-anchor="middle" stroke="none" fill="#111" font-weight="bold">on_cmd_vel — the message thread</text>
    <text x="160" y="50" text-anchor="middle" stroke="none" fill="#666" font-size="12">a Twist arrives: keep v and ω</text>
    <path d="M160 64 L160 116" marker-end="url(#l3b)" />
    <text x="172" y="94" stroke="none" fill="#666" font-size="12">the kept v, ω — until the next Twist</text>
    <rect x="20" y="120" width="280" height="64" rx="4" />
    <text x="160" y="146" text-anchor="middle" stroke="none" fill="#111" font-weight="bold">pre_update</text>
    <text x="160" y="166" text-anchor="middle" stroke="none" fill="#666" font-size="12">v, ω → two wheel speeds → set_velocity</text>
    <path d="M300 152 L336 152" marker-end="url(#l3b)" />
    <rect x="340" y="120" width="260" height="64" rx="4" fill="#f5f5f5" />
    <text x="470" y="146" text-anchor="middle" stroke="none" fill="#111" font-weight="bold">physics</text>
    <text x="470" y="166" text-anchor="middle" stroke="none" fill="#666" font-size="12">holds each joint at that speed, 1 ms</text>
    <path d="M600 152 L636 152" marker-end="url(#l3b)" />
    <rect x="640" y="120" width="300" height="64" rx="4" />
    <text x="790" y="146" text-anchor="middle" stroke="none" fill="#111" font-weight="bold">post_update</text>
    <text x="790" y="166" text-anchor="middle" stroke="none" fill="#666" font-size="12">wheel angles → odometry, every 20 ms</text>
    <path d="M940 152 L975 152 L975 212 L160 212 L160 188" marker-end="url(#l3b)" />
    <text x="567" y="230" text-anchor="middle" stroke="none" fill="#666" font-size="12">the next step</text>
  </g>
</svg>
</div>
<ul>
<li><strong><code>on_cmd_vel</code></strong> only <strong>remembers</strong> the Twist. It keeps it until the next one — there is no timeout</li>
<li><strong><code>pre_update</code></strong> is the only moment that may <strong>change</strong> the world. <strong><code>post_update</code></strong> only <strong>reads</strong> it</li>
<li>The stock plugin works out the speeds after physics and applies them one step later. Ours applies them at once</li>
</ul>
<p><span class="src"><img class="emoji" draggable="false" alt="📖" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4d6.svg" data-marp-twemoji=""/> <a href="https://gazebosim.org/api/sim/8/python_interfaces.html">gazebosim.org/api/sim/8/python_interfaces.html</a></span></p>
<footer>KAU · Autonomous Robotic Systems Engineering · Lecture 3</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-marpit-scope-DEwX5dQQ="" data-paginate="true" data-footer="KAU · Autonomous Robotic Systems Engineering · Lecture 3" data-theme="kau" lang="en-US" data-marpit-pagination="13" style="--paginate:true;--footer:KAU · Autonomous Robotic Systems Engineering · Lecture 3;--theme:kau;" data-marpit-pagination-total="45">
<h2 id="once-when-the-world-loads">Once, When the World Loads</h2>
<div class="cols" style="grid-template-columns: 1.75fr 1fr; gap: 1.5em">
<div>
<pre><code class="language-python"><span class="hljs-keyword">class</span> <span class="hljs-title class_">SimpleDiffDrive</span>:
    <span class="hljs-keyword">def</span> <span class="hljs-title function_">configure</span>(<span class="hljs-params">self, entity, sdf, ecm, event_mgr</span>):     <span class="hljs-comment"># once, when the world loads</span>
        model = Model(entity)                              <span class="hljs-comment"># the model this &lt;plugin&gt; sits in</span>
        <span class="hljs-comment"># &lt;left_joint&gt; / &lt;right_joint&gt;: a name in our block → a wheel joint we can command</span>
        <span class="hljs-variable language_">self</span>.left = Joint(model.joint_by_name(ecm, sdf.get_string(<span class="hljs-string">&#x27;left_joint&#x27;</span>)))
        <span class="hljs-variable language_">self</span>.right = Joint(model.joint_by_name(ecm, sdf.get_string(<span class="hljs-string">&#x27;right_joint&#x27;</span>)))
        <span class="hljs-variable language_">self</span>.separation = sdf.get_double(<span class="hljs-string">&#x27;wheel_separation&#x27;</span>)   <span class="hljs-comment"># L</span>
        <span class="hljs-variable language_">self</span>.radius = sdf.get_double(<span class="hljs-string">&#x27;wheel_radius&#x27;</span>)            <span class="hljs-comment"># r</span>
        <span class="hljs-variable language_">self</span>.v = <span class="hljs-variable language_">self</span>.w = <span class="hljs-number">0.0</span>                              <span class="hljs-comment"># no command yet: v = ω = 0</span>
        <span class="hljs-variable language_">self</span>.node = Node()                                 <span class="hljs-comment"># Gazebo transport, not ROS</span>
        <span class="hljs-comment"># every Twist on /model/&lt;name&gt;/cmd_vel → on_cmd_vel</span>
        <span class="hljs-variable language_">self</span>.node.subscribe(Twist, <span class="hljs-string">f&#x27;/model/<span class="hljs-subst">{model.name(ecm)}</span>/cmd_vel&#x27;</span>, <span class="hljs-variable language_">self</span>.on_cmd_vel)
</code></pre>
<ul>
<li><code>Joint</code> is the wheel's <strong>hinge</strong> — the joint named in <code>&lt;left_joint&gt;</code>. The plugin sets its speed and reads its angle</li>
</ul>
</div>
<div>
<p>Where these values go:</p>
<p><span class="katex-display"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><msub><mi>v</mi><mi>R</mi></msub><mo>=</mo><mi>v</mi><mo>+</mo><mi>ω</mi><mtext> </mtext><mfrac><mi>L</mi><mn>2</mn></mfrac><mo separator="true">,</mo><mspace width="1em"/><msub><mi>v</mi><mi>L</mi></msub><mo>=</mo><mi>v</mi><mo>−</mo><mi>ω</mi><mtext> </mtext><mfrac><mi>L</mi><mn>2</mn></mfrac></mrow><annotation encoding="application/x-tex">v_R = v + \omega\,\frac{L}{2}, \quad v_L = v - \omega\,\frac{L}{2}

<li><strong>Which joint:</strong> the wheel's hinge — <code>&lt;right_joint&gt;</code> or <code>&lt;left_joint&gt;</code>. Its speed is how fast that wheel spins</li>
<li>When the robot turns, the outer wheel goes <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>ω</mi><mi>L</mi><mi mathvariant="normal">/</mi><mn>2</mn></mrow><annotation encoding="application/x-tex">\omega L/2</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathnormal" style="margin-right:0.0359em;">ω</span><span class="mord mathnormal">L</span><span class="mord">/2</span></span></span></span> faster, the inner one <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>ω</mi><mi>L</mi><mi mathvariant="normal">/</mi><mn>2</mn></mrow><annotation encoding="application/x-tex">\omega L/2</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathnormal" style="margin-right:0.0359em;">ω</span><span class="mord mathnormal">L</span><span class="mord">/2</span></span></span></span> slower</li>
<li>Divide by <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>r</mi></mrow><annotation encoding="application/x-tex">r</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.4306em;"></span><span class="mord mathnormal" style="margin-right:0.0278em;">r</span></span></span></span>: tyre speed in m/s becomes wheel spin in rad/s. The stock DiffDrive computes the same</li>
</ul>
<pre><code class="language-python">    <span class="hljs-keyword">def</span> <span class="hljs-title function_">on_cmd_vel</span>(<span class="hljs-params">self, msg</span>):                          <span class="hljs-comment"># message thread, whenever a Twist arrives</span>
        <span class="hljs-variable language_">self</span>.v, <span class="hljs-variable language_">self</span>.w = msg.linear.x, msg.angular.z    <span class="hljs-comment"># keep v and ω, touch nothing else</span>

    <span class="hljs-keyword">def</span> <span class="hljs-title function_">pre_update</span>(<span class="hljs-params">self, info, ecm</span>):                    <span class="hljs-comment"># every step, BEFORE physics</span>
        <span class="hljs-keyword">if</span> info.paused:                                 <span class="hljs-comment"># paused world: do nothing</span>
            <span class="hljs-keyword">return</span>
        half = <span class="hljs-variable language_">self</span>.w * <span class="hljs-variable language_">self</span>.separation / <span class="hljs-number">2</span>             <span class="hljs-comment"># ω·L/2</span>
        <span class="hljs-comment"># set_velocity writes a JointVelocityCmd; physics then holds the joint</span>
        <span class="hljs-comment"># at exactly that speed for this step, whatever torque it takes</span>
        <span class="hljs-variable language_">self</span>.left.set_velocity(ecm, [(<span class="hljs-variable language_">self</span>.v - half) / <span class="hljs-variable language_">self</span>.radius])    <span class="hljs-comment"># (v − ωL/2) / r</span>
        <span class="hljs-variable language_">self</span>.right.set_velocity(ecm, [(<span class="hljs-variable language_">self</span>.v + half) / <span class="hljs-variable language_">self</span>.radius])   <span class="hljs-comment"># (v + ωL/2) / r</span>
</code></pre>

<h2 id="the-limiter--how-it-works">The Limiter — How It Works</h2>
<div class="lg">
<div>
<p>A filter between the <code>Twist</code> and the wheels: the speed may change only so fast, and never past a maximum. A real robot cannot reach full speed in 1 ms — it would slip or tip</p>
<p><span class="katex-display"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><msub><mi>a</mi><mrow><mi>m</mi><mi>i</mi><mi>n</mi></mrow></msub><mtext>  </mtext><mo>≤</mo><mtext>  </mtext><mfrac><mrow><mi>v</mi><mo>−</mo><msub><mi>v</mi><mrow><mi>p</mi><mi>r</mi><mi>e</mi><mi>v</mi></mrow></msub></mrow><mrow><mi mathvariant="normal">Δ</mi><mi>t</mi></mrow></mfrac><mtext>  </mtext><mo>≤</mo><mtext>  </mtext><msub><mi>a</mi><mrow><mi>m</mi><mi>a</mi><mi>x</mi></mrow></msub><mo separator="true">,</mo><mspace width="2em"/><mspace width="2em"/><msub><mi>v</mi><mrow><mi>m</mi><mi>i</mi><mi>n</mi></mrow></msub><mtext>  </mtext><mo>≤</mo><mtext>  </mtext><mi>v</mi><mtext>  </mtext><mo>≤</mo><mtext>  </mtext><msub><mi>v</mi><mrow><mi>m</mi><mi>a</mi><mi>x</mi></mrow></msub></mrow><annotation encoding="application/x-tex">a_{min} \;\le\; \frac{v - v_{prev}}{\Delta t} \;\le\; a_{max}, \qquad\qquad v_{min} \;\le\; v \;\le\; v_{max}
</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.786em;vertical-align:-0.15em;"></span><span class="mord"><span class="mord mathnormal">a</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3117em;"><span style="top:-2.55em;margin-left:0em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mathnormal mtight">min</span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">≤</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:1.9463em;vertical-align:-0.686em;"></span><span class="mord"><span class="mopen nulldelimiter"></span><span class="mfrac"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:1.2603em;"><span style="top:-2.314em;"><span class="pstrut" style="height:3em;"></span><span class="mord"><span class="mord">Δ</span><span class="mord mathnormal">t</span></span></span><span style="top:-3.23em;"><span class="pstrut" style="height:3em;"></span><span class="frac-line" style="border-bottom-width:0.04em;"></span></span><span style="top:-3.677em;"><span class="pstrut" style="height:3em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0359em;">v</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">−</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0359em;">v</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.1514em;"><span style="top:-2.55em;margin-left:-0.0359em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mathnormal mtight">p</span><span class="mord mathnormal mtight" style="margin-right:0.0278em;">r</span><span class="mord mathnormal mtight">e</span><span class="mord mathnormal mtight" style="margin-right:0.0359em;">v</span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.2861em;"><span></span></span></span></span></span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.686em;"><span></span></span></span></span></span><span class="mclose nulldelimiter"></span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">≤</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.8304em;vertical-align:-0.1944em;"></span><span class="mord"><span class="mord mathnormal">a</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.1514em;"><span style="top:-2.55em;margin-left:0em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mathnormal mtight">ma</span><span class="mord mathnormal mtight">x</span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mpunct">,</span><span class="mspace" style="margin-right:2em;"></span><span class="mspace" style="margin-right:2em;"></span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0359em;">v</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3117em;"><span style="top:-2.55em;margin-left:-0.0359em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mathnormal mtight">min</span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">≤</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.7719em;vertical-align:-0.136em;"></span><span class="mord mathnormal" style="margin-right:0.0359em;">v</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">≤</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.5806em;vertical-align:-0.15em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0359em;">v</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.1514em;"><span style="top:-2.55em;margin-left:-0.0359em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class=" <ul>
<li><strong>Yes, step by step:</strong> each 1 ms step the speed grows by at most <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>a</mi><mrow><mi>m</mi><mi>a</mi><mi>x</mi></mrow></msub><mtext> </mtext><mi mathvariant="normal">Δ</mi><mi>t</mi></mrow><annotation encoding="application/x-tex">a_{max}\,\Delta t</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.8333em;vertical-align:-0.15em;"></span><span class="mord"><span class="mord mathnormal">a</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.1514em;"><span style="top:-2.55em;margin-left:0em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mathnormal mtight">ma</span><span class="mord mathnormal mtight">x</span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord">Δ</span><span class="mord mathnormal">t</span></span></span></span> = 1 mm/s — 0 to 0.5 m/s takes 500 steps. Asked 0.8, it gets 0.5. Red dots: measured on the Pioneer, every 0.1 s</li>
</ul>

<p><strong>Legend</strong><br />
<span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>v</mi></mrow><annotation encoding="application/x-tex">v</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.4306em;"></span><span class="mord mathnormal" style="margin-right:0.0359em;">v</span></span></span></span> — the speed sent to the wheels this step<br />
<span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>v</mi><mrow><mi>p</mi><mi>r</mi><mi>e</mi><mi>v</mi></mrow></msub></mrow><annotation encoding="application/x-tex">v_{prev}</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.7167em;vertical-align:-0.2861em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0359em;">v</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.1514em;"><span style="top:-2.55em;margin-left:-0.0359em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mathnormal mtight">p</span><span class="mord mathnormal mtight" style="margin-right:0.0278em;">r</span><span class="mord mathnormal mtight">e</span><span class="mord mathnormal mtight" style="margin-right:0.0359em;">v</span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.2861em;"><span></span></span></span></span></span></span></span></span></span> — the speed of the step before<br />
<span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi mathvariant="normal">Δ</mi><mi>t</mi></mrow><annotation encoding="application/x-tex">\Delta t</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mord">Δ</span><span class="mord mathnormal">t</span></span></span></span> — one step, 1 ms<br />
<span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>a</mi><mrow><mi>m</mi><mi>i</mi><mi>n</mi></mrow></msub><mo separator="true">,</mo><msub><mi>a</mi><mrow><mi>m</mi><mi>a</mi><mi>x</mi></mrow></msub></mrow><annotation encoding="application/x-tex">a_{min}, a_{max}</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.625em;vertical-align:-0.1944em;"></span><span class="mord"><span class="mord mathnormal">a</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3117em;"><span style="top:-2.55em;margin-left:0em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mathnormal mtight">min</span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mpunct">,</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord"><span class="mord mathnormal">a</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.1514em;"><span style="top:-2.55em;margin-left:0em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mathnormal mtight">ma</span><span class="mord mathnormal mtight">x</span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span></span></span></span> — slowest and fastest change, m/s² (here −1, 1)<br />
<span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>v</mi><mrow><mi>m</mi><mi>i</mi><mi>n</mi></mrow></msub><mo separator="true">,</mo><msub><mi>v</mi><mrow><mi>m</mi><mi>a</mi><mi>x</mi></mrow></msub></mrow><annotation encoding="application/x-tex">v_{min}, v_{max}</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.625em;vertical-align:-0.1944em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0359em;">v</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3117em;"><span style="top:-2.55em;margin-left:-0.0359em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mathnormal mtight">min</span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mpunct">,</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0359em;">v</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.1514em;"><span style="top:-2.55em;margin-left:-0.0359em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mathnormal mtight">ma</span><span class="mord mathnormal mtight">x</span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span></span></span></span> — lowest and highest speed, m/s (here −0.5, 0.5)<br />
The same for <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>ω</mi></mrow><annotation encoding="application/x-tex">\omega</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.4306em;"></span><span class="mord mathnormal" style="margin-right:0.0359em;">ω</span></span></span></span>, with its own bounds</p>
</div>
</div>
<p><span class="src"><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3af.svg" data-marp-twemoji=""/> <a href="https://github.com/gazebosim/gz-math/blob/gz-math7/src/SpeedLimiter.cc">github.com/gazebosim/gz-math/blob/gz-math7/src/SpeedLimiter.cc</a></span></p>
<footer>KAU · Autonomous Robotic Systems Engineering · Lecture 3</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-footer="KAU · Autonomous Robotic Systems Engineering · Lecture 3" data-theme="kau" lang="en-US" data-marpit-pagination="16" style="--paginate:true;--footer:KAU · Autonomous Robotic Systems Engineering · Lecture 3;--theme:kau;" data-marpit-pagination-total="45">
<h2 id="the-limiter--how-it-is-set">The Limiter — How It Is Set</h2>
<pre><code class="language-xml"><span class="hljs-tag">&lt;<span class="hljs-name">plugin</span> <span class="hljs-attr">filename</span>=<span class="hljs-string">&quot;gz-sim-diff-drive-system&quot;</span> <span class="hljs-attr">name</span>=<span class="hljs-string">&quot;gz::sim::systems::DiffDrive&quot;</span>&gt;</span>   <span class="hljs-comment">&lt;!-- the same block --&gt;</span>
  …                                                        <span class="hljs-comment">&lt;!-- joints, L, r as before --&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">max_linear_velocity</span>&gt;</span>0.5<span class="hljs-tag">&lt;/<span class="hljs-name">max_linear_velocity</span>&gt;</span>           <span class="hljs-comment">&lt;!-- v_max, m/s --&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">min_linear_velocity</span>&gt;</span>-0.5<span class="hljs-tag">&lt;/<span class="hljs-name">min_linear_velocity</span>&gt;</span>          <span class="hljs-comment">&lt;!-- v_min: reversing --&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">max_linear_acceleration</span>&gt;</span>1<span class="hljs-tag">&lt;/<span class="hljs-name">max_linear_acceleration</span>&gt;</span>     <span class="hljs-comment">&lt;!-- a_max, m/s² --&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">min_linear_acceleration</span>&gt;</span>-1<span class="hljs-tag">&lt;/<span class="hljs-name">min_linear_acceleration</span>&gt;</span>    <span class="hljs-comment">&lt;!-- a_min: braking --&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">max_angular_velocity</span>&gt;</span>1<span class="hljs-tag">&lt;/<span class="hljs-name">max_angular_velocity</span>&gt;</span>           <span class="hljs-comment">&lt;!-- the same for ω, rad/s… --&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">min_angular_velocity</span>&gt;</span>-1<span class="hljs-tag">&lt;/<span class="hljs-name">min_angular_velocity</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">max_angular_acceleration</span>&gt;</span>2<span class="hljs-tag">&lt;/<span class="hljs-name">max_angular_acceleration</span>&gt;</span>   <span class="hljs-comment">&lt;!-- …and rad/s² --&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">min_angular_acceleration</span>&gt;</span>-2<span class="hljs-tag">&lt;/<span class="hljs-name">min_angular_acceleration</span>&gt;</span>
<span class="hljs-tag">&lt;/<span class="hljs-name">plugin</span>&gt;</span>
</code></pre>
<ul>
<li>Tags in the same <code>&lt;plugin&gt;</code> block. The values are from Gazebo's own example</li>
<li><strong>No tag, no limit:</strong> every <code>min_</code> is <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mo>−</mo><mi mathvariant="normal">∞</mi></mrow><annotation encoding="application/x-tex">-\infty</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6667em;vertical-align:-0.0833em;"></span><span class="mord">−</span><span class="mord">∞</span></span></span></span> and every <code>max_</code> is <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mo>+</mo><mi mathvariant="normal">∞</mi></mrow><annotation encoding="application/x-tex">+\infty</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6667em;vertical-align:-0.0833em;"></span><span class="mord">+</span><span class="mord">∞</span></span></span></span> until you set it. The robot can then reach any speed in one step</li>
<li>Each bound is separate: <code>max_</code> alone leaves reversing unlimited. Set <code>min_</code> too</li>
</ul>
<p><span class="src"><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3af.svg" data-marp-twemoji=""/> <a href="https://github.com/gazebosim/gz-sim/blob/gz-sim8/examples/worlds/diff_drive_skid.sdf">github.com/gazebosim/gz-sim/blob/gz-sim8/examples/worlds/diff_drive_skid.sdf</a> · <img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3af.svg" data-marp-twemoji=""/> <a href="https://github.com/gazebosim/gz-sim/blob/gz-sim8/src/systems/diff_drive/DiffDrive.hh">github.com/gazebosim/gz-sim/blob/gz-sim8/src/systems/diff_drive/DiffDrive.hh</a></span></p>
<footer>KAU · Autonomous Robotic Systems Engineering · Lecture 3</footer>
</section>

<h1 id="straight-spin-arc-circle">Straight, Spin, Arc, Circle</h1>
<p><em>What each wheel does</em></p>
<footer>KAU · Autonomous Robotic Systems Engineering · Lecture 3</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-footer="KAU · Autonomous Robotic Systems Engineering · Lecture 3" data-theme="kau" lang="en-US" data-marpit-pagination="18" style="--paginate:true;--footer:KAU · Autonomous Robotic Systems Engineering · Lecture 3;--theme:kau;" data-marpit-pagination-total="45">
<h2 id="four-commands-two-wheels">Four Commands, Two Wheels</h2>
<div style="text-align:center">
<svg width="1100" height="290" viewBox="0 0 1100 290" style="max-width:100%">
  <defs><marker id="l3c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1 L9 5 L0 9 z" fill="#111" /></marker></defs>
  <g font-family="DM Sans, sans-serif" fill="#111">
    <path d="M275 20 L275 280 M550 20 L550 280 M825 20 L825 280" stroke="#e0e0de" stroke-width="1" />
    <g>
      <text x="137" y="36" text-anchor="middle" font-size="15" font-weight="bold">v = 0, ω = 0</text>
      <rect x="102" y="125" width="70" height="90" fill="#f5f5f5" stroke="#111" stroke-width="1.5" />
      <rect x="85" y="147" width="14" height="46" rx="3" fill="#fff" stroke="#111" stroke-width="2" />
      <rect x="175" y="147" width="14" height="46" rx="3" fill="#fff" stroke="#111" stroke-width="2" />
      <text x="137" y="246" text-anchor="middle" font-size="13" fill="#666">left 0 · right 0 rad/s</text>
      <text x="137" y="272" text-anchor="middle" font-size="15" font-weight="bold">stands</text>
    </g>
    <g transform="translate(275,0)">
      <text x="137" y="36" text-anchor="middle" font-size="15" font-weight="bold">v = 0.5, ω = 0</text>
      <rect x="102" y="125" width="70" height="90" fill="#f5f5f5" stroke="#111" stroke-width="1.5" />
      <rect x="85" y="147" width="14" height="46" rx="3" fill="#fff" stroke="#111" stroke-width="2" />
      <rect x="175" y="147" width="14" height="46" rx="3" fill="#fff" stroke="#111" stroke-width="2" />
      <path d="M92 170 L92 92" stroke="#111" stroke-width="3" marker-end="url(#l3c)" />
      <path d="M182 170 L182 92" stroke="#111" stroke-width="3" marker-end="url(#l3c)" />
      <text x="137" y="246" text-anchor="middle" font-size="13" fill="#666">left 5.0 · right 5.0 rad/s</text>
      <text x="137" y="272" text-anchor="middle" font-size="15" font-weight="bold">straight</text>
    </g>
    <g transform="translate(550,0)">
      <text x="137" y="36" text-anchor="middle" font-size="15" font-weight="bold">v = 0, ω = 1</text>
      <rect x="102" y="125" width="70" height="90" fill="#f5f5f5" stroke="#111" stroke-width="1.5" />
      <rect x="85" y="147" width="14" height="46" rx="3" fill="#fff" stroke="#111" stroke-width="2" />
      <rect x="175" y="147" width="14" height="46" rx="3" fill="#fff" stroke="#111" stroke-width="2" />
      <path d="M92 170 L92 196" stroke="#111" stroke-width="3" marker-end="url(#l3c)" />
      <path d="M182 170 L182 144" stroke="#111" stroke-width="3" marker-end="url(#l3c)" />
      <path d="M117 170 A 20 20 0 1 0 137 150" stroke="#888" stroke-width="2" fill="none" marker-end="url(#l3c)" />
      <circle cx="137" cy="170" r="3" fill="#111" />
      <text x="137" y="246" text-anchor="middle" font-size="13" fill="#666">left −1.75 · right +1.75 rad/s</text>
      <text x="137" y="272" text-anchor="middle" font-size="15" font-weight="bold">spins on the spot</text>
    </g>
    <g transform="translate(825,0)">
      <text x="137" y="36" text-anchor="middle" font-size="15" font-weight="bold">v = 0.5, ω = 0.5</text>
      <path d="M85 170 L14 170" stroke="#999" stroke-width="1" stroke-dasharray="4 4" marker-end="url(#l3c)" />
      <text x="16" y="162" font-size="11" fill="#666">centre: 1 m</text>
      <rect x="102" y="125" width="70" height="90" fill="#f5f5f5" stroke="#111" stroke-width="1.5" />
      <rect x="85" y="147" width="14" height="46" rx="3" fill="#fff" stroke="#111" stroke-width="2" />
      <rect x="175" y="147" width="14" height="46" rx="3" fill="#fff" stroke="#111" stroke-width="2" />
      <path d="M92 170 L92 106" stroke="#111" stroke-width="3" marker-end="url(#l3c)" />
      <path d="M182 170 L182 78" stroke="#111" stroke-width="3" marker-end="url(#l3c)" />
      <text x="137" y="246" text-anchor="middle" font-size="13" fill="#666">left 4.125 · right 5.875 rad/s</text>
