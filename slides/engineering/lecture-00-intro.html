<footer>KAU · Autonomous Robotic Systems Engineering · Lecture 0</footer>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-paginate="true" data-footer="KAU · Autonomous Robotic Systems Engineering · Lecture 0" data-theme="kau" lang="en-US" data-marpit-pagination="4" style="--paginate:true;--footer:KAU · Autonomous Robotic Systems Engineering · Lecture 0;--theme:kau;" data-marpit-pagination-total="52">
<h2 id="course-content">Course Content</h2>
<table>
<thead>
<tr>
<th>Topic</th>
<th></th>
</tr>
</thead>
<tbody>
<tr>
<td>ROS 2 architecture</td>
<td>nodes, topics, packages, launch</td>
</tr>
<tr>
<td>Modelling and simulation</td>
<td>Gazebo, the robot model, worlds</td>
</tr>
<tr>
<td>Sensors and time</td>
<td>measurement models, noise, synchronisation</td>
</tr>
<tr>
<td>State estimation</td>
<td>Kalman and particle filters, sensor fusion</td>
</tr>
<tr>
<td>Computer vision</td>
<td>features, matching, optical flow, visual odometry</td>
</tr>
<tr>
<td>SLAM</td>
<td>maps, pose graphs, loop closure</td>
</tr>
<tr>
<td>Planning and navigation</td>
<td>costmaps, global and local planning</td>
</tr>
<tr>
<td>Control and autonomy</td>
<td>from a plan to wheel commands — the full pipeline</td>
</tr>
</tbody>
</table>
<p><span class="src"><img class="emoji" draggable="false" alt="📖" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4d6.svg" data-marp-twemoji=""/> <a href="https://docs.ros.org/en/jazzy/Concepts.html">docs.ros.org/en/jazzy/Concepts.html</a></span></p>
<footer>KAU · Autonomous Robotic Systems Engineering · Lecture 0</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-paginate="true" data-footer="KAU · Autonomous Robotic Systems Engineering · Lecture 0" data-theme="kau" lang="en-US" data-marpit-pagination="5" style="--paginate:true;--footer:KAU · Autonomous Robotic Systems Engineering · Lecture 0;--theme:kau;" data-marpit-pagination-total="52">
<h2 id="labs">Labs</h2>
<ul>
<li>Bring-up — environment, a robot that drives, first measurements</li>
<li>SLAM and navigation with off-the-shelf packages</li>
<li><strong>Your own robot model</strong></li>
<li><strong>Your own odometry</strong></li>
<li><strong>Your own optical flow</strong></li>
<li><strong>Your own sensor fusion</strong></li>
<li><strong>Your own planner plugin</strong></li>
<li><strong>Your own stack, end to end</strong></li>
</ul>
<p>Each lab builds on the one before it: what you produce in the first is the input to the second.</p>
<footer>KAU · Autonomous Robotic Systems Engineering · Lecture 0</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-footer="KAU · Autonomous Robotic Systems Engineering · Lecture 0" data-theme="kau" lang="en-US" data-marpit-pagination="6" style="--paginate:true;--footer:KAU · Autonomous Robotic Systems Engineering · Lecture 0;--theme:kau;" data-marpit-pagination-total="52">
<h2 id="how-the-labs-move">How the Labs Move</h2>
<table>
<thead>
<tr>
<th></th>
<th>You use</th>
<th>You write</th>
</tr>
</thead>
<tbody>
<tr>
<td>First</td>
<td>an off-the-shelf robot and packages</td>
<td>the measuring side</td>
</tr>
<tr>
<td>Then</td>
<td>one layer at a time</td>
<td>that layer</td>
</tr>
<tr>
<td>Last</td>
<td>your own stack</td>
<td>all of it</td>
</tr>
</tbody>
</table>
<ul>
<li>The same world, the same robot, the same metric throughout</li>
<li>Every result is comparable with the off-the-shelf package — and with your own previous one</li>
</ul>
<blockquote>
<p><strong>One layer per lab, until the stack is yours.</strong></p>
</blockquote>
<footer>KAU · Autonomous Robotic Systems Engineering · Lecture 0</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-footer="KAU · Autonomous Robotic Systems Engineering · Lecture 0" data-theme="kau" lang="en-US" data-marpit-pagination="7" style="--paginate:true;--footer:KAU · Autonomous Robotic Systems Engineering · Lecture 0;--theme:kau;" data-marpit-pagination-total="52">
<h2 id="requirements">Requirements</h2>
<p><strong>You need</strong> — Python and/or C++ · Linux and the command line · git</p>
<p><strong>I give you</strong></p>
<ul>
<li>a Docker image: ROS 2 Jazzy + Gazebo Harmonic, versions pinned</li>
<li>data with ground truth, and reference numbers to check your own against</li>
<li>a starting point for every lab</li>
</ul>
<p>Week 1: an entry survey. What you already know decides how much arrives ready-made.</p>
<p><span class="src"><img class="emoji" draggable="false" alt="📖" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4d6.svg" data-marp-twemoji=""/> <a href="https://docs.ros.org/en/jazzy/Installation.html">docs.ros.org/en/jazzy/Installation.html</a></span></p>
<footer>KAU · Autonomous Robotic Systems Engineering · Lecture 0</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-footer="KAU · Autonomous Robotic Systems Engineering · Lecture 0" data-theme="kau" lang="en-US" data-marpit-pagination="8" style="--paginate:true;--footer:KAU · Autonomous Robotic Systems Engineering · Lecture 0;--theme:kau;" data-marpit-pagination-total="52">
<h2 id="what-each-lab-ships">What Each Lab Ships</h2>
<p>A <strong>good README</strong> is the deliverable. It contains:</p>
<ul>
<li><strong>Run</strong> — the exact commands, from zero, on someone else's machine</li>
<li><strong>See</strong> — screenshot, recording, plot</li>
<li><strong>Numbers</strong> — the metric of that lab</li>
<li><strong>Compare</strong> — your result against the off-the-shelf package doing the same job</li>
</ul>
<p>Plus <strong><code>notes.txt</code></strong> — what failed, which ideas you had, what stayed unclear. Your own writing, and it cannot lower your mark.</p>
<blockquote>
<p>In a year this repository is read by an employer, not by me.</p>
</blockquote>
<footer>KAU · Autonomous Robotic Systems Engineering · Lecture 0</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-footer="KAU · Autonomous Robotic Systems Engineering · Lecture 0" data-theme="kau" lang="en-US" data-marpit-pagination="9" style="--paginate:true;--footer:KAU · Autonomous Robotic Systems Engineering · Lecture 0;--theme:kau;" data-marpit-pagination-total="52">
<h2 id="generative-ai">Generative AI</h2>
<ul>
<li><strong>Allowed, for understanding</strong> — explain someone's code, unpick an error, find the documentation</li>
<li><strong>Self-restraint on the labs</strong> — generated code gives a result without the understanding</li>
<li>No black boxes in your own stack</li>
<li>Checking is built into the course, not into a detector: the interview, the numbers, your own code</li>
</ul>
<blockquote>
<p><strong>A simple implementation you can explain beats a complex one you cannot.</strong></p>
</blockquote>
<footer>KAU · Autonomous Robotic Systems Engineering · Lecture 0</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-footer="KAU · Autonomous Robotic Systems Engineering · Lecture 0" data-theme="kau" lang="en-US" data-marpit-pagination="10" style="--paginate:true;--footer:KAU · Autonomous Robotic Systems Engineering · Lecture 0;--theme:kau;" data-marpit-pagination-total="52">
<h2 id="grading">Grading</h2>
<table>
<thead>
<tr>
<th>Component</th>
<th>Weight</th>
</tr>
</thead>
<tbody>
<tr>
<td>Labs</td>
<td>50</td>
</tr>
<tr>
<td>Talk</td>
<td>20</td>
</tr>
<tr>
<td>Exam</td>
<td>20</td>
</tr>
<tr>
<td>Open-source contribution</td>
<td>10</td>
</tr>
</tbody>
</table>
<p>Three of the four stay with you after the course: the repositories, the talk, the PR.</p>
<footer>KAU · Autonomous Robotic Systems Engineering · Lecture 0</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-footer="KAU · Autonomous Robotic Systems Engineering · Lecture 0" data-theme="kau" lang="en-US" data-marpit-pagination="11" style="--paginate:true;--footer:KAU · Autonomous Robotic Systems Engineering · Lecture 0;--theme:kau;" data-marpit-pagination-total="52">
<h2 id="talk--15%E2%80%9320-min">Talk — 15–20 min</h2>
<p><strong>Your topic, agreed with me.</strong> What works:</p>
<ul>
<li>a gap in this course — something we skipped or rushed</li>
<li>differences between ROS 2 releases: Humble → Jazzy → what comes next</li>
<li>a package worth reading — what is inside, where its limits are</li>
<li>an algorithm against its implementation: what the authors simplified</li>
<li>a robot or platform — its architecture, not its marketing</li>
</ul>
<p>The same weight as the exam — prepare it like one. The gaps you wrote into <code>notes.txt</code> are your best source of a topic.</p>
<p><span class="src"><img class="emoji" draggable="false" alt="📖" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4d6.svg" data-marp-twemoji=""/> <a href="https://roscon.ros.org/">roscon.ros.org</a> · <a href="https://docs.ros.org/en/rolling/Releases.html">docs.ros.org/en/rolling/Releases.html</a></span></p>
<footer>KAU · Autonomous Robotic Systems Engineering · Lecture 0</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-footer="KAU · Autonomous Robotic Systems Engineering · Lecture 0" data-theme="kau" lang="en-US" data-marpit-pagination="12" style="--paginate:true;--footer:KAU · Autonomous Robotic Systems Engineering · Lecture 0;--theme:kau;" data-marpit-pagination-total="52">
<h2 id="open-source--exam">Open Source · Exam</h2>
<p><strong>Open source — one real project, one real issue.</strong></p>
<ul>
<li>pick a project you actually use; find an issue you understand</li>
<li>propose your ideas <strong>in the issue, in public</strong>; say why this project and this issue</li>
<li>pick a repo next to your own stack — Nav2, <code>slam_toolbox</code>, <code>robot_localization</code>, <code>gz-sim</code>; filter <code>good first issue</code></li>
<li>the merge is <strong>not</strong> graded — the analysis, the change and the tests are</li>
<li>why it is here: you get inside a real codebase, and it is a fast way to learn</li>
</ul>
<p><strong>Exam — 15–20 min.</strong> Your results and numbers · your decisions and where they stop working · what goes on your CV.</p>
<p><span class="src"><img class="emoji" draggable="false" alt="📖" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4d6.svg" data-marp-twemoji=""/> <a href="https://opensource.guide/how-to-contribute/">opensource.guide/how-to-contribute</a></span></p>
<footer>KAU · Autonomous Robotic Systems Engineering · Lecture 0</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-footer="KAU · Autonomous Robotic Systems Engineering · Lecture 0" data-theme="kau" lang="en-US" data-marpit-pagination="13" style="--paginate:true;--footer:KAU · Autonomous Robotic Systems Engineering · Lecture 0;--theme:kau;" data-marpit-pagination-total="52">
<h2 id="deadlines">Deadlines</h2>
<ul>
<li>Every lab has a deadline, fixed in writing in the first week</li>
<li>After it, the mark is lower</li>
<li><strong>The reference solution is published before the deadline</strong> — check yourself against it; what you hand in is still your own work</li>
<li>A lab that never lands blocks the next one — the labs feed each other</li>
</ul>
<footer>KAU · Autonomous Robotic Systems Engineering · Lecture 0</footer>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-footer="KAU · Autonomous Robotic Systems Engineering · Lecture 0" data-class="section" data-theme="kau" lang="en-US" class="section" data-marpit-pagination="14" style="--paginate:true;--footer:KAU · Autonomous Robotic Systems Engineering · Lecture 0;--class:section;--theme:kau;" data-marpit-pagination-total="52">
<h1 id="part-2--ros-2">Part 2 · ROS 2</h1>
<p><em>The middleware you will live in</em></p>
<p><span class="src"><img class="emoji" draggable="false" alt="📖" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4d6.svg" data-marp-twemoji=""/> <a href="https://docs.ros.org/en/jazzy/Concepts/Basic.html">docs.ros.org/en/jazzy/Concepts/Basic.html</a></span></p>
<footer>KAU · Autonomous Robotic Systems Engineering · Lecture 0</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-footer="KAU · Autonomous Robotic Systems Engineering · Lecture 0" data-theme="kau" lang="en-US" data-marpit-pagination="15" style="--paginate:true;--footer:KAU · Autonomous Robotic Systems Engineering · Lecture 0;--theme:kau;" data-marpit-pagination-total="52">
<h2 id="what-ros-is">What ROS Is</h2>
<ul>
<li><strong>Middleware</strong> — how separate programs exchange data</li>
<li><strong>Build system</strong> — <code>colcon</code> · <code>ament</code> · <code>rosdep</code></li>
<li><strong>Tooling</strong> — <code>ros2</code> CLI, RViz, rqt, rosbag</li>
<li><strong>Ecosystem</strong> — Nav2, <code>slam_toolbox</code>, drivers, simulators</li>
</ul>
<blockquote>
<p><strong>The valuable part is not the middleware — it is the shared interfaces.</strong><br />
Any lidar publishes the same message, so someone else's SLAM runs on your robot.</p>
</blockquote>
<p><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a0.svg" data-marp-twemoji=""/> <code>roscore</code> · <code>rosrun</code> · <code>catkin</code> in a tutorial → that is ROS 1, EOL since May 2025.</p>
<ul>
<li>One release for all of us: Jazzy Jalisco on Ubuntu 24.04, pinned in the container</li>
</ul>
<p><span class="src"><img class="emoji" draggable="false" alt="📖" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4d6.svg" data-marp-twemoji=""/> <a href="https://docs.ros.org/en/jazzy/Concepts/Basic.html">docs.ros.org/en/jazzy/Concepts/Basic.html</a> · <a href="https://design.ros2.org/articles/changes.html">design.ros2.org/articles/changes.html</a></span></p>
<footer>KAU · Autonomous Robotic Systems Engineering · Lecture 0</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-footer="KAU · Autonomous Robotic Systems Engineering · Lecture 0" data-theme="kau" lang="en-US" data-marpit-pagination="16" style="--paginate:true;--footer:KAU · Autonomous Robotic Systems Engineering · Lecture 0;--theme:kau;" data-marpit-pagination-total="52">
<h2 id="why-not-one-big-program">Why Not One Big Program</h2>
<table>
<thead>
<tr>
<th>One program</th>
<th>A graph of nodes</th>
</tr>
</thead>
<tbody>
<tr>
<td>the caller names the callee: <code>slam.update(scan)</code></td>
<td>the driver names a topic: <code>/scan</code></td>
</tr>
<tr>
<td>one language, one rate, one machine</td>
<td>Python and C++, 40 Hz and 2 Hz, laptop and robot</td>
</tr>
<tr>
<td>replace a part → recompile the whole thing</td>
<td>replace a part → start a different node</td>
</tr>
<tr>
<td>you get a return value</td>
<td>you get no answer at all</td>
</tr>
</tbody>
</table>
<ul>
<li>So <code>/scan</code> can come from the lidar, from the simulator or from a recording, and the reader never notices</li>
<li>The price: no reply, no acknowledgement, and a copy of every message</li>
</ul>
<blockquote>
<p><strong>You give up the function call, and buy a system whose parts can be swapped while it runs.</strong></p>
</blockquote>
<p><span class="src"><img class="emoji" draggable="false" alt="📖" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4d6.svg" data-marp-twemoji=""/> <a href="https://www.ros.org/is-ros-for-me/">www.ros.org/is-ros-for-me</a></span></p>
<footer>KAU · Autonomous Robotic Systems Engineering · Lecture 0</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-footer="KAU · Autonomous Robotic Systems Engineering · Lecture 0" data-theme="kau" lang="en-US" data-marpit-pagination="17" style="--paginate:true;--footer:KAU · Autonomous Robotic Systems Engineering · Lecture 0;--theme:kau;" data-marpit-pagination-total="52">
<h2 id="nodes">Nodes</h2>
<ul>
<li>A process that does one job — lidar driver, odometry, planner</li>
<li>Has a name in the graph; a namespace separates two copies: <code>/robot1/odometry</code></li>
<li>A node knows topic names, not other nodes — kill one and the rest survives</li>
<li>Two nodes may carry the same name — <code>ros2 node list</code> warns, nothing crashes; the cure is a namespace</li>
</ul>
<pre><code class="language-bash">$ ros2 run demo_nodes_cpp talker
$ ros2 node list
/talker
/listener
</code></pre>
<p><span class="src"><img class="emoji" draggable="false" alt="📖" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4d6.svg" data-marp-twemoji=""/> <a href="https://docs.ros.org/en/jazzy/Concepts/Basic/About-Nodes.html">docs.ros.org/en/jazzy/Concepts/Basic/About-Nodes.html</a></span></p>
<footer>KAU · Autonomous Robotic Systems Engineering · Lecture 0</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-footer="KAU · Autonomous Robotic Systems Engineering · Lecture 0" data-theme="kau" lang="en-US" data-marpit-pagination="18" style="--paginate:true;--footer:KAU · Autonomous Robotic Systems Engineering · Lecture 0;--theme:kau;" data-marpit-pagination-total="52">
<h2 id="dds--what-moves-the-messages">DDS — What Moves the Messages</h2>
<div style="text-align:center">
<svg width="880" height="215" viewBox="0 0 880 215" style="max-width:100%">
  <g fill="none" stroke="#111" stroke-width="1.5" font-family="DM Sans, sans-serif" font-size="14">
    <rect x="40" y="20" width="230" height="46" />
    <text x="155" y="49" text-anchor="middle" stroke="none" fill="#111">/lidar_driver</text>
    <rect x="610" y="20" width="230" height="46" />
    <text x="725" y="49" text-anchor="middle" stroke="none" fill="#111">/slam</text>
    <rect x="368" y="24" width="144" height="38" rx="19" fill="#f5f5f5" />
    <text x="440" y="49" text-anchor="middle" stroke="none" fill="#111" font-size="13">“/scan”</text>
    <text x="320" y="16" text-anchor="middle" stroke="none" fill="#666" font-size="11">publishes to</text>
    <text x="565" y="16" text-anchor="middle" stroke="none" fill="#666" font-size="11">asked for</text>
    <path d="M270 43 L362 43" stroke-dasharray="5 4" />
    <path d="M518 43 L604 43" stroke-dasharray="5 4" />
    <rect x="40" y="120" width="800" height="60" fill="#f5f5f5" />
    <text x="440" y="157" text-anchor="middle" stroke="none" fill="#111">DDS — finds who wants “/scan”, and carries the message there</text>
    <path d="M155 66 L155 116" /><path d="M150 106 L155 118 L160 106" />
    <path d="M725 116 L725 70" /><path d="M720 80 L725 68 L730 80" />
    <text x="118" y="98" text-anchor="end" stroke="none" fill="#666" font-size="11">message</text>
    <text x="762" y="98" stroke="none" fill="#666" font-size="11">message</text>
  </g>
</svg>
</div>
<p><strong>D</strong>ata <strong>D</strong>istribution <strong>S</strong>ervice — a standard for sending typed messages between programs.</p>
<ul>
<li>A topic is a <strong>name</strong>. Something still has to carry the bytes to whoever wants them — that is DDS</li>
<li>You say “publish <code>/scan</code>”; DDS delivers it to every node that asked for <code>/scan</code></li>
<li>That is why a topic needs no address: you name the <strong>data</strong>, not a destination</li>
<li>The same on one machine and across a network — ROS 2 reuses this standard instead of writing its own</li>
</ul>
<p><span class="src"><img class="emoji" draggable="false" alt="📖" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4d6.svg" data-marp-twemoji=""/> <a href="https://design.ros2.org/articles/ros_on_dds.html">design.ros2.org/articles/ros_on_dds.html</a></span></p>
<footer>KAU · Autonomous Robotic Systems Engineering · Lecture 0</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-footer="KAU · Autonomous Robotic Systems Engineering · Lecture 0" data-theme="kau" lang="en-US" data-marpit-pagination="19" style="--paginate:true;--footer:KAU · Autonomous Robotic Systems Engineering · Lecture 0;--theme:kau;" data-marpit-pagination-total="52">
<h2 id="topics">Topics</h2>
<p><strong>90 % of the semester.</strong> A named, typed channel — nobody addresses anybody.</p>
<div style="text-align:center">
<svg width="900" height="215" viewBox="0 0 900 215" style="max-width:100%">
  <g fill="none" stroke="#111" stroke-width="1.5" font-family="DM Sans, sans-serif" font-size="14">
    <rect x="120" y="8" width="180" height="38" />
    <text x="210" y="32" text-anchor="middle" stroke="none" fill="#111">/teleop</text>
    <rect x="560" y="8" width="220" height="38" stroke-dasharray="5 4" />
    <text x="670" y="32" text-anchor="middle" stroke="none" fill="#111">ros2 topic pub</text>
    <path d="M210 46 L210 88 M205 80 L210 90 L215 80" />
    <path d="M670 46 L670 88" stroke-dasharray="5 4" /><path d="M665 80 L670 90 L675 80" />
    <rect x="60" y="90" width="780" height="36" fill="#f5f5f5" />
    <text x="450" y="114" text-anchor="middle" stroke="none" fill="#111" font-size="15">/cmd_vel · geometry_msgs/msg/Twist</text>
    <path d="M170 126 L170 168 M165 158 L170 170 L175 158" />
    <path d="M450 126 L450 168 M445 158 L450 170 L455 158" />
    <path d="M730 126 L730 168" stroke-dasharray="5 4" /><path d="M725 158 L730 170 L735 158" />
    <rect x="80" y="170" width="180" height="38" />
    <text x="170" y="194" text-anchor="middle" stroke="none" fill="#111">/motor_driver</text>
    <rect x="345" y="170" width="210" height="38" />
    <text x="450" y="194" text-anchor="middle" stroke="none" fill="#111">ros2 bag record</text>
    <rect x="625" y="170" width="210" height="38" stroke-dasharray="5 4" />
    <text x="730" y="194" text-anchor="middle" stroke="none" fill="#111">ros2 topic echo</text>
  </g>
</svg>
</div>
<p>No arrow goes box to box — everything goes through the name.</p>
<ul>
<li><code>publish()</code> does not block and returns nothing: no acknowledgement, and no error when nobody listens</li>
<li>A finite queue sits between <code>publish()</code> and the callback — fall behind and messages are dropped silently</li>
</ul>
<p><span class="src"><img class="emoji" draggable="false" alt="📖" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4d6.svg" data-marp-twemoji=""/> <a href="https://docs.ros.org/en/jazzy/Concepts/Basic/About-Topics.html">docs.ros.org/en/jazzy/Concepts/Basic/About-Topics.html</a></span></p>
<footer>KAU · Autonomous Robotic Systems Engineering · Lecture 0</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-footer="KAU · Autonomous Robotic Systems Engineering · Lecture 0" data-class="question" data-theme="kau" lang="en-US" class="question" data-marpit-pagination="20" style="--paginate:true;--footer:KAU · Autonomous Robotic Systems Engineering · Lecture 0;--class:question;--theme:kau;" data-marpit-pagination-total="52">
<h2 id="why-does-ros-2-need-a-middleware--why-not-let-every-node-open-a-socket-to-the-node-it-needs">Why does ROS 2 need a middleware — why not let every node open a socket to the node it needs?</h2>
<p><span class="src"><img class="emoji" draggable="false" alt="📖" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4d6.svg" data-marp-twemoji=""/> <a href="https://design.ros2.org/articles/ros_on_dds.html">design.ros2.org/articles/ros_on_dds.html</a></span></p>
<footer>KAU · Autonomous Robotic Systems Engineering · Lecture 0</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-paginate="true" data-footer="KAU · Autonomous Robotic Systems Engineering · Lecture 0" data-theme="kau" lang="en-US" data-marpit-pagination="21" style="--paginate:true;--footer:KAU · Autonomous Robotic Systems Engineering · Lecture 0;--theme:kau;" data-marpit-pagination-total="52">
<h2 id="answer">Answer</h2>
<ul>
<li><strong>Nobody would know the address.</strong> Nodes come and go; a socket needs a host and a port before it can connect</li>
<li><strong>It is not one-to-one.</strong> A scan goes to the mapper, the logger and the viewer at once — sockets would mean N connections to maintain</li>
<li><strong>Someone has to agree on the bytes.</strong> The middleware carries typed messages, so both sides read the same fields</li>
<li>What you would end up writing, if you did it yourself, is a worse DDS</li>
</ul>
<p><span class="src"><img class="emoji" draggable="false" alt="📖" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4d6.svg" data-marp-twemoji=""/> <a href="https://design.ros2.org/articles/ros_on_dds.html">design.ros2.org/articles/ros_on_dds.html</a></span></p>
<footer>KAU · Autonomous Robotic Systems Engineering · Lecture 0</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-paginate="true" data-footer="KAU · Autonomous Robotic Systems Engineering · Lecture 0" data-theme="kau" lang="en-US" data-marpit-pagination="22" style="--paginate:true;--footer:KAU · Autonomous Robotic Systems Engineering · Lecture 0;--theme:kau;" data-marpit-pagination-total="52">
<h2 id="the-graph">The Graph</h2>
<div style="text-align:center">
<svg width="920" height="200" viewBox="0 0 920 200" style="max-width:100%">
  <g fill="none" stroke="#111" stroke-width="1.5" font-family="DM Sans, sans-serif" font-size="13">
    <rect x="10" y="60" width="150" height="42" />
    <text x="85" y="86" text-anchor="middle" stroke="none" fill="#111">/lidar_driver</text>
    <path d="M160 81 L226 81" /><path d="M218 76 L230 81 L218 86" />
    <rect x="230" y="66" width="86" height="30" rx="15" fill="#f5f5f5" />
    <text x="273" y="86" text-anchor="middle" stroke="none" fill="#111" font-size="12">/scan</text>
    <path d="M316 81 L376 81" /><path d="M368 76 L380 81 L368 86" />
    <rect x="380" y="60" width="110" height="42" />
    <text x="435" y="86" text-anchor="middle" stroke="none" fill="#111">/slam</text>
    <path d="M490 81 L546 81" /><path d="M538 76 L550 81 L538 86" />
    <rect x="550" y="66" width="80" height="30" rx="15" fill="#f5f5f5" />
    <text x="590" y="86" text-anchor="middle" stroke="none" fill="#111" font-size="12">/map</text>
    <path d="M630 81 L676 81" /><path d="M668 76 L680 81 L668 86" />
    <rect x="680" y="60" width="110" height="42" />
    <text x="735" y="86" text-anchor="middle" stroke="none" fill="#111">/planner</text>
    <path d="M790 81 L822 81" /><path d="M814 76 L826 81 L814 86" />
    <rect x="826" y="66" width="86" height="30" rx="15" fill="#f5f5f5" />
    <text x="869" y="86" text-anchor="middle" stroke="none" fill="#111" font-size="12">/cmd_vel</text>
    <path d="M273 96 L273 140 L360 140" stroke-dasharray="5 4" />
    <path d="M352 135 L364 140 L352 145" stroke-dasharray="0" />
    <rect x="364" y="120" width="90" height="38" stroke-dasharray="5 4" />
    <text x="409" y="144" text-anchor="middle" stroke="none" fill="#111" font-size="12">/rviz2</text>
    <text x="10" y="185" xml:space="preserve" stroke="none" fill="#666" font-size="11">▭ node   ⬭ topic   ⋯ another subscriber, added later</text>
  </g>
</svg>
</div>
<ul>
<li>Assembled at runtime — it is not written down in one file</li>
<li><strong>Running half the system is normal.</strong> It simply has less data</li>
<li><code>ros2 node info</code> · <code>rqt_graph</code> show what actually connected</li>
<li>Start <code>rviz2</code> mid-run and it just connects — the publisher never learns about it</li>
<li>Kill a node and only its edges vanish — the rest of the system keeps running</li>
</ul>
<p><span class="src"><img class="emoji" draggable="false" alt="📖" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4d6.svg" data-marp-twemoji=""/> <a href="https://docs.ros.org/en/jazzy/Concepts/Basic/About-Nodes.html">docs.ros.org/en/jazzy/Concepts/Basic/About-Nodes.html</a></span></p>
<footer>KAU · Autonomous Robotic Systems Engineering · Lecture 0</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-paginate="true" data-footer="KAU · Autonomous Robotic Systems Engineering · Lecture 0" data-theme="kau" lang="en-US" data-marpit-pagination="23" style="--paginate:true;--footer:KAU · Autonomous Robotic Systems Engineering · Lecture 0;--theme:kau;" data-marpit-pagination-total="52">
<h2 id="rviz--looking-at-the-data">RViz — Looking at the Data</h2>
<ul>
<li>A 3D viewer for live ROS data: the laser scan, the camera image, the map, the robot's own shape, the path it plans</li>
<li><strong>It is not a simulator.</strong> It draws what is on the topics; it does not compute anything and it does not move the robot</li>
<li>It is an ordinary node — it subscribes like any other, and shows nothing if nobody publishes</li>
<li>This is where you find out whether the data is wrong or your algorithm is: if the scan looks wrong in RViz, stop debugging the algorithm</li>
</ul>
<p><span class="src"><img class="emoji" draggable="false" alt="📖" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4d6.svg" data-marp-twemoji=""/> <a href="https://docs.ros.org/en/jazzy/Tutorials/Intermediate/RViz/RViz-User-Guide/RViz-User-Guide.html">docs.ros.org/en/jazzy/Tutorials/Intermediate/RViz/RViz-User-Guide/RViz-User-Guide.html</a></span></p>
<footer>KAU · Autonomous Robotic Systems Engineering · Lecture 0</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-paginate="true" data-footer="KAU · Autonomous Robotic Systems Engineering · Lecture 0" data-class="question" data-theme="kau" lang="en-US" class="question" data-marpit-pagination="24" style="--paginate:true;--footer:KAU · Autonomous Robotic Systems Engineering · Lecture 0;--class:question;--theme:kau;" data-marpit-pagination-total="52">
<h2 id="you-start-the-subscriber-before-any-publisher-exists-what-happens">You start the subscriber before any publisher exists. What happens?</h2>
<p><span class="src"><img class="emoji" draggable="false" alt="📖" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4d6.svg" data-marp-twemoji=""/> <a href="https://docs.ros.org/en/jazzy/Concepts/Intermediate/About-Discovery.html">docs.ros.org/en/jazzy/Concepts/Intermediate/About-Discovery.html</a></span></p>
<footer>KAU · Autonomous Robotic Systems Engineering · Lecture 0</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-paginate="true" data-footer="KAU · Autonomous Robotic Systems Engineering · Lecture 0" data-theme="kau" lang="en-US" data-marpit-pagination="25" style="--paginate:true;--footer:KAU · Autonomous Robotic Systems Engineering · Lecture 0;--theme:kau;" data-marpit-pagination-total="52">
<h2 id="answer-1">Answer</h2>
<p><strong>It waits — they connect when the publisher appears.</strong></p>
<ul>
<li>Start order does not matter; <code>ros2 launch</code> may bring nodes up in any order</li>
<li><strong>No error if the publisher never appears at all</strong> — the two cases look identical</li>
<li>Which is why you check with <code>ros2 topic info</code> — not by reading the log</li>
</ul>
<p><span class="src"><img class="emoji" draggable="false" alt="📖" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4d6.svg" data-marp-twemoji=""/> <a href="https://docs.ros.org/en/jazzy/Tutorials/Beginner-CLI-Tools/Understanding-ROS2-Topics/Understanding-ROS2-Topics.html">docs.ros.org/en/jazzy/Tutorials/Beginner-CLI-Tools/Understanding-ROS2-Topics/Understanding-ROS2-Topics.html</a></span></p>
<footer>KAU · Autonomous Robotic Systems Engineering · Lecture 0</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-paginate="true" data-footer="KAU · Autonomous Robotic Systems Engineering · Lecture 0" data-theme="kau" lang="en-US" data-marpit-pagination="26" style="--paginate:true;--footer:KAU · Autonomous Robotic Systems Engineering · Lecture 0;--theme:kau;" data-marpit-pagination-total="52">
<h2 id="message-types--sensors">Message Types — Sensors</h2>
<table>
<thead>
<tr>
<th>Source</th>
<th>Type</th>
<th>Topic</th>
</tr>
</thead>
<tbody>
<tr>
<td>2D lidar</td>
<td><code>sensor_msgs/msg/LaserScan</code></td>
<td><code>/scan</code></td>
</tr>
<tr>
<td>3D lidar, depth</td>
<td><code>sensor_msgs/msg/PointCloud2</code></td>
<td><code>/points</code></td>
</tr>
<tr>
<td>Camera</td>
<td><code>sensor_msgs/msg/Image</code> + <code>CameraInfo</code></td>
<td><code>/camera/image_raw</code></td>
</tr>
<tr>
<td>IMU</td>
<td><code>sensor_msgs/msg/Imu</code></td>
<td><code>/imu/data</code></td>
</tr>
<tr>
<td>GNSS</td>
<td><code>sensor_msgs/msg/NavSatFix</code></td>
<td><code>/gps/fix</code></td>
</tr>
<tr>
<td>Wheels, joints</td>
<td><code>sensor_msgs/msg/JointState</code></td>
<td><code>/joint_states</code></td>
</tr>
</tbody>
</table>
<ul>
<li>Every one of these carries a <code>Header</code> — a stamp and a frame; without it nothing can be fused</li>
<li><code>Image</code> alone is useless for geometry: <code>CameraInfo</code> carries the intrinsics</li>
</ul>
<p><span class="src"><img class="emoji" draggable="false" alt="📖" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4d6.svg" data-marp-twemoji=""/> <a href="https://docs.ros.org/en/jazzy/p/sensor_msgs/">docs.ros.org/en/jazzy/p/sensor_msgs</a></span></p>
<footer>KAU · Autonomous Robotic Systems Engineering · Lecture 0</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-paginate="true" data-footer="KAU · Autonomous Robotic Systems Engineering · Lecture 0" data-theme="kau" lang="en-US" data-marpit-pagination="27" style="--paginate:true;--footer:KAU · Autonomous Robotic Systems Engineering · Lecture 0;--theme:kau;" data-marpit-pagination-total="52">
<h2 id="message-types--what-the-stack-computes">Message Types — What the Stack Computes</h2>
<table>
<thead>
<tr>
<th>Meaning</th>
<th>Type</th>
<th>Topic</th>
</tr>
</thead>
<tbody>
<tr>
<td>Where the robot is</td>
<td><code>nav_msgs/msg/Odometry</code></td>
<td><code>/odom</code></td>
</tr>
<tr>
<td>The map it built</td>
<td><code>nav_msgs/msg/OccupancyGrid</code></td>
<td><code>/map</code></td>
</tr>
<tr>
<td>Where to drive</td>
<td><code>geometry_msgs/msg/Twist</code></td>
<td><code>/cmd_vel</code></td>
</tr>
</tbody>
</table>
<p>The topic names are conventions, not rules — but every third-party package expects them.</p>
<ul>
<li>A package you did not write already knows what <code>/odom</code> and <code>/map</code> mean</li>
<li>That is the whole reason someone else's navigation can drive your robot</li>
</ul>
<p><span class="src"><img class="emoji" draggable="false" alt="📖" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4d6.svg" data-marp-twemoji=""/> <a href="https://github.com/ros2/common_interfaces">github.com/ros2/common_interfaces</a></span></p>
<footer>KAU · Autonomous Robotic Systems Engineering · Lecture 0</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-paginate="true" data-footer="KAU · Autonomous Robotic Systems Engineering · Lecture 0" data-theme="kau" lang="en-US" data-marpit-pagination="28" style="--paginate:true;--footer:KAU · Autonomous Robotic Systems Engineering · Lecture 0;--theme:kau;" data-marpit-pagination-total="52">
<h2 id="the-type-is-the-contract">The Type Is the Contract</h2>
<pre><code class="language-bash">$ ros2 interface show sensor_msgs/msg/LaserScan
std_msgs/Header header      <span class="hljs-comment"># when, and in which frame</span>
float32 angle_min           <span class="hljs-comment"># start angle of the scan [rad]</span>
float32 angle_increment     <span class="hljs-comment"># angular distance between measurements [rad]</span>
float32[] ranges            <span class="hljs-comment"># the measurements [m]</span>
</code></pre>
<p><code>/scan</code> can come from Gazebo · a real lidar driver · <code>ros2 bag play</code> · your own test node. <strong>Your code does not change.</strong></p>
<blockquote>
<p>A custom type isolates you: no third-party package can read it. Invent one only when no standard type fits.</p>
</blockquote>
<p><span class="src"><img class="emoji" draggable="false" alt="📖" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4d6.svg" data-marp-twemoji=""/> <a href="https://docs.ros.org/en/jazzy/Concepts/Basic/About-Interfaces.html">docs.ros.org/en/jazzy/Concepts/Basic/About-Interfaces.html</a></span></p>
<footer>KAU · Autonomous Robotic Systems Engineering · Lecture 0</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-paginate="true" data-footer="KAU · Autonomous Robotic Systems Engineering · Lecture 0" data-theme="kau" lang="en-US" data-marpit-pagination="29" style="--paginate:true;--footer:KAU · Autonomous Robotic Systems Engineering · Lecture 0;--theme:kau;" data-marpit-pagination-total="52">
<h2 id="what-the-standard-types-buy">What the Standard Types Buy</h2>
<ul>
<li>Publish <code>sensor_msgs/msg/LaserScan</code> → RViz draws it, <code>ros2 bag</code> records it, <code>slam_toolbox</code> maps with it</li>
<li>Publish <code>nav_msgs/msg/Odometry</code> and subscribe to <code>geometry_msgs/msg/Twist</code> → Nav2 can drive your robot</li>
<li>Add <code>sensor_msgs/msg/Imu</code> → <code>robot_localization</code> fuses it with your odometry</li>
<li>None of those packages know your robot exists. You registered nothing and wrote no adapter</li>
<li>Over 2 000 packages are released for Jazzy — one <code>apt install</code> each</li>
</ul>
<blockquote>
<p><strong>Your robot joins the ecosystem by publishing the right message. That is the entire entry fee.</strong></p>
</blockquote>
<p><span class="src"><img class="emoji" draggable="false" alt="📖" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4d6.svg" data-marp-twemoji=""/> <a href="https://index.ros.org/">index.ros.org</a></span></p>
<footer>KAU · Autonomous Robotic Systems Engineering · Lecture 0</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-paginate="true" data-footer="KAU · Autonomous Robotic Systems Engineering · Lecture 0" data-theme="kau" lang="en-US" data-marpit-pagination="30" style="--paginate:true;--footer:KAU · Autonomous Robotic Systems Engineering · Lecture 0;--theme:kau;" data-marpit-pagination-total="52">
<h2 id="what-you-get-for-free">What You Get for Free</h2>
<table>
<thead>
<tr>
<th>Package</th>
<th>Consumes → produces</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Nav2</strong></td>
<td>a goal pose → <code>/cmd_vel</code>: costmaps, planner, controller, recovery</td>
</tr>
<tr>
<td><strong>slam_toolbox</strong></td>
<td><code>/scan</code> → a map and a pose, with loop closure</td>
</tr>
<tr>
<td><strong>ros2_control</strong></td>
<td>a body twist → wheel commands; encoders → odometry</td>
</tr>
<tr>
<td><strong>robot_localization</strong></td>
<td>wheel odometry + IMU + GNSS → one fused pose</td>
</tr>
<tr>
<td><strong>image_pipeline</strong></td>
<td>a raw camera stream → calibrated, rectified, depth</td>
</tr>
<tr>
<td><strong>MoveIt 2</strong></td>
<td>the same job for arms: inverse kinematics, planning, collision checking</td>
</tr>
</tbody>
</table>
<p>Already installed with it: RViz · Gazebo and the <code>ros_gz</code> bridge · <code>rosbag2</code> · <code>teleop_twist_keyboard</code></p>
<p><span class="src"><img class="emoji" draggable="false" alt="📖" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4d6.svg" data-marp-twemoji=""/> <a href="https://index.ros.org/">index.ros.org</a> · <a href="https://docs.nav2.org/">docs.nav2.org</a></span></p>
<footer>KAU · Autonomous Robotic Systems Engineering · Lecture 0</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-paginate="true" data-footer="KAU · Autonomous Robotic Systems Engineering · Lecture 0" data-theme="kau" lang="en-US" data-marpit-pagination="31" style="--paginate:true;--footer:KAU · Autonomous Robotic Systems Engineering · Lecture 0;--theme:kau;" data-marpit-pagination-total="52">
<h2 id="one-controller-many-robots">One Controller, Many Robots</h2>
<ul>
<li>A <strong>controller</strong> is a plugin, not a node you write: <code>diff_drive_controller</code> turns a body twist into<br />
left and right wheel velocities, and integrates the encoders back into odometry</li>
<li>It drives <em>any</em> differential-drive base because it never sees your motors — only a wheel joint and<br />
its velocity. Its parameters are the wheel names, the wheel separation and the wheel radius</li>
<li>You provide the hardware side: which joints exist, and code that reads encoders and writes commands</li>
<li>In simulation that hardware side is provided for you — same description, same controller settings</li>
<li><strong>“Every robot?”</strong> Every differential-drive base. Another kinematics, another controller: ackermann,<br />
mecanum, omni — and a robot without wheel encoders gets no odometry at all</li>
</ul>
<p>We meet it again as soon as we model our own robot: describe the wheels, pick the controller.</p>
<p><span class="src"><img class="emoji" draggable="false" alt="📖" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4d6.svg" data-marp-twemoji=""/> <a href="https://control.ros.org/jazzy/">control.ros.org/jazzy</a></span></p>
<footer>KAU · Autonomous Robotic Systems Engineering · Lecture 0</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="32" data-paginate="true" data-footer="KAU · Autonomous Robotic Systems Engineering · Lecture 0" data-theme="kau" lang="en-US" data-marpit-pagination="32" style="--paginate:true;--footer:KAU · Autonomous Robotic Systems Engineering · Lecture 0;--theme:kau;" data-marpit-pagination-total="52">
<h2 id="looking-at-the-data">Looking at the Data</h2>
<pre><code class="language-bash">$ ros2 topic <span class="hljs-built_in">echo</span> /scan --once     <span class="hljs-comment"># one message, printed</span>
$ ros2 topic hz /scan
average rate: 9.984                <span class="hljs-comment"># how often it really arrives</span>
$ ros2 topic bw /camera/image_raw
27.31 MB/s                         <span class="hljs-comment"># what a camera actually costs you</span>
$ ros2 topic info /scan --verbose
Publisher count: 1                 <span class="hljs-comment"># who is on the other end</span>
Subscription count: 2
</code></pre>
<p><strong>There is no file that says how the system is wired.</strong> There is only the live graph — and these commands.</p>
<ul>
<li><code>list -t</code> first — the name is usually right and the type is not</li>
</ul>
<p><span class="src"><img class="emoji" draggable="false" alt="📖" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4d6.svg" data-marp-twemoji=""/> <a href="https://docs.ros.org/en/jazzy/Tutorials/Beginner-CLI-Tools/Understanding-ROS2-Topics/Understanding-ROS2-Topics.html">docs.ros.org/en/jazzy/Tutorials/Beginner-CLI-Tools/Understanding-ROS2-Topics/Understanding-ROS2-Topics.html</a></span></p>
<footer>KAU · Autonomous Robotic Systems Engineering · Lecture 0</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="33" data-paginate="true" data-footer="KAU · Autonomous Robotic Systems Engineering · Lecture 0" data-class="question" data-theme="kau" lang="en-US" class="question" data-marpit-pagination="33" style="--paginate:true;--footer:KAU · Autonomous Robotic Systems Engineering · Lecture 0;--class:question;--theme:kau;" data-marpit-pagination-total="52">
<h2 id="ros2-topic-list-shows-scan-ros2-topic-echo-scan-prints-nothing-and-no-error-appears-anywhere-what-is-wrong"><code>ros2 topic list</code> shows <code>/scan</code>. <code>ros2 topic echo /scan</code> prints nothing, and no error appears anywhere. What is wrong?</h2>
<p><span class="src"><img class="emoji" draggable="false" alt="📖" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4d6.svg" data-marp-twemoji=""/> <a href="https://docs.ros.org/en/jazzy/Tutorials/Beginner-CLI-Tools/Understanding-ROS2-Topics/Understanding-ROS2-Topics.html">docs.ros.org/en/jazzy/Tutorials/Beginner-CLI-Tools/Understanding-ROS2-Topics/Understanding-ROS2-Topics.html</a></span></p>
<footer>KAU · Autonomous Robotic Systems Engineering · Lecture 0</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="34" data-paginate="true" data-footer="KAU · Autonomous Robotic Systems Engineering · Lecture 0" data-theme="kau" lang="en-US" data-marpit-pagination="34" style="--paginate:true;--footer:KAU · Autonomous Robotic Systems Engineering · Lecture 0;--theme:kau;" data-marpit-pagination-total="52">
<h2 id="answer-2">Answer</h2>
<p><strong>The topic exists, but nothing is publishing to it.</strong></p>
<ul>
<li><code>ros2 topic list</code> shows a name as soon as <em>anyone</em> mentions it — a subscriber alone is enough</li>
<li><code>ros2 topic info /scan --verbose</code> prints the publisher count. Zero publishers, no data, no error</li>
<li>The other usual cause is a typo: you are echoing <code>/scan</code> while the driver publishes <code>/scan_raw</code></li>
<li>Silence is a normal state in ROS 2 — that is why you check the graph, not the log</li>
</ul>
<p><span class="src"><img class="emoji" draggable="false" alt="📖" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4d6.svg" data-marp-twemoji=""/> <a href="https://docs.ros.org/en/jazzy/Tutorials/Beginner-CLI-Tools/Understanding-ROS2-Topics/Understanding-ROS2-Topics.html">docs.ros.org/en/jazzy/Tutorials/Beginner-CLI-Tools/Understanding-ROS2-Topics/Understanding-ROS2-Topics.html</a></span></p>
<footer>KAU · Autonomous Robotic Systems Engineering · Lecture 0</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="35" data-paginate="true" data-footer="KAU · Autonomous Robotic Systems Engineering · Lecture 0" data-theme="kau" lang="en-US" data-marpit-pagination="35" style="--paginate:true;--footer:KAU · Autonomous Robotic Systems Engineering · Lecture 0;--theme:kau;" data-marpit-pagination-total="52">
<h2 id="rqt_graph--the-graph-drawn">rqt_graph — the Graph, Drawn</h2>
<figure>
<img src="img/rqt_graph.png" alt="rqt_graph showing nodes connected through topics" style="width:900px" />
<figcaption>Ovals are nodes, rectangles are topics. Screenshot: ROS 2 documentation, CC BY 4.0</figcaption>
</figure>
<ul>
<li>One command — <code>rqt_graph</code> — and you see who is actually connected to whom</li>
<li>The fastest way to discover that two things you believed were talking are not</li>
</ul>
<p><span class="src"><img class="emoji" draggable="false" alt="📖" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4d6.svg" data-marp-twemoji=""/> <a href="https://docs.ros.org/en/jazzy/Tutorials/Beginner-CLI-Tools/Understanding-ROS2-Topics/Understanding-ROS2-Topics.html">docs.ros.org/en/jazzy/Tutorials/Beginner-CLI-Tools/Understanding-ROS2-Topics/Understanding-ROS2-Topics.html</a></span></p>
<footer>KAU · Autonomous Robotic Systems Engineering · Lecture 0</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="36" data-paginate="true" data-footer="KAU · Autonomous Robotic Systems Engineering · Lecture 0" data-theme="kau" lang="en-US" data-marpit-pagination="36" style="--paginate:true;--footer:KAU · Autonomous Robotic Systems Engineering · Lecture 0;--theme:kau;" data-marpit-pagination-total="52">
<h2 id="publishing-from-the-terminal">Publishing from the Terminal</h2>
<pre><code class="language-bash">$ ros2 topic pub -r 10 /cmd_vel geometry_msgs/msg/Twist \
    <span class="hljs-string">&quot;{linear: {x: 0.2}, angular: {z: 0.5}}&quot;</span>
</code></pre>
<p>The robot drives an arc. No code written.</p>
<ul>
<li>The receiving node cannot tell a terminal from a planner — same topic, same type</li>
<li>So any node can be tested by standing in for its missing neighbour</li>
<li>“Should work, but the robot is not moving” → the first thing you do is <code>echo</code></li>
<li><code>--once</code> sends a single message and exits; without <code>-r</code> the default is 1 Hz</li>
<li>A typo in the topic name is not an error — you publish to a brand-new topic nobody reads</li>
</ul>
<p><span class="src"><img class="emoji" draggable="false" alt="📖" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4d6.svg" data-marp-twemoji=""/> <a href="https://docs.ros.org/en/jazzy/Tutorials/Beginner-CLI-Tools/Understanding-ROS2-Topics/Understanding-ROS2-Topics.html">docs.ros.org/en/jazzy/Tutorials/Beginner-CLI-Tools/Understanding-ROS2-Topics/Understanding-ROS2-Topics.html</a></span></p>
<footer>KAU · Autonomous Robotic Systems Engineering · Lecture 0</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="37" data-paginate="true" data-footer="KAU · Autonomous Robotic Systems Engineering · Lecture 0" data-theme="kau" lang="en-US" data-marpit-pagination="37" style="--paginate:true;--footer:KAU · Autonomous Robotic Systems Engineering · Lecture 0;--theme:kau;" data-marpit-pagination-total="52">
<h2 id="recording-what-happened">Recording What Happened</h2>
<pre><code class="language-bash">$ ros2 bag record --topics /scan /odom /cmd_vel    <span class="hljs-comment"># or -a for everything</span>
$ ros2 bag info rosbag2_2026_09_07-14_22_10        <span class="hljs-comment"># topics, duration, message count</span>
$ ros2 bag play rosbag2_2026_09_07-14_22_10        <span class="hljs-comment"># replay it as live data</span>
</code></pre>
<ul>
<li>A subscriber cannot tell a bag from a live sensor — same topic, same type</li>
<li>So an algorithm is debugged without a robot, deterministically, in CI</li>
<li>You and I measure on <strong>identical data</strong> — a bag ships with every lab</li>
</ul>
<p><span class="src"><img class="emoji" draggable="false" alt="📖" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4d6.svg" data-marp-twemoji=""/> <a href="https://docs.ros.org/en/jazzy/Tutorials/Beginner-CLI-Tools/Recording-And-Playing-Back-Data/Recording-And-Playing-Back-Data.html">docs.ros.org/en/jazzy/Tutorials/Beginner-CLI-Tools/Recording-And-Playing-Back-Data/Recording-And-Playing-Back-Data.html</a></span></p>
<footer>KAU · Autonomous Robotic Systems Engineering · Lecture 0</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="38" data-paginate="true" data-footer="KAU · Autonomous Robotic Systems Engineering · Lecture 0" data-theme="kau" lang="en-US" data-marpit-pagination="38" style="--paginate:true;--footer:KAU · Autonomous Robotic Systems Engineering · Lecture 0;--theme:kau;" data-marpit-pagination-total="52">
<h2 id="from-simulation-to-a-real-robot">From Simulation to a Real Robot</h2>
<div style="text-align:center">
<svg width="920" height="205" viewBox="0 0 920 205" style="max-width:100%">
  <g fill="none" stroke="#111" stroke-width="1.5" font-family="DM Sans, sans-serif" font-size="13">
    <rect x="255" y="78" width="410" height="74" stroke-dasharray="6 5" />
    <text x="460" y="98" text-anchor="middle" stroke="none" fill="#666" font-size="11">YOUR NODES — UNCHANGED</text>
    <rect x="285" y="104" width="150" height="36" />
    <text x="360" y="127" text-anchor="middle" stroke="none" fill="#111">/slam</text>
    <rect x="485" y="104" width="150" height="36" />
    <text x="560" y="127" text-anchor="middle" stroke="none" fill="#111">/planner</text>
    <text x="14" y="34" stroke="none" fill="#666" font-size="11">SIM</text>
    <rect x="10" y="42" width="170" height="38" />
    <text x="95" y="66" text-anchor="middle" stroke="none" fill="#111">Gazebo sensor</text>
    <path d="M180 61 L320 61 L320 76" /><path d="M315 66 L320 78 L325 66" />
    <rect x="186" y="46" width="62" height="26" rx="13" fill="#f5f5f5" />

<li>A real driver publishes best-effort sensor data — a reliable subscription connects to nothing</li>

<h2 id="a-real-robot--turtlebot-3-burger">A Real Robot — TurtleBot 3 Burger</h2>
<div class="cols">
<div>
<figure>
<img src="img/turtlebot3-burger.jpg" alt="TurtleBot 3 Burger" style="height:330px" />
<figcaption>Photo: Kuscu0, Wikimedia Commons, CC BY-SA 4.0</figcaption>
</figure>
</div>
<div>
<p><strong>Two computers.</strong> A Raspberry Pi runs ROS 2; a small control board runs the motors.</p>
<p><strong>Why two?</strong> Linux is good at graphs and networking, and bad at hitting a deadline. Driving motors is a small loop that must run on time, every time — so it gets its own board.</p>
<p><strong>Sensors.</strong> 360° laser scanner · IMU on the control board · encoders inside the two servo motors · battery monitor.</p>
<p><strong>It publishes:</strong> <code>/scan</code> · <code>/odom</code> · <code>/imu</code> · <code>/joint_states</code> · <code>/battery_state</code></p>
<p><strong>It subscribes to one motion topic:</strong> <code>/cmd_vel</code></p>
</div>
</div>
<p><span class="src"><img class="emoji" draggable="false" alt="📖" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4d6.svg" data-marp-twemoji=""/> <a href="https://emanual.robotis.com/docs/en/platform/turtlebot3/overview/">emanual.robotis.com/docs/en/platform/turtlebot3/overview</a></span></p>
<footer>KAU · Autonomous Robotic Systems Engineering · Lecture 0</footer>
</section>

<h2 id="services-and-actions">Services and Actions</h2>
<table>
<thead>
<tr>
<th></th>
<th>What it is</th>
<th>When</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Topic</strong></td>
<td>stream, no reply</td>
<td>sensor data, commands</td>
</tr>
<tr>
<td><strong>Service</strong></td>
<td>request → response</td>
<td>a quick one-off call</td>
</tr>
<tr>
<td><strong>Action</strong></td>
<td>goal → feedback → result</td>
<td>a long task</td>
</tr>
<tr>
<td><strong>Parameter</strong></td>
<td>a named setting of a node</td>
<td>change behaviour, no rebuild</td>
</tr>
</tbody>
</table>
<ul>
<li>Longer than a second, or you may need to cancel it → action</li>
<li><code>ros2 service list -t</code> · <code>ros2 action list -t</code> — the same introspection you already use on topics</li>
<li>Nav2 hands you actions; from the second lab on you send goals to them from your own node</li>
</ul>
<p><span class="src"><img class="emoji" draggable="false" alt="📖" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4d6.svg" data-marp-twemoji=""/> <a href="https://docs.ros.org/en/jazzy/Concepts/Basic/About-Services.html">docs.ros.org/en/jazzy/Concepts/Basic/About-Services.html</a> · <a href="https://docs.ros.org/en/jazzy/Concepts/Basic/About-Actions.html">docs.ros.org/en/jazzy/Concepts/Basic/About-Actions.html</a></span></p>
<footer>KAU · Autonomous Robotic Systems Engineering · Lecture 0</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="42" data-paginate="true" data-footer="KAU · Autonomous Robotic Systems Engineering · Lecture 0" data-theme="kau" lang="en-US" data-marpit-pagination="42" style="--paginate:true;--footer:KAU · Autonomous Robotic Systems Engineering · Lecture 0;--theme:kau;" data-marpit-pagination-total="52">
<h2 id="a-package--the-simplest-one">A Package — the Simplest One</h2>
<pre><code class="language-bash">$ ros2 pkg create --build-type ament_python my_pkg --dependencies rclpy sensor_msgs
</code></pre>
<p>One command, and you get:</p>
<pre><code>ws/src/my_pkg/
├── package.xml      # name, license, dependencies — this is what makes it a ROS package
├── setup.py         # what to install, and which script becomes a runnable node
└── my_pkg/
    └── my_node.py   # your code
</code></pre>
<ul>
<li>A package is the unit you build, install, share and depend on — never a loose script</li>
<li><code>package.xml</code> is why <code>rosdep install</code> can fetch your dependencies on someone else's machine</li>
<li><code>build/</code>, <code>install/</code>, <code>log/</code> are generated — they never go into git</li>
</ul>
<p><span class="src"><img class="emoji" draggable="false" alt="📖" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4d6.svg" data-marp-twemoji=""/> <a href="https://docs.ros.org/en/jazzy/Tutorials/Beginner-Client-Libraries/Creating-Your-First-ROS2-Package.html">docs.ros.org/en/jazzy/Tutorials/Beginner-Client-Libraries/Creating-Your-First-ROS2-Package.html</a></span></p>
<footer>KAU · Autonomous Robotic Systems Engineering · Lecture 0</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="43" data-paginate="true" data-footer="KAU · Autonomous Robotic Systems Engineering · Lecture 0" data-theme="kau" lang="en-US" data-marpit-pagination="43" style="--paginate:true;--footer:KAU · Autonomous Robotic Systems Engineering · Lecture 0;--theme:kau;" data-marpit-pagination-total="52">
<h2 id="python-or-cmake">Python or CMake?</h2>
<table>
<thead>
<tr>
<th>Build type</th>
<th>You write</th>
<th>Use it for</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>ament_python</code></td>
<td><code>setup.py</code></td>
<td>Python nodes — everything in Lab 0</td>
</tr>
<tr>
<td><code>ament_cmake</code></td>
<td><code>CMakeLists.txt</code></td>
<td>C++ nodes</td>
</tr>
</tbody>
</table>
<ul>
<li>Both produce the same thing: a package <code>colcon</code> builds and <code>ros2 run</code> can start</li>
<li>The same workspace holds both, and the two talk over the same topics</li>
</ul>
<p><span class="src"><img class="emoji" draggable="false" alt="📖" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4d6.svg" data-marp-twemoji=""/> <a href="https://docs.ros.org/en/jazzy/How-To-Guides/Ament-CMake-Documentation.html">docs.ros.org/en/jazzy/How-To-Guides/Ament-CMake-Documentation.html</a></span></p>
<footer>KAU · Autonomous Robotic Systems Engineering · Lecture 0</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="44" data-paginate="true" data-footer="KAU · Autonomous Robotic Systems Engineering · Lecture 0" data-theme="kau" lang="en-US" data-marpit-pagination="44" style="--paginate:true;--footer:KAU · Autonomous Robotic Systems Engineering · Lecture 0;--theme:kau;" data-marpit-pagination-total="52">
<h2 id="parameters">Parameters</h2>
<pre><code class="language-bash">$ ros2 param list /my_node
$ ros2 param get  /my_node speed
$ ros2 param <span class="hljs-built_in">set</span>  /my_node speed 0.5
</code></pre>
<ul>
<li>Settings live outside the code: a threshold, a topic name, a gain, a frame rate</li>
<li>The same node, different robot, different run — no rebuild</li>
<li>Set from the command line, from a launch file, or from a YAML file</li>
<li>A parameter has to be declared by the node before it can be set</li>
</ul>
<p><span class="src"><img class="emoji" draggable="false" alt="📖" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4d6.svg" data-marp-twemoji=""/> <a href="https://docs.ros.org/en/jazzy/Concepts/Basic/About-Parameters.html">docs.ros.org/en/jazzy/Concepts/Basic/About-Parameters.html</a></span></p>
<footer>KAU · Autonomous Robotic Systems Engineering · Lecture 0</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="45" data-paginate="true" data-footer="KAU · Autonomous Robotic Systems Engineering · Lecture 0" data-theme="kau" lang="en-US" data-marpit-pagination="45" style="--paginate:true;--footer:KAU · Autonomous Robotic Systems Engineering · Lecture 0;--theme:kau;" data-marpit-pagination-total="52">
<h2 id="build-and-run">Build and Run</h2>
<pre><code class="language-bash">$ colcon build --packages-select my_pkg --symlink-install
$ <span class="hljs-built_in">source</span> install/setup.bash
$ ros2 run my_pkg my_node

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="46" data-paginate="true" data-footer="KAU · Autonomous Robotic Systems Engineering · Lecture 0" data-class="question" data-theme="kau" lang="en-US" class="question" data-marpit-pagination="46" style="--paginate:true;--footer:KAU · Autonomous Robotic Systems Engineering · Lecture 0;--class:question;--theme:kau;" data-marpit-pagination-total="52">
<h2 id="change-one-line-of-code-and-you-must-rebuild-and-re-source-change-a-number-in-a-yaml-file-and-you-need-neither-why">Change one line of code and you must rebuild and re-source. Change a number in a YAML file and you need neither. Why?</h2>
<p><span class="src"><img class="emoji" draggable="false" alt="📖" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4d6.svg" data-marp-twemoji=""/> <a href="https://docs.ros.org/en/jazzy/Tutorials/Beginner-Client-Libraries/Colcon-Tutorial.html">docs.ros.org/en/jazzy/Tutorials/Beginner-Client-Libraries/Colcon-Tutorial.html</a></span></p>
<footer>KAU · Autonomous Robotic Systems Engineering · Lecture 0</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="47" data-paginate="true" data-footer="KAU · Autonomous Robotic Systems Engineering · Lecture 0" data-theme="kau" lang="en-US" data-marpit-pagination="47" style="--paginate:true;--footer:KAU · Autonomous Robotic Systems Engineering · Lecture 0;--theme:kau;" data-marpit-pagination-total="52">
<h2 id="answer-3">Answer</h2>
<p><strong>Code is installed; configuration is read.</strong></p>
<ul>
<li><code>colcon build</code> copies (or links) your package into <code>install/</code>, and <code>ros2 run</code> starts what is there — not what is in <code>src/</code></li>
<li><code>source install/setup.bash</code> is what tells this shell where <code>install/</code> is</li>
<li>A YAML file is read by the node <strong>at startup</strong>, so a new value only needs a restart</li>
<li>Which is why anything you expect to tune — a speed limit, a threshold, a topic name — belongs in a parameter file, not in the code</li>
</ul>
<p><span class="src"><img class="emoji" draggable="false" alt="📖" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4d6.svg" data-marp-twemoji=""/> <a href="https://docs.ros.org/en/jazzy/Tutorials/Beginner-Client-Libraries/Colcon-Tutorial.html">docs.ros.org/en/jazzy/Tutorials/Beginner-Client-Libraries/Colcon-Tutorial.html</a></span></p>
<footer>KAU · Autonomous Robotic Systems Engineering · Lecture 0</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="48" data-paginate="true" data-footer="KAU · Autonomous Robotic Systems Engineering · Lecture 0" data-theme="kau" lang="en-US" data-marpit-pagination="48" style="--paginate:true;--footer:KAU · Autonomous Robotic Systems Engineering · Lecture 0;--theme:kau;" data-marpit-pagination-total="52">
<h2 id="launch-files--what-actually-starts">Launch Files — What Actually Starts</h2>
<pre><code class="language-bash">$ ros2 launch my_robot bringup.launch.py
</code></pre>
<p>Three terminals' worth of nodes, from one file:</p>
<table>
<thead>
<tr>
<th>Node it starts</th>
<th>What that node does</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>robot_state_publisher</code></td>
<td>publishes the robot's shape and joint positions</td>
</tr>
<tr>
<td><code>lidar_driver</code></td>
<td>reads the sensor, publishes <code>/scan</code></td>
</tr>
<tr>
<td><code>diff_drive_controller</code></td>
<td>turns <code>/cmd_vel</code> into wheel commands</td>
</tr>
</tbody>
</table>
<ul>
<li>One command instead of three terminals, in a fixed order, with fixed parameters</li>
<li>Topic renaming and parameters live here, not in the code — same system, different setup, no rebuild</li>
<li><code>--show-args</code> lists everything you can override from the command line</li>
</ul>
<p><span class="src"><img class="emoji" draggable="false" alt="📖" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4d6.svg" data-marp-twemoji=""/> <a href="https://docs.ros.org/en/jazzy/Tutorials/Intermediate/Launch/Launch-Main.html">docs.ros.org/en/jazzy/Tutorials/Intermediate/Launch/Launch-Main.html</a></span></p>
<footer>KAU · Autonomous Robotic Systems Engineering · Lecture 0</footer>
</section>

<h2 id="commands-for-lab-0">Commands for Lab 0</h2>
<pre><code class="language-bash">ros2 run &lt;pkg&gt; &lt;node&gt;              <span class="hljs-comment"># start a node</span>
ros2 node list · ros2 node info    <span class="hljs-comment"># who is in the graph</span>
ros2 topic list -t                 <span class="hljs-comment"># what is being published</span>
ros2 topic <span class="hljs-built_in">echo</span> · hz · info        <span class="hljs-comment"># look at the data</span>
ros2 topic pub                     <span class="hljs-comment"># publish by hand</span>
rqt_graph                          <span class="hljs-comment"># the graph, drawn</span>
colcon build --packages-select     <span class="hljs-comment"># build one package</span>
<span class="hljs-built_in">source</span> install/setup.bash          <span class="hljs-comment"># make it visible to ros2</span>
</code></pre>
<p><span class="src"><img class="emoji" draggable="false" alt="📖" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4d6.svg" data-marp-twemoji=""/> <a href="https://docs.ros.org/en/jazzy/Tutorials.html">docs.ros.org/en/jazzy/Tutorials.html</a></span></p>
<footer>KAU · Autonomous Robotic Systems Engineering · Lecture 0</footer>
</section>

<h2 id="setting-it-up">Setting It Up</h2>
<ol>
<li>Ubuntu 24.04 — <code>sudo apt install ros-jazzy-desktop</code></li>
<li><code>source /opt/ros/jazzy/setup.bash</code> in every new terminal, or once in <code>.bashrc</code></li>
<li>Make a workspace — <code>mkdir -p ~/ws/src</code>, then run <code>colcon build</code> from <code>~/ws</code></li>
<li><code>source ~/ws/install/setup.bash</code> — now <code>ros2 run</code> finds your own packages</li>
<li>Check it: <code>ros2 run demo_nodes_cpp talker</code> here, <code>ros2 run demo_nodes_py listener</code> there</li>
</ol>
<p>Same version for all of us: Jazzy on Ubuntu 24.04, or the course container on any other OS.</p>
<p><span class="src"><img class="emoji" draggable="false" alt="📖" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4d6.svg" data-marp-twemoji=""/> <a href="https://docs.ros.org/en/jazzy/Installation/Ubuntu-Install-Debs.html">docs.ros.org/en/jazzy/Installation/Ubuntu-Install-Debs.html</a></span></p>
<footer>KAU · Autonomous Robotic Systems Engineering · Lecture 0</footer>

<h2 id="lab-0">Lab 0</h2>
<p><strong>Not graded. No git, no README.</strong></p>
<ol>
<li><strong>Install ROS 2 Jazzy</strong> — the five steps from the previous slide. Build from source is optional</li>
<li>Create a workspace and a package</li>
<li>One node publishing a sensor-style message, one subscribing to it —<br />
<code>Range</code> · <code>Imu</code> · <code>Temperature</code> · <code>BatteryState</code> · <code>LaserScan</code></li>
<li>Check it: <code>ros2 topic list</code> · <code>echo</code> · <code>hz</code></li>
</ol>
<ul>
<li>Use a sensor type, not <code>std_msgs/String</code> — the rest of the course runs on <code>sensor_msgs</code></li>
<li>The two links below are the whole lab: install, then workspace → package → publisher → subscriber</li>
</ul>
<p><span class="src"><img class="emoji" draggable="false" alt="📖" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4d6.svg" data-marp-twemoji=""/> <a href="https://docs.ros.org/en/jazzy/Installation/Ubuntu-Install-Debs.html">docs.ros.org/en/jazzy/Installation/Ubuntu-Install-Debs.html</a> · <a href="https://docs.ros.org/en/jazzy/Tutorials/Beginner-Client-Libraries.html">docs.ros.org/en/jazzy/Tutorials/Beginner-Client-Libraries.html</a></span></p>

<p>Gazebo: physics, plugins, worlds and sensors · models from Fuel · running without a window · the ROS 2 ↔ Gazebo bridge · RViz · simulation time</p>

<li>Before then: <code>ros2 launch simple_bot bot.launch.py</code> — a robot that already drives from <code>/cmd_vel</code></li>
