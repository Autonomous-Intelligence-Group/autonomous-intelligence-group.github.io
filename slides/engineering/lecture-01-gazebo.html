<p><em>Worlds, physics and sensors, described in files</em></p>
<footer>KAU · Autonomous Robotic Systems Engineering · Lecture 1</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-paginate="true" data-footer="KAU · Autonomous Robotic Systems Engineering · Lecture 1" data-theme="kau" lang="en-US" data-marpit-pagination="4" style="--paginate:true;--footer:KAU · Autonomous Robotic Systems Engineering · Lecture 1;--theme:kau;" data-marpit-pagination-total="40">
<h2 id="what-gazebo-is">What Gazebo Is</h2>
<ul>
<li><code>gz sim</code> = a <strong>server</strong> (physics, sensors, plugins) + a <strong>GUI</strong> — two separate processes</li>
<li>An <strong>entity</strong> is anything that exists in the running world. Every one of these SDF elements becomes one: <code>&lt;world&gt;</code> · <code>&lt;model&gt;</code> · <code>&lt;link&gt;</code> · <code>&lt;collision&gt;</code> · <code>&lt;visual&gt;</code> · <code>&lt;joint&gt;</code> · <code>&lt;light&gt;</code> · <code>&lt;sensor&gt;</code></li>
<li>An entity carries properties — name, pose, mass; <strong>plugins</strong> act on entities every step</li>
<li>The GUI: play · pause · step · reset · real-time factor · entity tree · plugin menu</li>
</ul>
<p><span class="src"><img class="emoji" draggable="false" alt="▶️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/25b6.svg" data-marp-twemoji=""/> <a href="https://gazebosim.org/docs/harmonic/gui/">gazebosim.org/docs/harmonic/gui</a> · <img class="emoji" draggable="false" alt="📖" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4d6.svg" data-marp-twemoji=""/> <a href="https://gazebosim.org/docs/harmonic/getstarted/">gazebosim.org/docs/harmonic/getstarted</a></span></p>
<footer>KAU · Autonomous Robotic Systems Engineering · Lecture 1</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-paginate="true" data-footer="KAU · Autonomous Robotic Systems Engineering · Lecture 1" data-theme="kau" lang="en-US" data-marpit-pagination="5" style="--paginate:true;--footer:KAU · Autonomous Robotic Systems Engineering · Lecture 1;--theme:kau;" data-marpit-pagination-total="40">
<h2 id="a-world-is-an-sdf-file">A World Is an SDF File</h2>
<pre><code class="language-xml"><span class="hljs-tag">&lt;<span class="hljs-name">world</span> <span class="hljs-attr">name</span>=<span class="hljs-string">&quot;demo&quot;</span>&gt;</span>                              <span class="hljs-comment">&lt;!-- entity: the world itself --&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">physics</span> <span class="hljs-attr">name</span>=<span class="hljs-string">&quot;1ms&quot;</span> <span class="hljs-attr">type</span>=<span class="hljs-string">&quot;ignored&quot;</span>&gt;</span>            <span class="hljs-comment">&lt;!-- world settings, not an entity --&gt;</span>
    <span class="hljs-tag">&lt;<span class="hljs-name">max_step_size</span>&gt;</span>0.001<span class="hljs-tag">&lt;/<span class="hljs-name">max_step_size</span>&gt;</span>         <span class="hljs-comment">&lt;!-- one physics step: 1 ms --&gt;</span>
    <span class="hljs-tag">&lt;<span class="hljs-name">real_time_factor</span>&gt;</span>1.0<span class="hljs-tag">&lt;/<span class="hljs-name">real_time_factor</span>&gt;</span>     <span class="hljs-comment">&lt;!-- aim: as fast as reality --&gt;</span>
  <span class="hljs-tag">&lt;/<span class="hljs-name">physics</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">plugin</span> <span class="hljs-attr">filename</span>=<span class="hljs-string">&quot;gz-sim-physics-system&quot;</span>
          <span class="hljs-attr">name</span>=<span class="hljs-string">&quot;gz::sim::systems::Physics&quot;</span>/&gt;</span>     <span class="hljs-comment">&lt;!-- behaviour, not an entity --&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">light</span> <span class="hljs-attr">type</span>=<span class="hljs-string">&quot;directional&quot;</span> <span class="hljs-attr">name</span>=<span class="hljs-string">&quot;sun&quot;</span>&gt;</span>…<span class="hljs-tag">&lt;/<span class="hljs-name">light</span>&gt;</span> <span class="hljs-comment">&lt;!-- entity: a light --&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">model</span> <span class="hljs-attr">name</span>=<span class="hljs-string">&quot;box&quot;</span>&gt;</span>                             <span class="hljs-comment">&lt;!-- entity: a model, a named object --&gt;</span>
    <span class="hljs-tag">&lt;<span class="hljs-name">pose</span>&gt;</span>0 0 0.5 0 0 0<span class="hljs-tag">&lt;/<span class="hljs-name">pose</span>&gt;</span>                   <span class="hljs-comment">&lt;!-- x y z [m], roll pitch yaw [rad] --&gt;</span>
    <span class="hljs-tag">&lt;<span class="hljs-name">link</span> <span class="hljs-attr">name</span>=<span class="hljs-string">&quot;link&quot;</span>&gt;</span>                           <span class="hljs-comment">&lt;!-- entity: one rigid body --&gt;</span>
      <span class="hljs-tag">&lt;<span class="hljs-name">inertial</span>&gt;</span><span class="hljs-tag">&lt;<span class="hljs-name">mass</span>&gt;</span>0.1<span class="hljs-tag">&lt;/<span class="hljs-name">mass</span>&gt;</span><span class="hljs-tag">&lt;/<span class="hljs-name">inertial</span>&gt;</span>      <span class="hljs-comment">&lt;!-- what physics needs: mass, inertia --&gt;</span>
      <span class="hljs-tag">&lt;<span class="hljs-name">collision</span> <span class="hljs-attr">name</span>=<span class="hljs-string">&quot;c&quot;</span>&gt;</span>…box…<span class="hljs-tag">&lt;/<span class="hljs-name">collision</span>&gt;</span>      <span class="hljs-comment">&lt;!-- entity: the shape that collides --&gt;</span>
      <span class="hljs-tag">&lt;<span class="hljs-name">visual</span> <span class="hljs-attr">name</span>=<span class="hljs-string">&quot;v&quot;</span>&gt;</span>…box…<span class="hljs-tag">&lt;/<span class="hljs-name">visual</span>&gt;</span>            <span class="hljs-comment">&lt;!-- entity: the shape you see --&gt;</span>
    <span class="hljs-tag">&lt;/<span class="hljs-name">link</span>&gt;</span>
  <span class="hljs-tag">&lt;/<span class="hljs-name">model</span>&gt;</span>
<span class="hljs-tag">&lt;/<span class="hljs-name">world</span>&gt;</span>
</code></pre>
<p><span class="src"><img class="emoji" draggable="false" alt="▶️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/25b6.svg" data-marp-twemoji=""/> <a href="https://gazebosim.org/docs/harmonic/sdf_worlds/">gazebosim.org/docs/harmonic/sdf_worlds</a></span></p>
<footer>KAU · Autonomous Robotic Systems Engineering · Lecture 1</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-footer="KAU · Autonomous Robotic Systems Engineering · Lecture 1" data-theme="kau" lang="en-US" data-marpit-pagination="6" style="--paginate:true;--footer:KAU · Autonomous Robotic Systems Engineering · Lecture 1;--theme:kau;" data-marpit-pagination-total="40">
<h2 id="edit-the-file-not-the-window">Edit the File, Not the Window</h2>
<ul>
<li>The cycle: edit <code>world.sdf</code> → <code>gz sim -r world.sdf</code></li>
<li>What you change in the GUI lives only in the running simulation — <code>Reset</code> clears it, the file is untouched</li>
<li>A plugin is one <code>&lt;plugin filename=&quot;…&quot; name=&quot;…&quot;&gt;</code> line inside <code>&lt;world&gt;</code></li>
<li>A model from the internet is one <code>&lt;include&gt;</code> — later today</li>
</ul>
<footer>KAU · Autonomous Robotic Systems Engineering · Lecture 1</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-footer="KAU · Autonomous Robotic Systems Engineering · Lecture 1" data-theme="kau" lang="en-US" data-marpit-pagination="7" style="--paginate:true;--footer:KAU · Autonomous Robotic Systems Engineering · Lecture 1;--theme:kau;" data-marpit-pagination-total="40">
<h2 id="what-the-physics-computes">What the Physics Computes</h2>
<ul>
<li><strong>mass and inertia</strong> — a 10 kg box is harder to push and to spin than a 0.1 kg one</li>
<li><strong>gravity</strong> — 9.81 m/s² down: without air drag, our box hits ~310 m/s after 5000 m</li>
<li><strong>forces and torques</strong> — a thruster, the wind, a push applied from the GUI</li>
<li><strong>joints</strong> — a wheel's axle (revolute), a drawer (prismatic), a bolted part (fixed)</li>
<li><strong>collisions and contacts</strong> — the box stops on the ground instead of falling through it</li>
<li><strong>friction</strong> — wheels grip the floor; a caster with low friction slides</li>
</ul>
<p><span class="src"><img class="emoji" draggable="false" alt="▶️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/25b6.svg" data-marp-twemoji=""/> <a href="https://gazebosim.org/api/physics/7/physicsconcepts.html">gazebosim.org/api/physics/7/physicsconcepts.html</a></span></p>
<footer>KAU · Autonomous Robotic Systems Engineering · Lecture 1</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-footer="KAU · Autonomous Robotic Systems Engineering · Lecture 1" data-theme="kau" lang="en-US" data-marpit-pagination="8" style="--paginate:true;--footer:KAU · Autonomous Robotic Systems Engineering · Lecture 1;--theme:kau;" data-marpit-pagination-total="40">
<h2 id="ground-gravity-falling">Ground, Gravity, Falling</h2>
<ul>
<li>A new world is <strong>empty</strong> — no ground unless you add one</li>
<li>A model placed in the air <strong>falls</strong> — gravity is on by default: <code>&lt;gravity&gt;0 0 -9.8&lt;/gravity&gt;</code> in <code>&lt;world&gt;</code></li>
<li>It <strong>stays</strong> with <code>&lt;static&gt;true&lt;/static&gt;</code> — a wall, a table, the ground itself</li>
<li>With no ground it falls <strong>forever</strong> — there is nothing to collide with</li>
<li>The shortcut: start from Gazebo's <code>empty.sdf</code> — it already has a ground and a sun</li>
</ul>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-footer="KAU · Autonomous Robotic Systems Engineering · Lecture 1" data-theme="kau" lang="en-US" data-marpit-pagination="9" style="--paginate:true;--footer:KAU · Autonomous Robotic Systems Engineering · Lecture 1;--theme:kau;" data-marpit-pagination-total="40">
<h2 id="one-simulation-step">One Simulation Step</h2>
<div style="text-align:center">
<svg width="940" height="250" viewBox="0 0 940 250" style="max-width:100%">
  <g fill="none" stroke="#111" stroke-width="1.5" font-family="DM Sans, sans-serif" font-size="14">
    <rect x="10" y="40" width="200" height="74" />
    <text x="110" y="68" text-anchor="middle" stroke="none" fill="#111" font-weight="bold">PreUpdate</text>
    <text x="110" y="90" text-anchor="middle" stroke="none" fill="#666" font-size="12">commands write to the world</text>
    <path d="M210 77 L256 77" /><path d="M248 72 L260 77 L248 82" />
    <rect x="260" y="40" width="200" height="74" fill="#f5f5f5" />
    <text x="360" y="68" text-anchor="middle" stroke="none" fill="#111" font-weight="bold">Update</text>
    <text x="360" y="90" text-anchor="middle" stroke="none" fill="#666" font-size="12">Physics: DART advances dt</text>
    <path d="M460 77 L506 77" /><path d="M498 72 L510 77 L498 82" />
    <rect x="510" y="40" width="200" height="74" />
    <text x="610" y="68" text-anchor="middle" stroke="none" fill="#111" font-weight="bold">PostUpdate</text>
    <text x="610" y="90" text-anchor="middle" stroke="none" fill="#666" font-size="12">read-only: sensors, publishing</text>
    <path d="M710 77 L756 77" /><path d="M748 72 L760 77 L748 82" />
    <rect x="760" y="40" width="170" height="74" rx="37" />
    <text x="845" y="70" text-anchor="middle" stroke="none" fill="#111">sim time += dt</text>
    <text x="845" y="90" text-anchor="middle" stroke="none" fill="#666" font-size="12">dt = 1 ms</text>
    <path d="M845 114 L845 190 L110 190 L110 118" stroke-dasharray="5 4" />
    <path d="M105 128 L110 116 L115 128" />
    <text x="478" y="214" text-anchor="middle" stroke="none" fill="#666" font-size="12">wait, so that simulated time keeps the real-time factor — then the next step</text>
  </g>
</svg>
</div>
<ul>
<li>dt = 1 ms, so <strong>1 simulated second = 1000 steps</strong>; at real-time factor 1 that is also 1000 steps per second on the wall clock</li>
<li>Sensors never change the world — they only read what physics just computed</li>
</ul>
<p><span class="src"><img class="emoji" draggable="false" alt="📖" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4d6.svg" data-marp-twemoji=""/> <a href="https://gazebosim.org/api/sim/8/createsystemplugins.html">gazebosim.org/api/sim/8/createsystemplugins.html</a></span></p>
<footer>KAU · Autonomous Robotic Systems Engineering · Lecture 1</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-footer="KAU · Autonomous Robotic Systems Engineering · Lecture 1" data-theme="kau" lang="en-US" data-marpit-pagination="10" style="--paginate:true;--footer:KAU · Autonomous Robotic Systems Engineering · Lecture 1;--theme:kau;" data-marpit-pagination-total="40">
<h2 id="the-default-engine-dart">The Default Engine: DART</h2>
<ul>
<li>Dynamic Animation and Robotics Toolkit</li>
<li>Articulated rigid bodies: kinematics, dynamics, collision detection, contact solving</li>
<li>Gazebo talks to it through the gz-physics library, so the engine is a replaceable plugin</li>
<li>All of it is open source</li>
</ul>
<p><span class="src"><img class="emoji" draggable="false" alt="📖" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4d6.svg" data-marp-twemoji=""/> <a href="https://gazebosim.org/libs/physics/">gazebosim.org/libs/physics</a> · <img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3af.svg" data-marp-twemoji=""/> <a href="https://github.com/dartsim/dart">github.com/dartsim/dart</a> (BSD 2-Clause) · <img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3af.svg" data-marp-twemoji=""/> <a href="https://github.com/gazebosim/gz-physics">github.com/gazebosim/gz-physics</a> (Apache-2.0) · <img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3af.svg" data-marp-twemoji=""/> <a href="https://github.com/gazebosim/gz-sim">github.com/gazebosim/gz-sim</a> (Apache-2.0)</span></p>
<footer>KAU · Autonomous Robotic Systems Engineering · Lecture 1</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-footer="KAU · Autonomous Robotic Systems Engineering · Lecture 1" data-theme="kau" lang="en-US" data-marpit-pagination="11" style="--paginate:true;--footer:KAU · Autonomous Robotic Systems Engineering · Lecture 1;--theme:kau;" data-marpit-pagination-total="40">
<h2 id="what-relies-on-the-physics-plugin">What Relies on the Physics Plugin</h2>
<ul>
<li><strong>Nothing moves without it.</strong> Checked: with the Physics plugin left out, a box placed at 10 m is still at 10 m</li>
<li><strong>Wheeled robots</strong> — wheel–ground contact and friction turn a spinning wheel into motion</li>
<li><strong>Drones, planes, boats</strong> — thrust, lift and buoyancy are forces other plugins apply; Physics turns them into motion</li>
<li><strong>Arms and grippers</strong> — joint limits, contacts while grasping, an object slipping out</li>
<li><strong>Sensors</strong> — an IMU reads the accelerations Physics computed; contact and force-torque sensors read its contacts</li>
<li><strong>Testing before hardware</strong> — does it tip over on a slope, collide with the shelf, survive a drop</li>
</ul>
<footer>KAU · Autonomous Robotic Systems Engineering · Lecture 1</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-footer="KAU · Autonomous Robotic Systems Engineering · Lecture 1" data-theme="kau" lang="en-US" data-marpit-pagination="12" style="--paginate:true;--footer:KAU · Autonomous Robotic Systems Engineering · Lecture 1;--theme:kau;" data-marpit-pagination-total="40">
<h2 id="three-default-plugins">Three Default Plugins</h2>
<table>
<thead>
<tr>
<th>Plugin</th>
<th>What it holds</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Physics</strong></td>
<td>steps DART, computes motion and contacts</td>
</tr>
<tr>
<td><strong>UserCommands</strong></td>
<td>services <code>create</code> · <code>set_pose</code> · <code>remove</code> — how the GUI adds, moves and deletes</td>
</tr>
<tr>
<td><strong>SceneBroadcaster</strong></td>
<td>publishes the scene for the GUI — <code>scene/info</code>, <code>pose/info</code> at 60 Hz, <code>state</code>; without it the window is empty</td>
</tr>
</tbody>
</table>
<footer>KAU · Autonomous Robotic Systems Engineering · Lecture 1</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-footer="KAU · Autonomous Robotic Systems Engineering · Lecture 1" data-theme="kau" lang="en-US" data-marpit-pagination="13" style="--paginate:true;--footer:KAU · Autonomous Robotic Systems Engineering · Lecture 1;--theme:kau;" data-marpit-pagination-total="40">
<h2 id="where-the-default-set-lives">Where the Default Set Lives</h2>
<pre><code class="language-bash">$ <span class="hljs-built_in">cat</span> /opt/ros/jazzy/opt/gz_sim_vendor/share/gz/gz-sim8/server.config
&lt;plugin entity_name=<span class="hljs-string">&quot;*&quot;</span> entity_type=<span class="hljs-string">&quot;world&quot;</span> filename=<span class="hljs-string">&quot;gz-sim-physics-system&quot;</span> …&gt;
&lt;plugin entity_name=<span class="hljs-string">&quot;*&quot;</span> entity_type=<span class="hljs-string">&quot;world&quot;</span> filename=<span class="hljs-string">&quot;gz-sim-user-commands-system&quot;</span> …&gt;
&lt;plugin entity_name=<span class="hljs-string">&quot;*&quot;</span> entity_type=<span class="hljs-string">&quot;world&quot;</span> filename=<span class="hljs-string">&quot;gz-sim-scene-broadcaster-system&quot;</span> …&gt;
</code></pre>
<ul>
<li>Installed with Gazebo. It is a <strong>list</strong> of plugins, not the plugins themselves</li>
<li>To change it for yourself: a copy in <code>~/.gz/sim/8/server.config</code>, or <code>GZ_SIM_SERVER_CONFIG_PATH</code></li>
<li>A <code>&lt;plugin&gt;</code> list in your SDF <strong>replaces</strong> this set — list every plugin you need</li>
</ul>
<p><span class="src"><img class="emoji" draggable="false" alt="▶️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/25b6.svg" data-marp-twemoji=""/> <a href="https://gazebosim.org/api/sim/8/server_config.html">gazebosim.org/api/sim/8/server_config.html</a> · <img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3af.svg" data-marp-twemoji=""/> <a href="https://github.com/gazebosim/gz-sim">github.com/gazebosim/gz-sim</a></span></p>
<footer>KAU · Autonomous Robotic Systems Engineering · Lecture 1</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-footer="KAU · Autonomous Robotic Systems Engineering · Lecture 1" data-theme="kau" lang="en-US" data-marpit-pagination="14" style="--paginate:true;--footer:KAU · Autonomous Robotic Systems Engineering · Lecture 1;--theme:kau;" data-marpit-pagination-total="40">
<h2 id="sensor-plugins">Sensor Plugins</h2>
<table>
<thead>
<tr>
<th><code>&lt;sensor type=&quot;…&quot;&gt;</code></th>
<th>Plugin in <code>&lt;world&gt;</code></th>
</tr>
</thead>
<tbody>
<tr>
<td><code>camera</code> · <code>depth_camera</code> · <code>rgbd_camera</code> · <code>thermal_camera</code> · <code>segmentation_camera</code> · <code>boundingbox_camera</code> · <code>wideanglecamera</code> · <code>gpu_lidar</code></td>
<td><strong>Sensors</strong> (<code>gz-sim-sensors-system</code>) + <code>render_engine ogre2</code> — rendered</td>
</tr>
<tr>
<td><code>imu</code> · <code>magnetometer</code> · <code>altimeter</code> · <code>air_pressure</code> · <code>air_speed</code> · <code>navsat</code></td>
<td>one plugin each: <code>gz-sim-imu-system</code>, <code>gz-sim-magnetometer-system</code>, …</td>
</tr>
<tr>
<td><code>contact</code> · <code>force_torque</code> · <code>logical_camera</code> · <code>dvl</code></td>
<td><code>gz-sim-contact-system</code>, <code>gz-sim-forcetorque-system</code>, <code>gz-sim-logical-camera-system</code>, <code>gz-sim-dvl-system</code></td>
</tr>
</tbody>
</table>
<ul>
<li>A sensor = its plugin in <code>&lt;world&gt;</code> + a <code>&lt;sensor type=&quot;…&quot;&gt;</code> inside a <code>&lt;link&gt;</code></li>
<li>Plugin missing → the sensor is silent, and nothing reports an error</li>
</ul>
<p><span class="src"><img class="emoji" draggable="false" alt="📖" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4d6.svg" data-marp-twemoji=""/> <a href="https://github.com/gazebosim/gz-sim/tree/gz-sim8/examples/worlds">github.com/gazebosim/gz-sim/tree/gz-sim8/examples/worlds</a></span></p>
<footer>KAU · Autonomous Robotic Systems Engineering · Lecture 1</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-footer="KAU · Autonomous Robotic Systems Engineering · Lecture 1" data-theme="kau" lang="en-US" data-marpit-pagination="15" style="--paginate:true;--footer:KAU · Autonomous Robotic Systems Engineering · Lecture 1;--theme:kau;" data-marpit-pagination-total="40">
<h2 id="ogre">OGRE</h2>
<ul>
<li>An open-source 3D rendering engine; <code>ogre2</code> is OGRE-Next, MIT license</li>
<li>Draws the GUI window <strong>and</strong> every camera image</li>
<li><strong>In Lab 0.1 it renders your RGBD camera</strong> — with a window or without one</li>
</ul>
<p><span class="src"><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3af.svg" data-marp-twemoji=""/> <a href="https://github.com/OGRECave/ogre-next">github.com/OGRECave/ogre-next</a></span></p>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-footer="KAU · Autonomous Robotic Systems Engineering · Lecture 1" data-theme="kau" lang="en-US" data-marpit-pagination="16" style="--paginate:true;--footer:KAU · Autonomous Robotic Systems Engineering · Lecture 1;--theme:kau;" data-marpit-pagination-total="40">
<h2 id="getting-a-plugin">Getting a Plugin</h2>
<pre><code class="language-bash">$ gz plugin -i -p /opt/ros/jazzy/opt/gz_sim_vendor/lib/gz-sim-8/plugins/libgz-sim-altimeter-system.so
* Found 1 plugin <span class="hljs-keyword">in</span> library file:
  - gz::sim::v8::systems::Altimeter
* Found 3 interfaces <span class="hljs-keyword">in</span> library file:
  - gz::sim::v8::System
  - gz::sim::v8::ISystemPreUpdate
  - gz::sim::v8::ISystemPostUpdate
</code></pre>
<ul>
<li>A plugin is a library, not a download — the built-in ones ship with Gazebo</li>
<li><code>filename=&quot;gz-sim-altimeter-system&quot;</code> in SDF names this file; the interfaces are the step phases you just saw</li>
<li>Someone else's plugin: build it, then <code>export GZ_SIM_SYSTEM_PLUGIN_PATH=&lt;its directory&gt;</code></li>
<li>What is installed: <code>ls /opt/ros/jazzy/opt/gz_sim_vendor/lib/gz-sim-8/plugins/</code></li>
<li><strong>Where to look:</strong> every built-in plugin is one folder in <code>gz-sim/src/systems</code> — its header lists the SDF parameters; a working world per sensor in <code>gz-sim/examples/worlds</code> (previous slide)</li>
</ul>
<p><span class="src"><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3af.svg" data-marp-twemoji=""/> <a href="https://github.com/gazebosim/gz-sim/tree/gz-sim8/src/systems">github.com/gazebosim/gz-sim/tree/gz-sim8/src/systems</a></span></p>
<footer>KAU · Autonomous Robotic Systems Engineering · Lecture 1</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-footer="KAU · Autonomous Robotic Systems Engineering · Lecture 1" data-theme="kau" lang="en-US" data-marpit-pagination="17" style="--paginate:true;--footer:KAU · Autonomous Robotic Systems Engineering · Lecture 1;--theme:kau;" data-marpit-pagination-total="40">

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-footer="KAU · Autonomous Robotic Systems Engineering · Lecture 1" data-theme="kau" lang="en-US" data-marpit-pagination="19" style="--paginate:true;--footer:KAU · Autonomous Robotic Systems Engineering · Lecture 1;--theme:kau;" data-marpit-pagination-total="40">
<h2 id="what-a-fuel-model-brings">What a Fuel Model Brings</h2>
<p><code>COSTAR_HUSKY_SENSOR_CONFIG_1</code> — a Clearpath Husky:</p>
<ul>
<li>body — geometry, mass, inertia → <strong>physics works</strong>: it stands, falls, collides</li>
<li>wheels — 4 links, each attached to <code>base_link</code> by a revolute <strong>joint</strong>, the axle</li>
<li>sensors — RGBD camera, lidars, IMU; silent until their plugins are in <code>&lt;world&gt;</code></li>
<li><strong>Kinematics and control are not in the model</strong>: no plugin drives the wheels — it does not move</li>
<li>ROS integration: <strong>never</strong> included — you bridge it</li>
</ul>
<footer>KAU · Autonomous Robotic Systems Engineering · Lecture 1</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-footer="KAU · Autonomous Robotic Systems Engineering · Lecture 1" data-theme="kau" lang="en-US" data-marpit-pagination="20" style="--paginate:true;--footer:KAU · Autonomous Robotic Systems Engineering · Lecture 1;--theme:kau;" data-marpit-pagination-total="40">
<h2 id="making-the-husky-drive">Making the Husky Drive</h2>
<ul>
<li>A <strong>link</strong> is the wheel's body, a <strong>joint</strong> is its axle — <strong>there is no motor entity</strong> in SDF</li>
<li><strong>DiffDrive is motor and controller at once</strong>: listens on <code>/model/husky/cmd_vel</code>, computes wheel speeds, <strong>sets each wheel joint's velocity directly</strong></li>
<li>Inside the <code>&lt;include&gt;</code>: <code>left_joint</code> × 2 · <code>right_joint</code> × 2 · <code>wheel_separation</code> 0.571 m · <code>wheel_radius</code> 0.165 m</li>
<li>Velocity set directly = an <strong>ideal motor</strong>: no torque limit, no delay</li>
</ul>
<pre><code class="language-bash">$ gz topic -t /model/husky/cmd_vel -m gz.msgs.Twist -p <span class="hljs-string">&#x27;linear: {x: 0.5}&#x27;</span>
$ gz model -m husky --pose          <span class="hljs-comment"># 6 s later</span>
  - Pose [ XYZ (m) ] [ RPY (rad) ]:
    [3.200720 0.000041 0.132280]
</code></pre>
<p><span class="src"><img class="emoji" draggable="false" alt="📖" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4d6.svg" data-marp-twemoji=""/> <a href="https://gazebosim.org/docs/harmonic/moving_robot/">gazebosim.org/docs/harmonic/moving_robot</a></span></p>
<footer>KAU · Autonomous Robotic Systems Engineering · Lecture 1</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-paginate="true" data-footer="KAU · Autonomous Robotic Systems Engineering · Lecture 1" data-theme="kau" lang="en-US" data-marpit-pagination="21" style="--paginate:true;--footer:KAU · Autonomous Robotic Systems Engineering · Lecture 1;--theme:kau;" data-marpit-pagination-total="40">
<h2 id="ways-to-make-a-model-move--for-later">Ways to Make a Model Move — for Later</h2>
<table>
<thead>
<tr>
<th>What you command</th>
<th>Plugins</th>
<th>Input</th>
</tr>
</thead>
<tbody>
<tr>
<td>a whole wheeled base</td>
<td><strong>DiffDrive</strong> · <strong>AckermannSteering</strong> (car) · <strong>MecanumDrive</strong> · <strong>TrackedVehicle</strong></td>
<td>a body velocity</td>
</tr>
<tr>
<td>one joint at a time</td>
<td><strong>JointController</strong> (velocity, or force + PID) · <strong>JointPositionController</strong> · <strong>JointTrajectoryController</strong></td>
<td>a joint velocity, position or trajectory</td>
</tr>
<tr>
<td>a raw push</td>
<td><strong>ApplyJointForce</strong> · <strong>ApplyLinkWrench</strong></td>
<td>a force or torque</td>
</tr>
<tr>
<td>the robot, from ROS 2</td>
<td><code>ros2_control</code> + <code>gz_ros2_control</code> + <code>diff_drive_controller</code></td>
<td>the same controllers as on a real robot</td>
</tr>
</tbody>
</table>
<ul>
<li>The body, wheels and axles always come from the model; motion always comes from one of these</li>
<li>Next lecture: our own robot model with a plugin from this table · later lectures: <code>ros2_control</code></li>
</ul>
<p><span class="src"><img class="emoji" draggable="false" alt="📖" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4d6.svg" data-marp-twemoji=""/> <a href="https://control.ros.org/jazzy/">control.ros.org/jazzy</a></span></p>
<footer>KAU · Autonomous Robotic Systems Engineering · Lecture 1</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-paginate="true" data-footer="KAU · Autonomous Robotic Systems Engineering · Lecture 1" data-theme="kau" lang="en-US" data-marpit-pagination="22" style="--paginate:true;--footer:KAU · Autonomous Robotic Systems Engineering · Lecture 1;--theme:kau;" data-marpit-pagination-total="40">
<h2 id="running-a-world">Running a World</h2>
<pre><code class="language-bash">$ gz sim -s -v 4 free_fall.sdf
[Msg] Gazebo Sim Server v8.11.0
[Msg] Loading SDF world file[…/worlds/free_fall.sdf].
[Msg] Create service on [/world/free_fall/create_multiple] (async)
[Msg] Remove service on [/world/free_fall/remove] (async)
[Msg] Pose service on [/world/free_fall/set_pose] (async)
</code></pre>
<ul>
<li><code>-v 4</code> — log level: here UserCommands announces the services it just created</li>
<li>No <code>-r</code> → the world waits, paused, for Play or a service call · <code>-s</code> server only · <code>-g</code> GUI only</li>
</ul>
<p><span class="src"><img class="emoji" draggable="false" alt="📖" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4d6.svg" data-marp-twemoji=""/> <a href="https://gazebosim.org/docs/harmonic/getstarted/">gazebosim.org/docs/harmonic/getstarted</a></span></p>
<footer>KAU · Autonomous Robotic Systems Engineering · Lecture 1</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-paginate="true" data-footer="KAU · Autonomous Robotic Systems Engineering · Lecture 1" data-theme="kau" lang="en-US" data-marpit-pagination="23" style="--paginate:true;--footer:KAU · Autonomous Robotic Systems Engineering · Lecture 1;--theme:kau;" data-marpit-pagination-total="40">
<h2 id="looking-at-topics">Looking at Topics</h2>
<pre><code class="language-bash">$ gz topic -l
/air_pressure
/altimeter
/clock
/world/free_fall/pose/info
/world/free_fall/stats
…
$ gz topic -i -t /air_pressure
Publishers [Address, Message Type]:
  tcp://172.18.0.2:35229, gz.msgs.FluidPressure
No subscribers on topic [/air_pressure]
</code></pre>
<ul>
<li>The same verbs as <code>ros2 topic</code> — but these are <strong>Gazebo's</strong> topics; <code>ros2 topic list</code> shows none of them</li>
<li><code>gz topic -e -t /altimeter</code> prints every message as it arrives</li>
</ul>
<footer>KAU · Autonomous Robotic Systems Engineering · Lecture 1</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-paginate="true" data-footer="KAU · Autonomous Robotic Systems Engineering · Lecture 1" data-theme="kau" lang="en-US" data-marpit-pagination="24" style="--paginate:true;--footer:KAU · Autonomous Robotic Systems Engineering · Lecture 1;--theme:kau;" data-marpit-pagination-total="40">
<h2 id="where-altimeter-comes-from">Where <code>/altimeter</code> Comes From</h2>
<div class="cols">
<div>
<p><strong>1. A sensor on a link — <code>free_fall.sdf</code></strong></p>
<pre><code class="language-xml"><span class="hljs-tag">&lt;<span class="hljs-name">world</span> <span class="hljs-attr">name</span>=<span class="hljs-string">&quot;free_fall&quot;</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">plugin</span> <span class="hljs-attr">filename</span>=<span class="hljs-string">&quot;gz-sim-altimeter-system&quot;</span>
          <span class="hljs-attr">name</span>=<span class="hljs-string">&quot;gz::sim::systems::Altimeter&quot;</span>/&gt;</span>
  …
  <span class="hljs-tag">&lt;<span class="hljs-name">model</span> <span class="hljs-attr">name</span>=<span class="hljs-string">&quot;falling_box&quot;</span>&gt;</span>
    <span class="hljs-tag">&lt;<span class="hljs-name">link</span> <span class="hljs-attr">name</span>=<span class="hljs-string">&quot;link&quot;</span>&gt;</span>
      <span class="hljs-tag">&lt;<span class="hljs-name">sensor</span> <span class="hljs-attr">name</span>=<span class="hljs-string">&quot;altimeter&quot;</span> <span class="hljs-attr">type</span>=<span class="hljs-string">&quot;altimeter&quot;</span>&gt;</span>
        <span class="hljs-tag">&lt;<span class="hljs-name">update_rate</span>&gt;</span>30<span class="hljs-tag">&lt;/<span class="hljs-name">update_rate</span>&gt;</span>
        <span class="hljs-tag">&lt;<span class="hljs-name">topic</span>&gt;</span>altimeter<span class="hljs-tag">&lt;/<span class="hljs-name">topic</span>&gt;</span>   <span class="hljs-comment">&lt;!-- Gazebo topic --&gt;</span>
      <span class="hljs-tag">&lt;/<span class="hljs-name">sensor</span>&gt;</span>
    <span class="hljs-tag">&lt;/<span class="hljs-name">link</span>&gt;</span>
  <span class="hljs-tag">&lt;/<span class="hljs-name">model</span>&gt;</span>
<span class="hljs-tag">&lt;/<span class="hljs-name">world</span>&gt;</span>
</code></pre>
</div>
<div>
<p><strong>2. A bridge entry — <code>free_fall.yaml</code></strong></p>
<pre><code class="language-yaml"><span class="hljs-bullet">-</span> <span class="hljs-attr">ros_topic_name:</span> <span class="hljs-string">&quot;altimeter&quot;</span>
  <span class="hljs-attr">gz_topic_name:</span> <span class="hljs-string">&quot;altimeter&quot;</span>
  <span class="hljs-attr">ros_type_name:</span> <span class="hljs-string">&quot;ros_gz_interfaces/msg/Altimeter&quot;</span>
  <span class="hljs-attr">gz_type_name:</span> <span class="hljs-string">&quot;gz.msgs.Altimeter&quot;</span>
  <span class="hljs-attr">direction:</span> <span class="hljs-string">GZ_TO_ROS</span>
</code></pre>
<p><strong>3. The chain</strong></p>
<ul>
<li>the <strong>Altimeter plugin</strong> reads the link's simulated height every step</li>
<li>the <strong>sensor</strong> publishes it on Gazebo's <code>/altimeter</code></li>
<li>the <strong>bridge</strong> republishes it as ROS 2's <code>/altimeter</code></li>
<li><code>/air_pressure</code> is the same, with <code>air_pressure</code> and <strong>AirPressure</strong></li>
</ul>
</div>
</div>
<p><span class="src"><img class="emoji" draggable="false" alt="📖" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4d6.svg" data-marp-twemoji=""/> <a href="http://sdformat.org/spec?ver=1.11&amp;elem=sensor">sdformat.org/spec?ver=1.11&amp;elem=sensor</a></span></p>
<footer>KAU · Autonomous Robotic Systems Engineering · Lecture 1</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-paginate="true" data-footer="KAU · Autonomous Robotic Systems Engineering · Lecture 1" data-theme="kau" lang="en-US" data-marpit-pagination="25" style="--paginate:true;--footer:KAU · Autonomous Robotic Systems Engineering · Lecture 1;--theme:kau;" data-marpit-pagination-total="40">
<h2 id="looking-at-models">Looking at Models</h2>
<pre><code class="language-bash">$ gz model --list
Available models:
    - ground
    - falling_box
$ gz model -m falling_box --pose          <span class="hljs-comment"># a few seconds after Play</span>
Model: [8]
  - Name: falling_box
  - Pose [ XYZ (m) ] [ RPY (rad) ]:
    [0.000000 0.000000 4785.940000]
    [0.000000 -0.000000 0.000000]
</code></pre>
<ul>
<li><strong>A model</strong> is one named object: links + joints, and sometimes sensors and plugins</li>
<li><strong>Where models come from:</strong> a <code>&lt;model&gt;</code> written in the world file · an <code>&lt;include&gt;</code> from Fuel or a local folder · spawned at run time (a GUI shape button, the <code>create</code> service)</li>
<li>Here both <code>ground</code> and <code>falling_box</code> are written in <code>free_fall.sdf</code></li>
<li><code>gz model</code> reads the running world directly — no bridge, no ROS; <code>--link</code> / <code>--joint</code> list the parts: next lecture</li>
</ul>
<p><span class="src"><img class="emoji" draggable="false" alt="📖" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4d6.svg" data-marp-twemoji=""/> <a href="https://gazebosim.org/api/sim/8/model_command.html">gazebosim.org/api/sim/8/model_command.html</a></span></p>
<footer>KAU · Autonomous Robotic Systems Engineering · Lecture 1</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-paginate="true" data-footer="KAU · Autonomous Robotic Systems Engineering · Lecture 1" data-theme="kau" lang="en-US" data-marpit-pagination="26" style="--paginate:true;--footer:KAU · Autonomous Robotic Systems Engineering · Lecture 1;--theme:kau;" data-marpit-pagination-total="40">
<h2 id="headless">Headless</h2>
<pre><code class="language-bash">$ gz sim -s -r free_fall.sdf &amp;        <span class="hljs-comment"># -s: server only, no window</span>
$ gz topic -l                         <span class="hljs-comment"># use it through topics...</span>
/air_pressure
/altimeter
/clock
…
$ gz model --list                     <span class="hljs-comment"># ...and through the world state</span>
    - ground
    - falling_box
$ gz sim -g                           <span class="hljs-comment"># later, on a machine with a display: attach a window</span>
</code></pre>
<ul>
<li>Physics and sensors run exactly as with a window — the window is only a client</li>
<li>Everything you would click is also a topic or a service</li>
<li>Where it pays: containers, remote machines, CI, long runs</li>
</ul>
<p><span class="src"><img class="emoji" draggable="false" alt="📖" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4d6.svg" data-marp-twemoji=""/> <a href="https://gazebosim.org/docs/harmonic/getstarted/">gazebosim.org/docs/harmonic/getstarted</a></span></p>
<footer>KAU · Autonomous Robotic Systems Engineering · Lecture 1</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-paginate="true" data-footer="KAU · Autonomous Robotic Systems Engineering · Lecture 1" data-theme="kau" lang="en-US" data-marpit-pagination="27" style="--paginate:true;--footer:KAU · Autonomous Robotic Systems Engineering · Lecture 1;--theme:kau;" data-marpit-pagination-total="40">
<h2 id="cameras-without-a-display">Cameras Without a Display</h2>
<ul>
<li>The camera image is rendered <strong>by Gazebo</strong>, with OGRE, where the server runs — RViz only draws the finished image it receives</li>
<li>So rendering is needed even with no Gazebo window and no RViz at all</li>
<li>No display on that machine (server, container, SSH) → OGRE renders off-screen, through EGL</li>
<li><code>--headless-rendering</code> asks for that up front. Without it OGRE first looks for a display, then falls back:</li>
</ul>
<pre><code class="language-bash">$ gz sim -s -r rgbd.sdf
[Wrn] [Ogre2RenderEngine.cc:551] Unable to open display: . Trying to run <span class="hljs-keyword">in</span> headless mode.
</code></pre>
<ul>
<li>Checked in our container, software OpenGL, no GPU: the RGBD camera streams ~30 Hz with the flag and without it</li>
</ul>
<p><span class="src"><img class="emoji" draggable="false" alt="📖" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4d6.svg" data-marp-twemoji=""/> <a href="https://gazebosim.org/api/sim/8/headless_rendering.html">gazebosim.org/api/sim/8/headless_rendering.html</a></span></p>
<footer>KAU · Autonomous Robotic Systems Engineering · Lecture 1</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-paginate="true" data-footer="KAU · Autonomous Robotic Systems Engineering · Lecture 1" data-theme="kau" lang="en-US" data-marpit-pagination="28" style="--paginate:true;--footer:KAU · Autonomous Robotic Systems Engineering · Lecture 1;--theme:kau;" data-marpit-pagination-total="40">
<h2 id="web-visualization">Web Visualization</h2>
<ul>
<li><strong>Why:</strong> the server has no window — a container, a remote machine — and you still want to see the scene</li>
<li><strong>What you see:</strong> the 3D scene — models and their moving poses; not the full GUI</li>
<li>Checked: the server in our container answers on port 9002 — <code>HTTP/1.1 101 Switching Protocols</code></li>
<li><strong>How:</strong> <code>gz sim -s -r world.sdf</code> → <code>gz launch -v 4 websocket.gzlaunch</code> → app.gazebosim.org/visualization → Connect</li>
<li>Needs the websocket server from <code>gz-launch</code> — a separate Gazebo component, installed on its own</li>
</ul>
<p><span class="src"><img class="emoji" draggable="false" alt="📖" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4d6.svg" data-marp-twemoji=""/> <a href="https://gazebosim.org/docs/harmonic/web_visualization/">gazebosim.org/docs/harmonic/web_visualization</a></span></p>
<footer>KAU · Autonomous Robotic Systems Engineering · Lecture 1</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-paginate="true" data-footer="KAU · Autonomous Robotic Systems Engineering · Lecture 1" data-class="section" data-theme="kau" lang="en-US" class="section" data-marpit-pagination="29" style="--paginate:true;--footer:KAU · Autonomous Robotic Systems Engineering · Lecture 1;--class:section;--theme:kau;" data-marpit-pagination-total="40">
<h1 id="gazebo-%E2%86%94-ros-2">Gazebo ↔ ROS 2</h1>
<p><em>Only what you bridge exists in ROS</em></p>
<footer>KAU · Autonomous Robotic Systems Engineering · Lecture 1</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-paginate="true" data-footer="KAU · Autonomous Robotic Systems Engineering · Lecture 1" data-theme="kau" lang="en-US" data-marpit-pagination="30" style="--paginate:true;--footer:KAU · Autonomous Robotic Systems Engineering · Lecture 1;--theme:kau;" data-marpit-pagination-total="40">
<h2 id="the-bridge">The Bridge</h2>
<ul>
<li>Gazebo has its own transport; ROS 2 sees <strong>only the topics you bridge</strong> — nothing is bridged by default</li>
<li><strong>One</strong> <code>parameter_bridge</code> process carries any number of topics — one entry per topic</li>
<li><code>/topic@ros_type[gz_type</code> — <code>[</code> Gazebo → ROS · <code>]</code> ROS → Gazebo · <code>@</code> both ways</li>
<li>Frame names are translated on the way: <code>falling_box::link::altimeter</code> in Gazebo arrives as <code>falling_box/link/altimeter</code></li>
</ul>
<pre><code class="language-bash">$ ros2 run ros_gz_bridge parameter_bridge <span class="hljs-string">&#x27;/rgbd_camera/image@sensor_msgs/msg/Image[gz.msgs.Image&#x27;</span>
</code></pre>
<p><span class="src"><img class="emoji" draggable="false" alt="▶️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/25b6.svg" data-marp-twemoji=""/> <a href="https://gazebosim.org/docs/harmonic/ros2_integration/">gazebosim.org/docs/harmonic/ros2_integration</a> · <img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3af.svg" data-marp-twemoji=""/> <a href="https://github.com/gazebosim/ros_gz">github.com/gazebosim/ros_gz</a></span></p>
<footer>KAU · Autonomous Robotic Systems Engineering · Lecture 1</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-paginate="true" data-footer="KAU · Autonomous Robotic Systems Engineering · Lecture 1" data-theme="kau" lang="en-US" data-marpit-pagination="31" style="--paginate:true;--footer:KAU · Autonomous Robotic Systems Engineering · Lecture 1;--theme:kau;" data-marpit-pagination-total="40">
<h2 id="one-sensor-four-topics--the-bridge-file">One Sensor, Four Topics — the Bridge File</h2>
<div class="cols">
<div>
<pre><code class="language-yaml"><span class="hljs-comment"># Gazebo -&gt; ROS 2: one entry per topic</span>
<span class="hljs-bullet">-</span> <span class="hljs-attr">ros_topic_name:</span> <span class="hljs-string">&quot;rgbd_camera/image&quot;</span>
  <span class="hljs-attr">gz_topic_name:</span> <span class="hljs-string">&quot;rgbd_camera/image&quot;</span>
  <span class="hljs-attr">ros_type_name:</span> <span class="hljs-string">&quot;sensor_msgs/msg/Image&quot;</span>
  <span class="hljs-attr">gz_type_name:</span> <span class="hljs-string">&quot;gz.msgs.Image&quot;</span>
  <span class="hljs-attr">direction:</span> <span class="hljs-string">GZ_TO_ROS</span>      <span class="hljs-comment"># colour picture</span>

<span class="hljs-bullet">-</span> <span class="hljs-attr">ros_topic_name:</span> <span class="hljs-string">&quot;rgbd_camera/depth_image&quot;</span>
  <span class="hljs-attr">gz_topic_name:</span> <span class="hljs-string">&quot;rgbd_camera/depth_image&quot;</span>
  <span class="hljs-attr">ros_type_name:</span> <span class="hljs-string">&quot;sensor_msgs/msg/Image&quot;</span>
  <span class="hljs-attr">gz_type_name:</span> <span class="hljs-string">&quot;gz.msgs.Image&quot;</span>
  <span class="hljs-attr">direction:</span> <span class="hljs-string">GZ_TO_ROS</span>      <span class="hljs-comment"># metres per pixel</span>
</code></pre>
</div>
<div>
<pre><code class="language-yaml"><span class="hljs-bullet">-</span> <span class="hljs-attr">ros_topic_name:</span> <span class="hljs-string">&quot;rgbd_camera/points&quot;</span>
  <span class="hljs-attr">gz_topic_name:</span> <span class="hljs-string">&quot;rgbd_camera/points&quot;</span>
  <span class="hljs-attr">ros_type_name:</span> <span class="hljs-string">&quot;sensor_msgs/msg/PointCloud2&quot;</span>
  <span class="hljs-attr">gz_type_name:</span> <span class="hljs-string">&quot;gz.msgs.PointCloudPacked&quot;</span>
  <span class="hljs-attr">direction:</span> <span class="hljs-string">GZ_TO_ROS</span>      <span class="hljs-comment"># depth as 3D points</span>

<span class="hljs-bullet">-</span> <span class="hljs-attr">ros_topic_name:</span> <span class="hljs-string">&quot;rgbd_camera/camera_info&quot;</span>
  <span class="hljs-attr">gz_topic_name:</span> <span class="hljs-string">&quot;rgbd_camera/camera_info&quot;</span>
  <span class="hljs-attr">ros_type_name:</span> <span class="hljs-string">&quot;sensor_msgs/msg/CameraInfo&quot;</span>
  <span class="hljs-attr">gz_type_name:</span> <span class="hljs-string">&quot;gz.msgs.CameraInfo&quot;</span>
  <span class="hljs-attr">direction:</span> <span class="hljs-string">GZ_TO_ROS</span>      <span class="hljs-comment"># intrinsics: depth -&gt; 3D</span>
</code></pre>
</div>
</div>
<p><code>ros2 run ros_gz_bridge parameter_bridge --ros-args -p config_file:=rgbd.yaml</code> — all four in one process; bridge only what you consume</p>

<h2 id="in-ros-2-while-it-falls">In ROS 2, While It Falls</h2>
<pre><code class="language-bash">$ ros2 topic <span class="hljs-built_in">echo</span> /altimeter --once
header:
  stamp: {sec: 13, nanosec: 497000000}
  frame_id: falling_box/link/altimeter
vertical_position: -892.69          <span class="hljs-comment"># metres below the start</span>
vertical_velocity: -132.27          <span class="hljs-comment"># m/s, and growing</span>
vertical_reference: 5000.0
$ ros2 topic <span class="hljs-built_in">echo</span> /air_pressure --field fluid_pressure --once
61701.83                            <span class="hljs-comment"># Pa — it was ~54 000 at 5000 m</span>
</code></pre>
<ul>
<li><strong>Nothing here is measured</strong> — Gazebo computes both values from the box's simulated position, every step</li>
<li><code>/altimeter</code> ← <code>&lt;sensor type=&quot;altimeter&quot;&gt;</code> on the box's link + the <strong>Altimeter</strong> plugin in <code>&lt;world&gt;</code>: height relative to where the box started</li>
<li><code>/air_pressure</code> ← <code>&lt;sensor type=&quot;air_pressure&quot;&gt;</code> + the <strong>AirPressure</strong> plugin: standard-atmosphere pressure at that height</li>
<li>Gazebo topics <code>gz.msgs.Altimeter</code>, <code>gz.msgs.FluidPressure</code> → the bridge → ROS 2 <code>ros_gz_interfaces/msg/Altimeter</code>, <code>sensor_msgs/msg/FluidPressure</code></li>
<li>The stamp is <strong>simulation</strong> time, not the clock on the wall</li>
</ul>

<li>Lands at <strong>~31.9 s</strong> of simulated time — exactly √(2 · 5000 / 9.81) ≈ 31.9 s; pressure <strong>54.1 → 101.3 kPa</strong></li>
<li>Both curves come from one simulated position — the sensors only translate it</li>
</ul>
<footer>KAU · Autonomous Robotic Systems Engineering · Lecture 1</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="34" data-paginate="true" data-footer="KAU · Autonomous Robotic Systems Engineering · Lecture 1" data-theme="kau" lang="en-US" data-marpit-pagination="34" style="--paginate:true;--footer:KAU · Autonomous Robotic Systems Engineering · Lecture 1;--theme:kau;" data-marpit-pagination-total="40">
<h2 id="rviz--seeing-what-ros-sees">RViz — Seeing What ROS Sees</h2>
<ul>
<li>A ROS 2 viewer: draws whatever is on ROS topics — it simulates nothing, and it is not part of Gazebo</li>
<li><strong>Sensors:</strong> camera images, depth, point clouds, laser scans, range cones</li>
<li><strong>Robots:</strong> the robot model, TF frames, joint efforts, odometry</li>
<li><strong>Navigation:</strong> maps and costmap cells, planned paths, poses; tools to set a pose estimate and send a goal</li>
<li><strong>Anything else:</strong> markers — shapes your own node draws</li>
<li><strong>Lab 0.1:</strong> Image on <code>/rgbd_camera/image</code> · PointCloud2 on <code>/rgbd_camera/points</code> · Fixed Frame <code>rgbd_camera/link/rgbd_camera</code></li>
</ul>
<p><span class="src"><img class="emoji" draggable="false" alt="📖" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4d6.svg" data-marp-twemoji=""/> <a href="https://docs.ros.org/en/jazzy/Tutorials/Intermediate/RViz/RViz-User-Guide/RViz-User-Guide.html">docs.ros.org/en/jazzy/Tutorials/Intermediate/RViz/RViz-User-Guide/RViz-User-Guide.html</a> · <img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3af.svg" data-marp-twemoji=""/> <a href="https://github.com/ros2/rviz">github.com/ros2/rviz</a></span></p>
<footer>KAU · Autonomous Robotic Systems Engineering · Lecture 1</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="35" data-paginate="true" data-footer="KAU · Autonomous Robotic Systems Engineering · Lecture 1" data-theme="kau" lang="en-US" data-marpit-pagination="35" style="--paginate:true;--footer:KAU · Autonomous Robotic Systems Engineering · Lecture 1;--theme:kau;" data-marpit-pagination-total="40">
<h2 id="why-simulation-time">Why Simulation Time</h2>
<ul>
<li>A simulation runs slower or faster than reality, pauses, steps — the wall clock knows none of this</li>
<li><code>use_sim_time: true</code> → a node's time comes from <code>/clock</code>, published by <strong>Gazebo</strong></li>
<li><code>use_sim_time: false</code> — the default → the computer's <strong>system clock</strong></li>
</ul>
<p><span class="src"><img class="emoji" draggable="false" alt="📖" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4d6.svg" data-marp-twemoji=""/> <a href="https://design.ros2.org/articles/clock_and_time.html">design.ros2.org/articles/clock_and_time.html</a></span></p>
<footer>KAU · Autonomous Robotic Systems Engineering · Lecture 1</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="36" data-paginate="true" data-footer="KAU · Autonomous Robotic Systems Engineering · Lecture 1" data-theme="kau" lang="en-US" data-marpit-pagination="36" style="--paginate:true;--footer:KAU · Autonomous Robotic Systems Engineering · Lecture 1;--theme:kau;" data-marpit-pagination-total="40">
<h2 id="lab-01--what-you-do">Lab 0.1 — What You Do</h2>
<p>A sensor in a simple world → its data in ROS 2. You choose the sensor. Not graded.</p>
<table>
<thead>
<tr>
<th></th>
<th>A · RGBD camera</th>
<th>B · barometer + altimeter</th>
</tr>
</thead>
<tbody>
<tr>
<td>world</td>
<td>Gazebo's <code>sensors_demo.sdf</code> (level 0) · your <code>rgbd.sdf</code> (level 1)</td>
<td>Gazebo's <code>sensors.sdf</code> (level 0) · your <code>pressure.sdf</code> — a box dropped from 1000 m (level 1)</td>
</tr>
<tr>
<td>plugins</td>
<td>defaults + <strong>Sensors</strong> with <code>ogre2</code> — rendered</td>
<td>defaults + <strong>AirPressure</strong> + <strong>Altimeter</strong></td>
</tr>
<tr>
<td>Gazebo topics</td>
<td>4 × <code>/rgbd_camera/…</code></td>
<td><code>/air_pressure</code>, <code>/altimeter</code></td>
</tr>
<tr>
<td>bridge</td>
<td>4 entries — <code>rgbd.yaml</code></td>
<td>2 entries — <code>pressure.yaml</code></td>
</tr>
<tr>
<td>check</td>
<td><code>ros2 topic hz /rgbd_camera/image</code> → ~30 Hz</td>
<td><code>ros2 topic echo /altimeter --field vertical_position</code> falls to −1000</td>
</tr>
<tr>
<td>see it</td>
<td>RViz: Image + PointCloud2, Fixed Frame <code>rgbd_camera/link/rgbd_camera</code></td>
<td>the listener's log: height, speed, pressure</td>
</tr>
<tr>
<td>your code</td>
<td><code>rgbd_listener</code> — image processing</td>
<td><code>pressure_listener</code> — e.g. height from pressure</td>
</tr>
</tbody>
</table>
<p><strong>Steps:</strong> world → run it (<code>-s</code> without a display) → <code>gz topic -l</code> → bridge → check in ROS 2 → look at it</p>
<p><span class="src"><img class="emoji" draggable="false" alt="▶️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/25b6.svg" data-marp-twemoji=""/> <a href="https://gazebosim.org/docs/harmonic/sensors/">gazebosim.org/docs/harmonic/sensors</a> · <img class="emoji" draggable="false" alt="📖" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4d6.svg" data-marp-twemoji=""/> <a href="https://gazebosim.org/docs/harmonic/ros2_launch_gazebo/">gazebosim.org/docs/harmonic/ros2_launch_gazebo</a></span></p>
<footer>KAU · Autonomous Robotic Systems Engineering · Lecture 1</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="37" data-paginate="true" data-footer="KAU · Autonomous Robotic Systems Engineering · Lecture 1" data-theme="kau" lang="en-US" data-marpit-pagination="37" style="--paginate:true;--footer:KAU · Autonomous Robotic Systems Engineering · Lecture 1;--theme:kau;" data-marpit-pagination-total="40">
<h2 id="lab-01--files-level-1">Lab 0.1 — Files, Level 1</h2>
<pre><code>gz_rgbd_lab/                    # option A; gz_pressure_lab/ has exactly the same shape
├── package.xml                 # dependencies: rclpy, sensor_msgs, ros_gz_sim, ros_gz_bridge
├── setup.py                    # installs worlds/, config/, launch/; makes the listener runnable
├── setup.cfg                   # where `ros2 run` finds the node — generated
├── resource/gz_rgbd_lab        # empty marker file — generated
├── launch/rgbd.launch.py       # Gazebo + bridge + listener in one command; gui:=true for a window
├── worlds/rgbd.sdf             # plugins, ground, light, a box, a sphere, the RGBD camera
├── config/bridge.yaml          # the bridge, 4 entries (option B: 2)
└── gz_rgbd_lab/
    ├── __init__.py             # empty
    └── rgbd_listener.py        # image + depth; TODO: your processing
</code></pre>
<pre><code class="language-bash">$ colcon build --packages-select gz_rgbd_lab &amp;&amp; <span class="hljs-built_in">source</span> install/setup.bash
$ ros2 launch gz_rgbd_lab rgbd.launch.py                        <span class="hljs-comment"># option B: gz_pressure_lab pressure.launch.py</span>
</code></pre>
<p>Level 0 needs none of these files — only the world that ships with Gazebo and commands.</p>
<footer>KAU · Autonomous Robotic Systems Engineering · Lecture 1</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="38" data-paginate="true" data-footer="KAU · Autonomous Robotic Systems Engineering · Lecture 1" data-theme="kau" lang="en-US" data-marpit-pagination="38" style="--paginate:true;--footer:KAU · Autonomous Robotic Systems Engineering · Lecture 1;--theme:kau;" data-marpit-pagination-total="40">
<h2 id="next-lab--what-you-do">Next Lab — What You Do</h2>
<p>A model with sensors from Fuel, in your own world, one of its sensors in ROS 2. <strong>Graded.</strong></p>
<ol>
<li><strong>Pick a model with sensors</strong> — e.g. <code>COSTAR_HUSKY_SENSOR_CONFIG_1</code>: an RGBD camera, an IMU, lidars</li>
<li><strong>Write your own world</strong> — <code>&lt;include&gt;</code> the model by its Fuel URL; list the plugins: the three defaults + <strong>Sensors (<code>ogre2</code>)</strong> for its cameras + <strong>Imu</strong> for its IMU</li>
<li><strong>Run it</strong> — with a window or headless; the first run downloads the model, needs the network</li>
<li><strong>Find its sensors</strong> — <code>gz topic -l</code>; a sensor without its own <code>&lt;topic&gt;</code> publishes under its full path:<br />
<code>/world/&lt;world&gt;/model/husky/link/base_link/sensor/camera_front/image</code> · <code>gz.msgs.Image</code><br />
<code>/world/&lt;world&gt;/model/husky/link/base_link/sensor/imu_sensor/imu</code> · <code>gz.msgs.IMU</code></li>
<li><strong>Bridge one sensor into ROS 2</strong> — a YAML entry from that long Gazebo name to a short ROS name</li>
<li><strong>Show it</strong> — <code>ros2 topic hz</code>, and RViz with the display that matches the type</li>
<li><strong>README</strong> — how to run it from zero, which topic, what you saw</li>
</ol>
<p><span class="src"><img class="emoji" draggable="false" alt="📖" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4d6.svg" data-marp-twemoji=""/> <a href="https://gazebosim.org/docs/harmonic/ros_gz_project_template_guide/">gazebosim.org/docs/harmonic/ros_gz_project_template_guide</a></span></p>
<footer>KAU · Autonomous Robotic Systems Engineering · Lecture 1</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="39" data-paginate="true" data-footer="KAU · Autonomous Robotic Systems Engineering · Lecture 1" data-theme="kau" lang="en-US" data-marpit-pagination="39" style="--paginate:true;--footer:KAU · Autonomous Robotic Systems Engineering · Lecture 1;--theme:kau;" data-marpit-pagination-total="40">
<h2 id="next-lab--files">Next Lab — Files</h2>
<pre><code>my_fuel_lab/
├── package.xml               # dependencies: ros_gz_sim, ros_gz_bridge (+ rviz2)
├── setup.py                  # installs worlds/, config/, launch/ (+ rviz/)
├── setup.cfg                 # where ros2 finds things — generated
├── resource/my_fuel_lab      # empty marker file — generated
├── worlds/fuel_world.sdf     # plugins (defaults + Sensors + the sensor's own), ground, light, &lt;include&gt; of the model
├── config/bridge.yaml        # one entry: the model's full Gazebo topic -&gt; a short ROS 2 topic
├── launch/fuel.launch.py     # Gazebo + the bridge (+ rviz2 with your layout), one command
├── rviz/fuel.rviz            # optional: a saved RViz layout with the right display
└── README.md                 # run from zero · which sensor and topic · what you saw
</code></pre>
<ul>
<li>No Python node is required — configuration only</li>
<li>The model comes from Fuel at run time and is cached in <code>~/.gz/fuel</code>; nothing of it goes into your repository</li>
<li>Check before you bridge: <code>gz topic -i -t &lt;topic&gt;</code> shows the Gazebo type the YAML entry needs</li>
</ul>
<footer>KAU · Autonomous Robotic Systems Engineering · Lecture 1</footer>
</section>
